<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外院互助 - 发布任务 · 校内接单</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="../favicon.svg">
  <link rel="stylesheet" href="style.css?v=20260825-0942">
  <script>(function(){try{var t=localStorage.getItem('waiyuan-web-theme-v1')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta property="og:title" content="外院互助">
  <meta property="og:description" content="校内互助：发布任务、在线接单，线下当面结算">
  <meta property="og:url" content="https://free60127.top/paotui/">
  <meta name="theme-color" content="#28634f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <header class="topbar">
    <div class="brand">🛵 外院互助</div>
    <div class="auth-area" id="auth-area">
      <button id="theme-toggle" class="btn small ghost" aria-label="切换深色模式">🌙</button>
      <button id="auth-open-btn" class="btn small">👤 登录 / 注册</button>
      <button id="auth-email" class="btn small ghost hidden"></button>
      <button id="auth-logout-btn" class="btn small ghost hidden">退出</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="open">待接单</button>
    <button class="tab" data-tab="doing">进行中</button>
    <button class="tab" data-tab="done">已完成</button>
    <button class="tab" data-tab="mine-posted">我发布的</button>
    <button class="tab" data-tab="mine-taken">我接的</button>
  </nav>
  <main>
    <div id="task-list" class="task-list"></div>
    <div id="empty" class="empty hidden">这里还没有任务～点右下角发布第一个吧</div>
    <button id="load-more" class="load-more hidden">加载更多</button>
  <button id="share-card-btn" class="share-card-btn">📤 分享卡片<small>生成海报发给同学，帮外院互助拉点人气</small></button>
  <div class="install-site" id="install-site" hidden>
    <div class="install-site-text"><b>📱 添加到主屏幕 <i class="ios-badge">iOS 专用</i></b><small id="install-hint">仅 iOS 可用：用 Safari 打开，点底部「分享」→「添加到主屏幕」，像 App 一样从桌面直接打开</small></div>
    <button type="button" id="install-btn">立即安装</button>
  </div>
  <a class="install-apk" href="https://free60127.top/apk/waiyuan-paotui.apk" download="外院互助.apk">
    <span class="install-apk-text"><b>⬇️ 下载安卓版 App</b><small>APK 直装 · 网页内容自动更新，App 版本更新需重新下载安装</small></span>
    <b class="install-apk-btn">下载 APK</b>
  </a>
  </main>
  <button id="fab-publish" class="fab">＋ 发布任务</button>

  <!-- 发布弹窗 -->
  <div id="publish-modal" class="modal hidden">
    <div class="modal-box">
      <h3>发布任务</h3>
      <div class="field"><label>分类 *</label>
        <div class="cat-chips" id="cat-chips">
          <button type="button" class="cat-chip" data-cat="pickup-food">🍜 取外卖</button>
          <button type="button" class="cat-chip" data-cat="pickup-parcel">📦 取快递</button>
          <button type="button" class="cat-chip" data-cat="sell-item">🛍️ 出闲置</button>
          <button type="button" class="cat-chip" data-cat="request-info">📚 求资料</button>
          <button type="button" class="cat-chip" data-cat="other">✨ 其他</button>
        </div>
      </div>
      <div class="field"><label>任务图片（选填，最多 3 张，自动压缩 ≤200KB）<span class="dp-count" id="pub-img-count">0 / 3</span></label>
        <input id="pub-files" type="file" accept="image/*" multiple>
        <div id="pub-preview" class="dp-preview"></div>
      </div>
      <div class="field"><label>标题 *</label><input id="p-title" maxlength="60" placeholder="帮取快递 / 带饭…"></div>
      <div class="field"><label>详细描述</label><textarea id="p-desc" maxlength="500" rows="3" placeholder="取件码、具体要求…"></textarea></div>
      <div class="field-row">
        <div class="field"><label>赏金（元）*</label><input id="p-reward" type="number" min="0" max="99999" placeholder="5"></div>
        <div class="field"><label>截止时间（选填）</label><input id="p-deadline" type="datetime-local"></div>
      </div>
      <div class="field"><label>取件地点 *</label><input id="p-pickup" maxlength="50" placeholder="菜鸟驿站"></div>
      <div class="field"><label>送达地点 *</label><input id="p-dropoff" maxlength="50" placeholder="女生宿舍 3 栋"></div>
      <div class="field"><label>联系方式（选填）</label><input id="p-contact" maxlength="100" placeholder="手机号 / 微信号"></div>
      <div class="hint" id="pub-hint"></div>
      <div class="modal-actions">
        <button id="pub-cancel" class="btn ghost">取消</button>
        <button id="pub-submit" class="btn primary">发布</button>
      </div>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div id="detail-modal" class="modal hidden">
    <div class="modal-box">
      <div id="detail-body"></div>
    </div>
  </div>

  <!-- 评价弹窗 -->
  <div id="review-modal" class="modal hidden">
    <div class="modal-box">
      <h3>评价对方</h3>
      <div class="field"><label>评分</label>
        <div class="stars" id="rv-stars">
          <button type="button" class="star on" data-s="1">★</button><button type="button" class="star on" data-s="2">★</button><button type="button" class="star on" data-s="3">★</button><button type="button" class="star on" data-s="4">★</button><button type="button" class="star on" data-s="5">★</button>
        </div>
        <span class="rv-label" id="rv-label">非常满意</span>
      </div>
      <div class="field"><label>评语（选填，200 字内）</label><textarea id="rv-comment" maxlength="200" rows="3" placeholder="服务怎么样？"></textarea></div>
      <div class="hint" id="rv-hint"></div>
      <div class="modal-actions">
        <button id="rv-cancel" class="btn ghost">取消</button>
        <button id="rv-submit" class="btn primary">提交评价</button>
      </div>
    </div>
  </div>

  <!-- 申诉弹窗 -->
  <div id="dispute-modal" class="modal hidden">
    <div class="modal-box">
      <h3>⚠️ 申诉</h3>
      <div class="field"><label>理由 *（≤60 字）</label><input id="dp-reason" maxlength="60" placeholder="对方没有履约 / 联系不上…"></div>
      <div class="field"><label>详细说明（选填，500 字内）</label><textarea id="dp-detail" maxlength="500" rows="3" placeholder="发生了什么？"></textarea></div>
      <div class="field"><label>证据图片（选填，最多 3 张，自动压缩 ≤200KB）<span class="dp-count" id="dp-count">0 / 3</span></label>
        <input id="dp-files" type="file" accept="image/*" multiple>
        <div id="dp-preview" class="dp-preview"></div>
      </div>
      <div class="hint" id="dp-hint"></div>
      <div class="modal-actions">
        <button id="dp-cancel" class="btn ghost">取消</button>
        <button id="dp-submit" class="btn primary">提交申诉</button>
      </div>
    </div>
  </div>

  <!-- 分享卡片弹窗 -->
  <div id="share-modal" class="modal hidden">
    <div class="modal-box">
      <h3>📤 分享卡片</h3>
      <div class="tabs mini" id="share-tabs">
        <button class="tab active" data-stype="platform">🛵 平台卡</button>
        <button class="tab" data-stype="task">📋 任务卡</button>
      </div>
      <div class="share-preview" id="share-preview"></div>
      <div class="modal-actions">
        <button id="share-cancel" class="btn ghost">关闭</button>
        <button id="share-save" class="btn primary">💾 保存图片</button>
      </div>
      <div class="hint">长按图片可保存 / 转发给同学；任务卡需要先打开过某个任务详情</div>
      <div id="qr-sheet" class="qr-sheet hidden">
        <div class="qr-sheet-title">🔍 二维码操作</div>
        <button type="button" class="btn ghost" id="qr-copy">📋 复制链接</button>
        <button type="button" class="btn ghost" id="qr-wechat">📱 用微信扫一扫</button>
        <button type="button" class="btn ghost" id="qr-save">💾 保存二维码</button>
        <button type="button" class="btn ghost" id="qr-close">关闭</button>
      </div>
    </div>
  </div>

  <!-- 登录弹窗 -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="auth-title">登录</h3>
      <div class="tabs mini" id="auth-tabs">
        <button class="tab active" data-aview="login">登录</button>
        <button class="tab" data-aview="register">注册</button>
      </div>
      <div class="field"><label>邮箱</label><input id="auth-email-input" type="email" placeholder="you@example.com"></div>
      <div class="field" id="nick-field" hidden><label>昵称（≤20 字）</label><input id="auth-nick-input" maxlength="20" placeholder="同学怎么称呼你"></div>
      <div class="field"><label>密码（≥8 位）</label><input id="auth-password-input" type="password"></div>
      <div class="hint" id="auth-hint"></div>
      <div class="modal-actions">
        <button id="auth-close" class="btn ghost">关闭</button>
        <button id="auth-submit" class="btn primary">登录</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="../common.js?v=20260825-0942"></script>
  <script src="qrcode.js?v=20260825-0942"></script>
  <script src="../学习中心/auth.js?v=20260825-0942"></script>
  <script src="../lightbox.js?v=20260825-0942"></script>
  <script src="share-card.js?v=20260825-0942"></script>
  <script src="app.js?v=20260825-0942"></script>
</body>
</html>
