  <style>:root{--green:#28634f;--cream:#fffefa;--ink:#17211f;--muted:#73817b;--line:#dfe6df;--orange:#d97845}*{box-sizing:border-box}body{margin:0;background:#f7f8f3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}button{font:inherit;cursor:pointer}#app{max-width:760px;margin:0 auto;padding:28px 18px 96px}.brand{display:flex;gap:12px;align-items:center;margin:4px 0 36px}.mark,.entry>b{display:grid;place-items:center;background:var(--green);color:#fff;border-radius:12px;font-size:28px;width:54px;height:54px}.brand strong{font-size:25px;display:block}.brand small{display:block;letter-spacing:2px;color:#87918d;font-size:11px}.hero small{font-weight:800;color:var(--orange);letter-spacing:1.5px}.hero h1{font-size:34px;line-height:1.2;margin:10px 0}.hero h1 span{color:var(--green)}.hero p,.notice{color:var(--muted);margin:0 0 22px}.bank-list{display:grid;gap:14px}.bank-card,.entry,.paper-bank{width:100%;border:1px solid var(--line);background:var(--cream);border-radius:18px;text-align:left;padding:20px;box-shadow:0 8px 24px rgba(35,61,49,.05)}.bank-card>div,.entry{display:flex;align-items:center;justify-content:space-between}.bank-card b{font-size:14px;padding:5px 9px;background:var(--green);color:#fff;border-radius:6px}.bank-card em,.entry em{font-style:normal;color:var(--orange);font-size:14px}.bank-card h2{margin:14px 0 3px;font-size:21px}.bank-card p{margin:0;color:var(--muted);font-size:14px}.bank-card small{display:block;color:var(--green);margin-top:16px}.bank-card footer{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.bank-card i{font-style:normal;font-size:12px;color:#586b64;background:#edf4ef;border-radius:5px;padding:4px 7px}.entry{margin-top:18px;gap:14px}.entry span{flex:1}.entry strong,.entry small{display:block}.entry strong{font-size:20px}.entry small{color:var(--muted);font-size:13px}.mistake-entry{background:#fff6ef;border-color:#efc6b6}.mistake-entry>b{background:var(--orange)}.back{border:0;background:transparent;color:var(--green);padding:0;font-size:16px;margin-bottom:24px}.paper-bank{margin:15px 0}.paper-bank h2{margin:0;font-size:20px}.paper-bank p{color:var(--muted);margin:5px 0 13px;font-size:13px}.paper-bank div{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.paper-bank button,.actions button{border:1px solid #c9ddcf;border-radius:11px;background:#f1f7f2;color:var(--green);padding:12px;font-weight:700}.paper-bank button small{display:block;font-weight:400;color:var(--muted);font-size:11px}.compact{margin-bottom:12px}.stats{display:flex;gap:38px;margin:18px 0}.stats span{display:grid;color:var(--muted);font-size:14px}.stats b{font-size:35px;color:var(--green);line-height:1.1}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 15px;border-bottom:1px solid var(--line);margin-bottom:16px}.tabs button{border:0;background:transparent;color:#65736d;white-space:nowrap;font-size:16px;padding:10px 15px;font-weight:700;border-radius:24px}.tabs button.active{background:var(--green);color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.actions button{padding:9px 15px}.notice{font-size:14px}.card{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 24px rgba(35,61,49,.045)}.qrow{display:flex;gap:16px}.qindex{font-size:22px;color:var(--orange);min-width:26px}.qrow h2{font-size:22px;line-height:1.55;margin:0 0 8px;word-break:break-word}.tag,.hint{display:inline-block;background:#edf4ef;color:#4b7a66;border-radius:5px;font-size:13px;padding:3px 7px;margin-right:6px}.hint{background:#fff3e9;color:#a46945}.options{display:grid;gap:11px;margin-top:18px}.option{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid #e2e6e1;background:#fffefa;border-radius:12px;padding:15px;color:#52615b;font-size:18px}.option.selected{border-color:#78a08a}.option.correct{background:#def2e4;border-color:#78a08a;color:#276545}.option.wrong{background:#fbe2e0;border-color:#d98981;color:#a04b44}.radio,.check{width:25px;height:25px;border:2px solid #c8d1cc;display:inline-block;flex:none}.radio{border-radius:50%}.check{border-radius:5px}.radio.selected{box-shadow:inset 0 0 0 6px var(--green);border-color:var(--green)}.check.selected{background:var(--green);border-color:var(--green)}.confirm{border:0;border-radius:24px;background:var(--green);color:#fff;padding:12px;font-weight:800;margin-top:3px}.answer-toggle{border:0;border-top:1px dashed var(--line);width:100%;text-align:left;background:transparent;color:var(--green);font-size:17px;padding:17px 0 0;margin-top:18px}.answer{background:#eef6ef;color:#35634d;padding:16px;border-radius:10px;white-space:pre-wrap;word-break:break-word;margin-top:15px}.empty{text-align:center;color:var(--muted);padding:40px}.disabled{opacity:.55}@media(max-width:430px){#app{padding:22px 14px 90px}.hero h1{font-size:30px}.qrow h2{font-size:20px}.option{font-size:17px;padding:14px}.stats{gap:24px}.stats b{font-size:31px}}
/* access and sponsorship */
.support-entry{display:block;width:100%;margin-top:18px;padding:19px 20px;border:1px solid #d7b276;border-radius:18px;background:#fff9ed;text-align:left;color:#714a18;box-shadow:0 8px 24px rgba(81,58,21,.06)}.support-entry span{display:block;font-size:20px;font-weight:800}.support-entry b{float:right;margin-top:-30px;color:#bd7020;font-size:22px}.support-entry small{display:block;margin-top:4px;color:#957553}.modal-mask{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:20px;background:rgba(18,31,25,.55)}.access-modal{position:relative;width:min(100%,420px);max-height:min(90vh,720px);max-height:min(90dvh,720px);overflow:auto;border-radius:20px;background:#fffefa;padding:30px 24px;color:var(--ink);box-shadow:0 20px 56px rgba(0,0,0,.25)}.access-modal h2{margin:6px 34px 8px 0;font-size:25px;line-height:1.3}.access-modal p{color:var(--muted);margin:8px 0 18px}.access-kicker{font-size:12px!important;font-weight:800;color:var(--orange)!important;letter-spacing:1.6px}.modal-x{position:absolute;right:14px;top:12px;border:0;background:transparent;font-size:30px;line-height:1;color:var(--muted);padding:6px 10px}.modal-x.hidden{display:none}.access-main{width:100%;border:0;border-radius:12px;background:var(--green);color:#fff;padding:14px 16px;font-weight:800;font-size:17px}.access-modal small{display:block;color:#8a958f;margin-top:12px;font-size:12px}.pay-modal{text-align:center}.pay-modal h2{margin-right:0}.payment-qr{display:block;width:min(78vw,300px);height:auto;margin:14px auto;border-radius:12px;border:1px solid var(--line)}.payment-note{font-size:13px;line-height:1.5;margin-bottom:14px!important}.activation-label{display:block;text-align:left;font-size:13px;color:var(--muted);margin:0 0 5px}.activation-row{display:flex;gap:8px}.activation-row input{min-width:0;flex:1;border:1px solid #cbd5cf;border-radius:10px;padding:11px 10px;font:inherit}.activation-row button{border:0;border-radius:10px;background:var(--green);color:#fff;padding:0 14px;font-weight:800}@media(max-width:430px){.access-modal{padding:26px 18px}.access-modal h2{font-size:23px}}
/* Opening thank-you notice */
.welcome-modal{text-align:center}.welcome-modal h2{margin:6px 18px 18px;font-size:22px;line-height:1.5}.welcome-cat{display:block;width:min(72vw,270px);max-height:300px;object-fit:cover;margin:0 auto 18px;border-radius:16px;border:1px solid var(--line)}
/* Structured answers: real outline markers become separate study points;
   score notes stay attached to the sentence they grade. */
.answer{white-space:normal;line-height:1.78}.answer-lead{margin:0 0 12px}.answer-section{margin:18px 0 10px;color:#245a45;font-weight:800;font-size:1.05em}.answer-section:first-child{margin-top:0}.answer-item{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;margin:12px 0;padding:11px 12px;border-left:3px solid #80ad91;background:rgba(255,255,255,.38);border-radius:0 8px 8px 0}.answer-item.level-one{font-weight:700;color:#245a45}.answer-item.level-two{margin:8px 0 8px 18px;padding:8px 10px;border-left-color:#c6a26d;background:rgba(255,255,255,.2);font-weight:400;color:#35634d}.answer-marker{font-weight:800;white-space:nowrap}.answer-content{min-width:0}.score{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;background:#dcecdf;color:#43735c;font-size:.82em;white-space:nowrap}

:root{--reading-scale:1}
body.reading-tools-enabled>:not(.reading-tools):not(#a4-mobile-download-panel){zoom:var(--reading-scale)}
.reading-tools{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:99990;display:flex;flex-direction:column;align-items:flex-end;gap:10px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;zoom:1!important}
.reading-tools button{box-sizing:border-box;border:1px solid #c7d8cb;background:#fffefa;color:#28634f;box-shadow:0 8px 24px rgba(35,61,49,.18);cursor:pointer;font:750 13px/1.15 inherit}
.reading-tools__button{display:flex;flex-direction:column;align-items:center;justify-content:center;width:58px;height:58px;padding:0;border-radius:50%}
.reading-tools__button strong{font-size:20px;line-height:1}
.reading-tools__button span{margin-top:4px;font-size:11px}
.reading-tools__button--pdf{background:#28634f!important;color:#fff!important}
.reading-tools__button--top{opacity:0;pointer-events:none;transform:translateY(8px);transition:.18s ease}
.reading-tools__button--top.is-visible{opacity:1;pointer-events:auto;transform:none}
.reading-tools__font-menu{display:none;width:154px;padding:8px;border:1px solid #d6e1d8;border-radius:15px;background:#fffefa;box-shadow:0 12px 32px rgba(35,61,49,.2)}
.reading-tools__font-menu.is-open{display:grid;gap:4px}
.reading-tools__font-option{display:flex!important;flex-direction:row!important;justify-content:flex-start!important;width:100%!important;height:40px!important;padding:0 12px!important;border:0!important;border-radius:10px!important;box-shadow:none!important;background:transparent!important;font-size:14px!important}
.reading-tools__font-option.is-active{background:#e9f2eb!important;font-weight:900}
.reading-tools__font-option b{width:30px;font-size:var(--sample-size)}
.reading-tools__pdf-menu{display:none;width:min(310px,calc(100vw - 88px));max-height:min(66vh,520px);padding:10px;overflow:auto;border:1px solid #d6e1d8;border-radius:16px;background:#fffefa;box-shadow:0 14px 36px rgba(35,61,49,.24)}
.reading-tools__pdf-menu.is-open{display:grid;gap:7px}
.reading-tools__pdf-title{padding:6px 8px 4px;color:#6b7d74;font-size:12px;letter-spacing:.08em}
.reading-tools__pdf-option{display:flex!important;flex-direction:column!important;align-items:flex-start!important;width:100%!important;height:auto!important;padding:11px 12px!important;border:0!important;border-radius:11px!important;box-shadow:none!important;background:#f3f7f2!important;text-align:left!important}
.reading-tools__pdf-option:hover{background:#e5f0e7!important}
.reading-tools__pdf-option--opened{background:#fff3e9!important;color:#9b532f!important}
.reading-tools__pdf-option b{font-size:14px;line-height:1.35}
.reading-tools__pdf-option span{margin-top:4px;color:#718079;font-size:11px;font-weight:600;line-height:1.4}
.options>div[role="button"]{cursor:pointer;transition:background-color .15s ease,color .15s ease,box-shadow .15s ease}
.options>div[role="button"]:hover,.options>div[role="button"]:focus-visible{background:#edf5ef;outline:0;box-shadow:inset 3px 0 #6b9b7f}
.options>div[role="button"].is-selected{background:#e8f1ea;box-shadow:inset 3px 0 #28634f}
.options>div[role="button"].is-correct{background:#e3f3e7;color:#174e31;box-shadow:inset 3px 0 #2b8a52}
.options>div[role="button"].is-selected.is-wrong{background:#fff0ea;color:#8f3e27;box-shadow:inset 3px 0 #c96845}
/* 一体收缩（2026-08-22）：折叠态只显示切换钮；展开态全部按钮可见 */
.reading-tools--collapsed .reading-tools__button:not(.reading-tools__toggle){display:none}
.reading-tools button.reading-tools__toggle{background:#28634f;color:#fff}
.reading-tools--collapsed button.reading-tools__toggle{background:#fffefa;color:#28634f}
html[data-theme='dark'] .reading-tools button.reading-tools__toggle{background:#28634f!important;color:#fff!important}
html[data-theme='dark'] .reading-tools--collapsed button.reading-tools__toggle{background:#2c3a33!important;color:#dfe6e2!important}
@media(max-width:560px){.reading-tools{right:12px;bottom:14px;gap:8px}.reading-tools__button{width:54px;height:54px}.reading-tools__font-menu{width:146px}}
/* 番茄钟入口统一（2026-08-22 v2）：静止时只保留工具条 🍅（任何屏宽）；运行中 🍅 隐藏、右下角浮标显示倒计时 */
.reading-tools__button--tomato{display:flex}
html.tomato-running .reading-tools__button--tomato{display:none}
html.word-lookup-open{overflow:hidden}
.word-lookup{position:fixed;inset:0;z-index:100010;display:none;zoom:1!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.word-lookup.is-open{display:block}
.word-lookup__backdrop{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:rgba(18,31,25,.36);backdrop-filter:blur(2px)}
.word-lookup__sheet{position:absolute;left:50%;top:50%;width:min(440px,calc(100vw - 28px));max-height:min(680px,calc(100vh - 42px));box-sizing:border-box;overflow:auto;transform:translate(-50%,-50%);border:1px solid #d2ddd5;border-radius:8px;background:#fffefa;box-shadow:0 24px 70px rgba(18,41,29,.3);color:#1f2d26}
.word-lookup__sheet>header{position:sticky;top:0;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;padding:20px 22px 14px;border-bottom:1px solid #e2e9e3;background:#fffefa}
.word-lookup__sheet>header small{display:block;margin-bottom:4px;color:#739080;font-size:11px;font-weight:850;letter-spacing:.12em}
.word-lookup__sheet h2{margin:0;font-size:29px;line-height:1.15;overflow-wrap:anywhere;letter-spacing:0}
.word-lookup__sheet>header>button{width:34px;height:34px;padding:0;border:0;border-radius:50%;background:#edf3ee;color:#315f49;font-size:25px;line-height:1;cursor:pointer}
.word-lookup__content{padding:19px 22px 22px}
.word-lookup__loading,.word-lookup__missing{margin:4px 0 16px;color:#687b71;line-height:1.65}
.word-lookup__phonetic{margin:0 0 10px;color:#af5b33;font:700 16px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}
.word-lookup__meaning{margin:0;color:#1d2d25;font-size:17px;font-weight:720;line-height:1.75;white-space:pre-wrap}
.word-lookup__content details{margin-top:15px;border-top:1px solid #e4eae5;padding-top:12px}
.word-lookup__content details summary{color:#35634d;font-size:13px;font-weight:800;cursor:pointer}
.word-lookup__content details p{margin:9px 0 0;color:#687970;font-size:13px;line-height:1.6}
.word-lookup__context{margin-top:16px;padding:13px 14px;border-left:3px solid #d98251;background:#f8f5ee}
.word-lookup__context small{color:#8c6a56;font-size:11px;font-weight:850}
.word-lookup__context p{margin:5px 0 0;color:#4a5750;font-size:13px;line-height:1.6}
.word-lookup__actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.word-lookup__actions button{min-height:42px;padding:8px 12px;border:1px solid #bed0c3;border-radius:6px;background:#eff5f0;color:#28634f;font:800 14px/1.2 inherit;cursor:pointer}
.word-lookup__actions button.is-saved{border-color:#28634f;background:#28634f;color:#fff}
.word-lookup__source{margin:14px 0 0;color:#8b9991;font-size:11px;text-align:center}
@media(max-width:560px){.word-lookup__sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:78vh;transform:none;border-width:1px 0 0;border-radius:8px 8px 0 0}.word-lookup__sheet>header{padding:17px 18px 12px}.word-lookup__content{padding:17px 18px max(22px,env(safe-area-inset-bottom))}.word-lookup__sheet h2{font-size:26px}}
@media print{.reading-tools{display:none!important}:root{--reading-scale:1!important}body.reading-tools-enabled>:not(.reading-tools):not(#a4-mobile-download-panel){zoom:1!important}details>*{display:block!important}details>summary{display:list-item!important}}

/* ============================================================
   外院知识分享站 · 番茄钟（tomato-timer.js 配套样式）
   悬浮小番茄图标（收缩态）→ 点击展开面板 → 计时 + 白噪音
   定位：右下角，reading-tools 工具条正上方（垂直同排，不重叠）
   ============================================================ */
.tomato-timer{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.tomato-timer__toggle{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 226px);z-index:99989;box-sizing:border-box;width:58px;height:58px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid #e0b9a6;border-radius:50%;background:#fffefa;color:#a34b2e;box-shadow:0 8px 24px rgba(35,61,49,.18);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
.tomato-timer__toggle:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 12px 28px rgba(35,61,49,.24)}
.tomato-timer__toggle:active{transform:scale(.96)}
.tomato-timer__toggle.is-running{border-color:#e0503a;background:#fff6f1;animation:tomato-pulse 2s ease-in-out infinite}
.tomato-timer__icon{width:30px;height:30px;display:block}
.tomato-timer__toggle.is-running .tomato-timer__icon{width:22px;height:22px}
.tomato-timer__remain{font-size:11px;font-weight:800;line-height:1;color:#a34b2e}
@keyframes tomato-pulse{0%,100%{box-shadow:0 8px 24px rgba(35,61,49,.18)}50%{box-shadow:0 8px 28px rgba(224,80,58,.55)}}

.tomato-timer__panel{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 292px);z-index:99991;display:none;box-sizing:border-box;width:288px;max-height:min(460px,calc(100vh - 400px));overflow:auto;padding:16px 16px 14px;border:1px solid #e2d2c8;border-radius:18px;background:var(--cream,#fffefa);box-shadow:0 16px 44px rgba(35,61,49,.26);color:var(--ink,#17211f)}
.tomato-timer__panel.is-open{display:block}
.tomato-timer__panel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tomato-timer__panel header b{font-size:16px}
.tomato-timer__close{width:28px;height:28px;padding:0;border:0;border-radius:50%;background:#f3e6de;color:#a34b2e;font-size:16px;line-height:1;cursor:pointer}
.tomato-timer__time{text-align:center;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;color:var(--green,#28634f);line-height:1.15;margin:4px 0 12px}
.tomato-timer__time.is-finished{color:var(--orange,#d97845)}
.tomato-timer__presets{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.tomato-timer__chip{flex:1;min-width:52px;padding:7px 4px;border:1px solid #dfe6df;border-radius:999px;background:#f5f8f4;color:var(--muted,#73817b);font-size:13px;font-weight:700;cursor:pointer}
.tomato-timer__chip.is-active{border-color:var(--green,#28634f);background:var(--green,#28634f);color:#fff}
.tomato-timer__custom{flex:1;min-width:58px;box-sizing:border-box;padding:6px 8px;border:1px solid #dfe6df;border-radius:999px;background:#fff;color:var(--ink,#17211f);font-size:13px;text-align:center}
.tomato-timer__custom:focus{outline:2px solid rgba(40,99,79,.4);border-color:var(--green,#28634f)}
.tomato-timer__controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}
.tomato-timer__start,.tomato-timer__reset{padding:9px 0;border:0;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer}
.tomato-timer__start{background:var(--green,#28634f);color:#fff}
.tomato-timer__start.is-running{background:var(--orange,#d97845)}
.tomato-timer__reset{background:#f1e9df;color:#855735}
.tomato-timer__noise{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid #e2e9e3;border-radius:12px;background:#f7faf6;flex-wrap:wrap}
.tomato-timer__noise-label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer;user-select:none}
.tomato-timer__noise-label input{accent-color:var(--green,#28634f);width:15px;height:15px;margin:0;cursor:pointer}
.tomato-timer__kind{flex:1;min-width:74px;padding:5px 6px;border:1px solid #dfe6df;border-radius:8px;background:#fff;color:var(--ink,#17211f);font-size:12px}
.tomato-timer__volume{flex:1;min-width:70px;accent-color:var(--green,#28634f);height:18px;cursor:pointer}
.tomato-timer__hint{margin:10px 2px 0;color:var(--muted,#73817b);font-size:11px;line-height:1.5}

/* 深色模式 */

新时代的爱国主义基本要求是：（1）坚持爱国爱党爱社会主义相统一。（1分）（2）维护祖国统一和民族团结。（1分）（3）尊重和传承中华民族历史和文化。（1分）（4）必须坚持立足中国又面向世界。（2分）","id":2},{"type":"short","title":"简述社会主义道德为什么要以为人民服务为核心？","hint":"","options":[],"answer":"为人民服务是社会主义道德的核心，这主要是因为：（1）为人民服务是社会主义道德的本质要求。（1分）第一，为人民服务是社会主义经济基础和人际关系的客观要求。（1分）第二，为人民服务是社会主义市场经济健康发展的要求。一切经济活动中，都应正确处理个人与社会、争与协作、效率与公平、先富与共富、经济效益与社会效益等关系。（1分）（2） 为人民服务是先进性要求和广泛性要求的统一。为人民服务，是可以通过不同层次、不同形式表现出来的。为人民服务作为社会主义道德的核心，是社会主义道德区别和优越于其他社会形态道德的显著标志。（2分）","id":3},{"type":"short","title":"简述大学生如何树立正确的择业观和创业观？","hint":"","options":[],"answer":"（1）树立崇高的职业理想。职业活动不仅是人们谋生的手段，也是人们奉献社会、完善自身的必要条件。（1分）（2）服从社会发展的需要。把自己对职业的期望与社会的需要、现实的可能结合起来。（1分）（3）做好充分的择业准备。大学生有了真才实学，才能在未来适应多种岗位。（1分）（4）培养创业的勇气和能力。要有积极创业的思想准备，积极关注经济社会发展的趋势，了解国家鼓励大学生自主创业的有关政策，为今后自主创业打下良好的基础。（2分）","id":4},{"type":"short","title":"简述大学生应如何走在改革创新的时代前列？","hint":"","options":[],"answer":"（1）树立改革创新的自觉意识。（1分）① 增强改革创新的责任感。② 树立敢于突破陈规的意识。③ 树立大胆探索未知领域的信心。（2分）（2）增强改革创新的能力本领。（1分）①夯实创新基础。②培养创新思维。③投身创新实践。（1分）","id":5},{"type":"short","title":"简述为什么要信仰马克思主义？","hint":"","options":[],"answer":"马克思主义是我们认识世界、改造世界的强大思想武器。马克思主义为我们提供了科学的思想方法，正确运用马克思主义，我们在观察事物时就能正确地提出问题、分析问题和解决问题。（1分）马克思主义是科学的理论，创造性地揭示了人类社会发展规律。马克思主义是人民的理论，第一次创立了人民实现自身解放的思想体系。马克思主义是实践的理论，指引着人民改造世界的行动。马克思主义是不断发展的开放的理论，始终站在时代前沿。（2分）马克思主义是党和人民事业不断发展的参天大树之根本，是党和人民不断奋进的万里长河之泉源。（1分）大学生应坚定马克思主义信仰，准确把握时代发展潮流，以科学的理想信念指引人生前进的道路和方向。（1分）","id":6},{"type":"short","title":"简述新时代的内涵？","hint":"","options":[],"answer":"（1）这个新时代，是承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代。（1分）（2）这个新时代，是决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代。（1分）（3）这个新时代，是全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代。（1分）（4）这个新时代，是全体中华儿女戮力同心、奋力实现中华民族伟大复兴中国梦的时代。（1分）（5）这个新时代，是我国日益走近世界舞台中央、不断为人类作出更大贡献的时代。（1分）","id":7},{"type":"short","title":"简述个人理想与社会理想的关系？","hint":"","options":[],"answer":"个人理想是指处于一定历史条件和社会关系中的个体对于自己未来的物质生活、精神生活所产生的种种向往和追求。（1分）社会理想是指社会集体乃至社会全体成员的共同理想，即在全社会占主导地位的共同奋斗目标。（1分）社会理想与个人理想不是彼此孤立的，它们之间相互联系、相互影响、相互制约。（1分） （1）个人理想以社会理想为指引。（1分） （2）社会理想是对个人理想的汇聚和升华。（1分）","id":8},{"type":"short","title":"简述如何理解依法治国和以德治国相结合？","hint":"","options":[],"answer":"（1）既要重视发挥道德的教化作用，又要重视发挥法律的规范作用。（1分）（2）要坚持以道德滋养法治精神，强化道德对法治文化的支撑作用。只有坚持以道德为滋养，法治才有坚实的社会基础和广阔的发展空间。（2分）（3）要大力弘扬社会主义先进思想道德，把社会主义核心价值观贯彻到法治建设全过程，为建设社会主义法治文化提供有力支撑，为法治有效实施创造良好条件。（2分）","id":9},{"type":"short","title":"联系我国实际，简述社会主义法律的本质特征？","hint":"","options":[],"answer":"我国社会主义法律的本质主要表现在以下几个方面：（1）从法律所体现的意志来看，我国社会主义法律体现了党的主张和人民意志的统一。我国社会主义法律即具有鲜明的阶级性，又具有广泛的人民性，体现了阶级性与人民性的统一。（2分）（2）从法律的实质内容来看，具有鲜明的科学性和先进性。我国社会主义法律反应全体人民共同意志，与历史发展的基本方向和规律一致，是社会历史发展规律和自然规律的反映。（2分）（3）从法律的社会作用来看，我国社会主义法律是中国特色社会主义建设的重要保障。（1分）","id":10},{"type":"short","title":"简述法治思维的内涵？","hint":"","options":[],"answer":"法治思维包含以下几层含义：法治思维以法治价值和法治精神为指导，蕴含着公正、平等、民主、人权等法治理念，是一种正当性思维。（1分）法治思维以法律原则和法律规则为依据指导人们的社会行为，是一种规范性思维。（1分）法治思维以法律手段与法律方法为依托分析问题、处理问题、解决纠纷，是一种逻辑思维。（1分）法治思维是一种符合规律、尊重事实的科学思维。（1分）因此，法治思维是一种融法律的价值属性和工具理性于一体的特殊的高级法律意识。（1分）","id":11},{"type":"short","title":"简述人生价值的实现条件？","hint":"","options":[],"answer":"（1）实现人生价值要从社会客观条件出发。应使学生懂得珍惜当下难得的历史机遇，努力实现自己的人生价值。（1分）（2）实现人生价值要从个体自身条件出发。大学生自身社会经验偏少、知识储备不够，容易通过主观的想象认知自身的条件。应使学生明确，在自身成长成才的过程中要客观认识自己，准确把握影响人生价值实现的自身条件。（2分）（3）不断增强实现人生价值的能力和本领。应使学生明确要通过各种方式和途径，增长才干、增强本领，全面提高自身各方面的能力，为实现人生价值做好充分准备，奠定扎实的基础。（2分）","id":12},{"type":"short","title":"简述中国精神的内涵？","hint":"","options":[],"answer":"在几千年的历史进程中，中国人民在长期奋斗中培育铸就了独特的中国精神，为中国发展和人类文明进步提供了强大精神动力。（1分）（1）伟大创造精神。今天，中国人民的创造精神正在前所未有地迸发出来，推动我国日新月异向前发展，大踏步走在世界前列。（1分）（2）伟大奋斗精神。今天，中国人民拥有的一切，凝聚着中国人的聪明才智，浸透着中国人的辛勤汗水，蕴涵着中国人的巨大牺牲。（1分）（3）伟大团结精神。今天，中国取得的令世人瞩目的发展成就，更是全国各族人民同心同德、同心同向努力的结果。（1分）（4）伟大梦想精神。中国人民始终心怀梦想、不懈追求，中国人民比历史上任何时期都更接近、更有信心和能力实现中华民族伟大复兴。（1分）","id":13},{"type":"short","title":"简述中国革命道德的当代价值？","hint":"","options":[],"answer":"中国革命道德内容丰富、历久弥新。都是中国共产党领导全体人民实现民族独立、人民解放的精神支撑，对于我们走好新时代的长征路，实现中华民族伟大复兴仍然具有极其重要的现实意义。（1分）（1）有利于加强和巩固社会主义和共产主义的理想信念。（1分）（2）有利于培育和践行社会主义核心价值观。（1分）（3）有利于引导人们树立正确的道德观。（1分）（4）有利于培育良好的社会道德风尚。（1分）","id":14},{"type":"short","title":"简述培育和践行社会主义核心价值观的重大意义？","hint":"","options":[],"answer":"培育和践行社会主义核心价值观，是有效整合我国社会意识、凝聚社会价值共识、防范和化解社会矛盾、聚合磅礴之力的重大举措，是保证我国经济社会沿着正确的方向发展、实现中华民族伟大复兴的价值支撑，意义重大而深远。（2分）（1）坚持和发展中国特色社会主义的价值遵循。（1分）（2）提高文化软实力的迫切要求。（1分）（3）推进社会团结奋进的“最大公约数”。使全体人民同心同德、团结奋进，关乎国家前途命运，关乎人民幸福安康。（1分）","id":15},{"type":"short","title":"简述为什么理想信念是精神之“钙”？","hint":"","options":[],"answer":"（1）理想指引方向，信念决定成败。理想信念是人生发展的内在动力。（1分）（2）理想信念昭示奋斗目标。只有理想信念坚定的人，才能始终不渝、百折不挠，不论风吹雨打，不怕千难万险，坚定不移为实现既定目标而奋斗。（1分）（3）理想信念催生前进动力。一个人有了崇高坚定的理想信念，才会以惊人的毅力和不懈的努力成就事业。（1分）（4）理想信念提供精神支柱。没有理想信念的支撑，人的精神世界就如同无根之木、无基之塔。（1分）（5）理想信念提高精神境界。理想信念是衡量一个人精神境界的重要标尺。（1分）","id":16},{"type":"short","title":"简述我国宪法的基本原则？","hint":"","options":[],"answer":"（1）关于党的领导原则。中国共产党是中国特色社会主义事业的领导核心。（1分）（2）关于人民主权原则。人民当家作主是社会主义民主政治的本质和核心。（1分）（3）关于尊重和保障人权原则。法治是人权得以实现的保障。（1分）（4）关于社会主义法治原则。我国宪法明确规定实行依法治国，建设社会主义法治国家。（1分）（5）关于民主集中制原则。民主集中制是我国国家组织形式和活动方式的基本原则，是我国国家制度的突出特点和优势，也是集中全党全国人民集体智慧，实现科学决策、民主决策的基本原则和主要途径。（1分）","id":17},{"type":"short","title":"简述新时代青年成长成才的“三重要义”？","hint":"","options":[],"answer":"（1）新时代青年成长成才之“法”在于坚定信念、志存高远。只有心中有了坚定的信仰，脚下才会有更强劲的力量。（1分）（2）新时代青年成长成才之“道”在于修身养性、道德养成。树立正确的“三观”是青年一切思想和行动的源泉，是青年干事创业的价值基础和道义起点，是青年必须系好的“第一粒扣子”。（2分）（3）新时代青年成长成才之“术”在于脚踏实地、砺能笃行。广大青年要实现立志做大事的目标，必须练就过硬的本领，躬身于干事创业的伟大实践。（2分）","id":18},{"type":"short","title":"简述人生的自我价值与社会价值的关系？","hint":"","options":[],"answer":"人生的自我价值，是个体的人对自己的生存和发展所具有的价值，主要表现为对自身物质和精神需要的满足程度。人生的社会价值，是个体的实践活动对社会、他人所具有的价值。（1分）人生的自我价值和社会价值，既相互区别，又密切联系、相互依存，共同构成人生价值的矛盾统一体。（1分）① 人生的自我价值是个体生存和发展的必要条件，人生的自我价值的实现是个体为社会创造更大价值的前提。个体通过努力提高自我价值的过程，也是其创造社会价值的过程。（1分）② 人生的社会价值是社会存在和发展的重要条件，人生社会价值的实现是个体自我完善、全面发展的保障。没有社会价值，人生的自我价值就无法存在。人是社会的人，这不仅意味着个体物质和精神的需要必须在社会中才能得到满足，还意味着以怎样的方式和在多大程度上得到满足也是由社会决定的。（2分）","id":19},{"type":"short","title":"简述习近平法治思想的主要内容？","hint":"","options":[],"answer":"习近平法治思想的主要内容包括：（1）坚持党对全面依法治国的领导；（2）坚持以人民为中心；（3）坚持中国特色社会主义法治道路；（1分）（4）坚持依宪治国、依宪执政；（5）坚持在法治轨道上推进国家治理体系和治理能力现代化；（1分）（6）坚持建设中国特色社会主义法治体系；（7）坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设；（1分）（8）坚持全面推进科学立法、严格执法、公正司法、全民守法；（9）坚持统筹推进国内法治和涉外法治；（1分）（10）坚持建设德才兼备的高素质法治工作队伍；（11）坚持抓住领导干部这个“关键少数”。（1分）","id":20},{"type":"short","title":"简述法律权利与法律义务的关系？","hint":"","options":[],"answer":"法律权利与法律义务就像一枚硬币的两面，不可分割，相互依存。在社会生活中，每个人既是享受法律权利的主体，又是承担法律义务的主体。（1分）在法治国家，不存在只享受权利的主体，也不存在只承担义务的主体。法律权利的实现必须以相应法律义务的履行为条件；法律义务的设定和履行也必须以法律权利的行使为根据。（2分）离开了法律权利，法律义务就失去了履行的价值和动力；离开了法律义务，法律权利也形同虚设。（1分）有些法律权利和法律义务具有复合性的关系，即一个行为可以同时是权利行为和义务行为，如劳动的权利和义务、接受义务教育的权利和义务。（1分）","id":21},{"type":"short","title":"树立正确的恋爱观，大学生应当处理好的关系有哪些？","hint":"","options":[],"answer":"（1）恋爱与学习的关系。学习是大学生的主要任务，同学们应把爱情作为奋发学习的动力，同时还应把是否有利于促进学习作为衡量爱情价值的一个重要而特殊的标准。（2分）（2）恋爱与关心集体的关系。恋爱中的双方不应把自己禁锢在两个人的世界中，脱离集体，疏远同学，会妨碍自身的全面发展与进步。（1分）（3）恋爱与关爱他人和社会的关系。爱的情感丰富博大，不仅有恋人之爱，还有对父母之爱、对兄弟姐妹之爱、对社会和国家之爱，对他人和社会具有爱心则会使爱情变得高尚和稳固。（2分）","id":22},{"type":"short","title":"简述为什么要坚定对中国特色社会主义的信念？","hint":"","options":[],"answer":"中国特色社会主义，承载着几代中国共产党人的理想和探索，寄托着无数仁人志士的夙愿和期盼，凝聚着亿万人民的奋斗和牺牲，是近代以来中国社会发展的必然选择。（1分）（1）中国特色社会主义是科学社会主义，不是别的什么主义。在当代中国，坚持和发展中国特色社会主义，就是真正坚持和发展科学社会主义。（1分）（2）中国特色社会主义不是从天上掉下来的，而是中国共产党带领中国人民历经千辛万苦找到的实现中国梦的正确道路。（1分）（3）中国共产党领导是中国特色社会主义最本质的特征，是中国特色社会主义制度的最大优势，是党和国家的根本所在、命脉所在，是全国各族人民的利益所系、命运所系。（2分）","id":23},{"type":"short","title":"简述爱国主义的基本内涵？","hint":"","options":[],"answer":"（1）爱祖国的大好河山。维护祖国领土的完整和统一，是每个人的神圣使命和义不容辞的责任。（1分）（2）爱自己的骨肉同胞。骨肉同胞之爱反映了对民族利益共同体的自觉认同，是检验一个人对祖国忠诚程度的试金石。（1分）（3）爱祖国的灿烂文化。体现为对祖国优秀历史文化传统的认同和尊重、传承和发扬。（1分）（4）爱自己的国家。祖国的大好河山，自己的骨肉同胞，民族的灿烂文化，都是同我们的国家联系在一起的，我们每个人的发展也都时刻同国家的发展进步紧密关联。（2分）","id":24},{"type":"short","title":"简述网络生活中的道德要求？","hint":"","options":[],"answer":"网络生活中的道德要求，是人们在网络生活中为了维护正常的网络公共秩序需要共同遵守的基本道德准则，是社会公德在网络空间的运用和扩展。（1分）（1）正确使用网络工具。大学生要提高信息获取能力，加强信息辨识能力，增进信息应用能力，使网络成为开阔视野、提高能力的重要工具。（1分）（2）加强网络文明自律。大学生要文明上网，尊德守法、文明互动、理性表达，远离不良网站，防止沉迷网络，自觉维护良好网络秩序。（1分）（3）营造良好网络道德环境。大学生要反对网络暴力行为，维护网络道德秩序。应当带头引导网络舆论，对模糊认识要及时廓清，对怨气怨言要及时化解，对错误看法要及时纠正，促进网络空间日益清朗。（2分）","id":25},{"type":"short","title":"简述坚持中国特色社会主义法治道路必须遵循的原则？","hint":"","options":[],"answer":"（1）坚持中国共产党的领导。党的领导是中国特色社会主义最本质的特征，是社会主义法治最根本的保证。（1分）（2）坚持人民主体地位。全面依法治国最广泛、最深厚的基础是人民，必须坚持为了人民、依靠人民。（1分）（3）坚持法律面前人人平等。平等是社会主义法律的基本属性，是社会主义法治的基本要求。（1分）（4）坚持依法治国和以德治国相结合。法治和德治，是治国理政不可或缺的两种方式，忽视其中任何一个，都将难以实现国家的长治久安。（1分）（5）坚持从中国实际出发。坚定不移沿着中国特色社会主义法治道路前进。（1分）","id":26},{"type":"short","title":"简述“法治”与“人治”的区别？","hint":"","options":[],"answer":"（1）“法治”与民主相容，“人治”与专制相合。（1分）（2）“法治”强“权自法出”，“人治”强“法自权出”。（1分）（3）“法治”强“法大于权”，“人治”强“权大于法”。（1分）（4）“法治”强法律至上，“人治”强领袖至上。（1分）总之，“法治”与“人治”的本质区别在于国家权力是否严格依法运作。法治国家要求树立“法大于权”的观念，创设“法大于权”的制度。（1分）","id":27},{"type":"short","title":"中华传统美德的基本精神？","hint":"","options":[],"answer":"重视整体利益，强责任奉献。（1分）推崇仁爱原则，注重以和为贵。（1分）注重人伦关系，重视道德义务。（1分）追求精神境界，向往理想人格。（1分）强道德修养，注重道德践履。（1分）","id":28},{"type":"short","title":"简述道德的作用？","hint":"","options":[],"answer":"道德的作用是指道德的认识、规范、节、激励、导向、教育等功能的发挥和实现所产生的社会影响及实际效果。（1分）“国无德不兴，人无德不立”，就生动表达了道德的作用。（1分）道德作系社会稳定、促进国家发展的重要因素，对巩固特定社会的经济基础和上层建筑具有不可替代的重要作用。（1分）同时，道德作为激励人们改造客观世界和主观世界的一种精神力量，也是提高人的精神境界、促进人的自我完善、推动人的全面发展的内在动力。（2分）","id":29},{"type":"short","title":"简述如何完善宪法监督？","hint":"","options":[],"answer":"（1）健全人大工作机制。进一步明确全国人大及其常委会进行宪法监督的对象、范围、方式等，将原则性要求具体化、程序化，使宪法监督更规范、更有效。（1分）（2）健全宪法解释机制。保证宪法解释贯彻落实，积极回应涉及宪法有关问题的关切，努力实现宪法的稳定性和适应性的统一。（1分）（3）健全备案审查机制。实行有件必备、有备必审、有错必纠。要提高备案审查机制的执行力和约束力，增强备案审查的实际效能。（1分）（4）健全合宪性审查机制。凡涉及宪法有关规定如何解释、如何适用的，都应当事先经过全国人大常委会合宪性审查，确保同宪法规定、宪法精神相符合。（2分）","id":30},{"type":"short","title":"简述建设中国特色社会主义法治体系的主要内容？","hint":"","options":[],"answer":"（1）建立完备的法律规范体系。是指以宪法为核心，由部门齐全、结构严谨、内部协调、体例科学、调整有效的法律及其配套法规所构成的法律规范系统。（1分）（2）高效的法治实施体系。是指执法、司法、守法等各个环节有效衔接、协调高效运转、持续共同发力。（1分）（3）严密的法治监督体系。是指以规范和约束公权力为重点建立的有效的法治化权力监督网络。（1分）（4）有力的法治保障体系。是指在法律制定、实施和监督过程中形成的结构完整、机制健全、资源充分、富有成效的保障系统。（1分）（5）完善的党内法规体系。是指内容科学、程序严密、配套完备、运行有效的党内制度及其运行、保障体系。（1分）","id":31},{"type":"short","title":"简述社会主义核心价值观的显著特征？","hint":"","options":[],"answer":"（1）社会主义核心价值观具有超越以往一切社会核心价值观的先进性，它集中体现了社会主义的本质属性，扎根于中华优秀传统文化的土壤，吸收借鉴了一切人类优秀文化的先进价值，是反映人类社会发展进步的价值理念。（2分）（2）社会主义核心价值观坚持人民历史主体地位，代表最广大人民的根本利益，反映最广大人民的价值诉求，引导最广大人民为实现美好社会理想而奋斗。人民性是社会主义核心价值观的根本特性。（2分）（3）社会主义核心价值观不仅真正地与社会主义制度相契合，与保障人民的根本利益相一致，而且因其真实可信而具有强大的道义力量。（1分）","id":32},{"type":"essay","title":"结合自身实际，谈谈大学生应当如何自觉践行社会主义核心价值观？","hint":"","options":[],"answer":"青年的价值取向，既关系着自己的健康成长成才，又决定着未来整个社会的价值取向。在全社会培育和弘扬社会主义核心价值观，需要大学生始终走在时代前列，成为社会主义核心价值观的坚定信仰者、积极传播者、模范践行者。（2分）（1）扣好人生的扣子（1分）①大学生成长成才和全面发展，离不开正确价值观的引领。（1分）②核心价值观的养成绝非一日之功。（1分）（2）把社会主义核心价值观落细落小落实（1分）①勤学。知识是树立社会主义核心价值观的重要基础。（1分）②修德。一个人只有明大德、守公德、严私德，其才方能用得其所。（1分）③明辨。培育和践行社会主义核心价值观，要增强自己的价值判断力和道德责任感，辨别什么是真善美、什么是假恶丑，自觉做到常修善德、常怀善念、常做善举。（1分）④笃实。青年有着大好机遇，关键是要迈稳步子、夯实根基、久久为功。（1分）（3）结合个人思想实际的论述（10分）","id":1},{"type":"essay","title":"结合自身实际，谈谈大学生应如何走在改革创新的时代前列?","hint":"","options":[],"answer":"新时代大学生置身于实现中华民族伟大复兴的时代洪流之中，应当把握时代脉搏，迎接时代战，增强创新创造能力和本领，勇做改革创新的实践者，将弘扬改革创新精神贯穿于实践中、体现在行动上。（ 2分）（1）树立改革创新的自觉意识。（1分）① 增强改革创新的责任感。在改革创新中奉献服务社会、实现人生价值的崇高责任感和使命感。（1分）② 树立敢于突破陈规的意识。敢于大胆探索尝试。（1分）③ 树立大胆探索未知领域的信心。不等待、不观望、不懈怠，勇做改革创新的生力军。（1分）（2）增强改革创新的能力本领。（1分）①夯实创新基础。（1分）②培养创新思维。勤于思考，善于发现，勇于创新。（1分）③投身创新实践。实践出真知，实践长才干。（1分）（3）结合个人思想实际的论述（10分）","id":2},{"type":"essay","title":"结合自身实际，谈谈中国梦与大学生成长成才的关系?","hint":"","options":[],"answer":"大学生肩负实现中华民族伟大复兴中国梦的历史重任，只有把实现理想的道路建立在脚踏实地的奋斗上，才能放飞青春梦想，实现人生理想。实现中国梦是广大青少年成长成才的必由之路。（3分）（1）中国梦为大学生成长成才确立理想信念。当代大学生人生理想信念的确立需要中国梦的指引。（2分）（2）中国梦为大学生成长成才提供精神动力。当代大学生成长成才需要中国梦为其提供不竭的精神动力。（2分）（3）中国梦为大学生成长成才指明奋斗方向。大学生是实现中国梦的“顶梁柱”，只有明确奋斗的方向，才能在实现中国梦的征程中有所作为。（3分）（4）结合个人思想实际的论述（10分）","id":3},{"type":"essay","title":"结合自身实际，谈谈大学生如何通过参与道徳实践引领社会风尚？","hint":"","options":[],"answer":"良好的社会风尚是人们在社会道德实践中逐渐形成起来的。大学生投身崇德向善的道德实践，要弘扬真善美、贬斥假恶丑，做社会主义道徳的示范者和引领者。（2分）（1）知荣辱荣辱观对个人的思想行为具有鲜明的动力、导向和节作用。社会风尚同荣辱观紧密相连，两者相互影响、 相互作用。（2分）（2）讲正气讲正气，就是坚持真理、坚持原则，坚持同一切歪风邪气作斗争。（1分）（3）作奉献奉献精神是社会责任感的集中表现，社会需要人们对其负起责任。有责任，就意味着要奉献。（1分）（4）促和谐民主法治、公平正义、诚信友爱、充满活力、安定有序、人与自然和谐相处的社会，是国家富强、民族复兴、人民幸福的重要保证。（2分）大学生要以高度的主人翁精神，积极参与各种精神文明创建活动，为家庭谋幸福、为他人送温暧、为社会作贡献，不断引领社会风尚，提升道徳品质。（2分）（5）结合个人思想实际的论述（10分）","id":4},{"type":"essay","title":"结合自身实际，谈谈理想信念对大学生成长成才的重要意义？","hint":"","options":[],"answer":"理想信念对人生历程起着导向的作用，指引人生的奋斗目标；理想信念提供人生的前进动力，激励人们向着既定目标奋斗前进；理想信念提高人生的精神境界，它一方面使人的精神生活的各个方面统一起来，另一方面又引导着人们不断地追求更高的人生目标。（3分）（1）理想信念引导大学生做什么人。只有树立起高尚的理想信念，才能够解答在大学生“做什么人 ”这一重要的人生课题。（2分）（2）理想信念指引大学生走什么路。大学时期确立的理想信念，对今后的人生之路将产生重大影响，甚至会影响终身。（2分）（3）理想信念激励大学生为什么学。对当代大学生而言，为什么学的问题，是与走什么路、做什么人的问题紧密联系在一起的。不论今后从事什么职业，我们都要把个人的奋斗志向同国家和民族的前途命运紧紧联系在一起，把个人今天的学习进步同祖国明天的繁荣昌盛紧紧联系在一起。（3分）（ 4）结合个人思想实际的论述（10分）","id":5},{"type":"essay","title":"结合自身实际，谈谈如何辩证对待人生矛盾?","hint":"","options":[],"answer":"（1）正确对待得与失。首先，不要过于看重一时的“得”。其次，不要惧怕或斤斤计较一时的“失”。最后，要跳出对个人得失的计较。（2分）（2）正确看待苦与乐。真正的快乐只能由奋斗的艰苦转化而来。（2分）（3）正确看待顺与逆。只有善于利用顺境，勇于正视逆境和战胜逆境，人生价值才能够实现。（2分）（4）正确看待生与死。牢固树立生命可贵的意识，珍爱生命、珍惜韶华。（2分）（5）正确看待荣与辱。明确是非、对错、善恶、美丑的界限，坚持践行社会主义荣辱观，从容走好人生之路。（2分）（6）结合个人思想实际的论述（10分）","id":6},{"type":"essay","title":"结合自身实际，谈谈当代大学生如何做忠诚的爱国者？","hint":"","options":[],"answer":"（1）坚持爱国爱党爱社会主义。爱国，不能停留在口号上，而是要把自己的理想同祖国的前途、民族的命运紧密联系在一起。（2分）（2）维护祖国统一和民族团结。坚持一个中国原则，这是两岸关系的政治基础。创造更加便利的条件，开创两岸关系和平发展新前景。促进两岸同胞团结奋斗。新时代大学生要像爱护自己的眼睛一样维护民族团结，像爱护自己的生命一样维护社会稳定，自觉做民族团结进步事业的建设者、维护者、促进者。（4分）（3）尊重和传承中华民族历史文化。以时代精神激活中华优秀传统文化的生命力，不断推进中华优秀传统文化创造性转化和创新性发展。（2分）（4）坚持立足中国又面向世界。维护国家发展主体性；自觉维护国家安全；推动构建人类命运共同体。（2分）（5）结合个人思想实际的论述（10分）","id":7}],"shortName":"大一上·思政","subtitle":"课程复习题库"},{"key":"history","name":"大一下 · 中国近现代史纲要","questions":[{"type":"single","title":"前期新文化运动与资产阶级改良派、革命派思想相比，就其作用而言，主要“新”在 。","hint":"","options":["传播了资产阶级民权平等思想","动摇了封建正统思想的统治地位","绝对肯定了西方文化的进步性","深入研究和传播了马克思主义"],"answer":"B","id":1},{"type":"single","title":"毛泽东在《反对党八股》中指出，前期新文化运动的领导人物“对于现状，对于历史，对于外国事物，……所谓坏就是绝对的坏，一切皆坏；所谓的好，就是绝对的好，一切皆好”。造成这种状况的主要原因是他们 。","hint":"","options":["脱离广大人民群众","一定程度上受到封建思想的束缚","没有马克思主义的批判精神","没有接受俄国十月革命的经验"],"answer":"C","id":2},{"type":"single","title":"1928年12月，宣布东北三省“遵守三民主义，服从国民政府，改旗易帜”的是 。","hint":"","options":["张作霖","郭松龄","张学良","张作相"],"answer":"C","id":3},{"type":"single","title":"七七事变时，奋起抵抗的国民党驻军是 。","hint":"","options":["第十九路军","第二十六路军","第二十九路军","第五军"],"answer":"C","id":4},{"type":"single","title":"五四运动是 的伟大开端。","hint":"","options":["中国近代史","中国现代史","中华人民共和国史","中国新民主主义革命"],"answer":"D","id":5},{"type":"single","title":"1938年5月至6月间，毛泽东发表的揭示抗日战争发展规律的著作是 。","hint":"","options":["《论反对日本帝国主义的策略》","《论持久战》","《中国共产党在民族战争中的地位》","《抗日游击战争的战略问题》"],"answer":"B","id":6},{"type":"single","title":"党的二十大报告指出，从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以 全面推进中华民族伟大复兴。","hint":"","options":["中国特色社会主义道路","中国特色社会主义理论","中国式现代化","中国式共同富裕"],"answe tions":["新民主主义革命基本胜利","新民主主义社会在全国范围内的建立","半殖民地、半封建社会的结束,民族独立和人民解放的任务基本完成","马克思主义同中国实际相结合的伟大胜利"],"answer":"ABCD","id":80},{"type":"multi","title":"根据科学发展观，发展应该是包括 的发展？","hint":"","options":["全面的","协的","迅速的","可持续的"],"answer":"ABD","id":82},{"type":"multi","title":"在政治建设上，要坚持 有机统一，健全人民当家作主制度体系。","hint":"","options":["党的领导","人民当家作主","依法治国","经济建设"],"answer":"ABC","id":84},{"type":"multi","title":"中国特色社会主义理论体系包括 。","hint":"","options":["毛泽东思想","邓小平理论","“三个代表”重要思想","科学发展观","习近平新时代中国特色社会主义思想"],"answer":"BCDE","id":90},{"type":"multi","title":"中共十一届三中全会的意义有 。","hint":"","options":["否定了“以阶级斗争为纲”的指导思想","中国开始进入改革开放时期","形成了有中国特色的社会主义建设理论","形成了以邓小平为核心的党的中央领导集体"],"answer":"ABD","id":91},{"type":"multi","title":"1927年大革命失败后，中国共产党人和革命群众必须回答的两个根本性问题是 。","hint":"","options":["要不要建立统一战线","怎样建立统一战线","敢不敢坚持革命","怎样坚持革命"],"answer":"CD","id":93},{"type":"multi","title":"毛泽东提出的“工农武装割据”思想的基本方面是 。","hint":"","options":["土地革命","武装斗争","统一战线","农村根据地建设"],"answer":"ABD","id":94},{"type":"multi","title":"（ ）7关于真理标准问题讨论的论述正确的有 。","hint":"","options":["坚持了“两个凡是”的方针","重新确立了实事求是的思想路线","为改革开放做了思想理论准备","标志改革开放的开始"],"answer":"BC","id":97},{"type":"multi","title":"抗日民族统一战线正式形成的标志是 。","hint":"","options":["西安事变和平解决","国民党五届三中全会","蒋介石在庐山发表谈话，承认中国共产党的合法地位","《中共中央为公布国共合作宣言》的发表"],"answer":"CD","id":99},{"type":"short","title":"为什么说鸦片战争是中国近代史的起点？","hint":"","options":[],"answer":"(1)社会性质的变化：独立的封建社会变为半殖民地半封建社会。（1分）（2）社会主要矛盾的变化：地主阶级和农民阶级的矛盾变为中华民族和帝国主义、封建主义和人民大众的矛盾。（2分）（3）革命性质的变化：农民战争变为资产阶级民主革命。（1分）（4）革命任务：反封建变为“求得民族独立和人民解放”、“实现国家富强和人民共同富裕”。（2分）","id":1},{"type":"short","title":"中国近代历次反侵略战争失败的原因和教训是什么？","hint":"","options":[],"answer":"根本原因：（1）近代中国社会政治制度的腐败和清政府的腐朽无能。（1分）（2）经济和科学技术的落后，国家综合实力低，是近代中国反侵略战争失败另一重要原因。（1分）教训：（1）在中国近代，要争取国家独立和民族富强，中国人民必须把反对帝国主义的民族斗争和反对封建主义的阶级斗争统一起来，才能完成近代中国革命的任务。（2分）（2）落后必然挨打，妥协必败，这是万古不覆的真理。中国历史的发展已经证明，只有经过无产阶级领导的、反帝反封建的新民主主义革命走向社会主义，才是中国真正的出路。（2分）","id":2},{"type":"short","title":"为什么说中国的抗日战争是神圣的民族解放战争？","hint":"","options":[],"answer":"（1）彻底打败了日本侵略者，捍卫了中国的国家主权和领土完整，使中华民族避免了遭受殖民奴役的厄运。(2分）（2）促进了中华民族的觉醒，使中国人民在精神上、组织上的进步达到了前所未有的高度。（2分）（3）促进了中华民族的大团结，弘扬了中华民族的伟大精神。（1分）（4）对世界各国夺取反法西斯战争的胜利、维护世界和平的伟大事业产生了巨大影响。（1分）","id":3},{"type":"short","title":"解放战争时期，解放区经过土地改革出现了哪些新面貌？","hint":"","options":[],"answer":"（1）广大农民对中国共产党更加信任和拥护，工农联盟以及解放区的人民民主政权得到进一步巩固和加强。（2分）广大农民从封建的生产关系中解放出来，生产积极性空前提高，解放区农村的经济面貌得到明显改观。（2分）（3）大批青壮年农民踊跃参军，配合解放军作战，人民解放战争有了巩固的后方和最基本的人力和物力保证。（2分）","id":4},{"type":"short","title":"试述新民主主义革命胜利的原因。","hint":"","options":[],"answer":"（1）它有着深刻的社会根源和雄厚的群众基础。工人、农民、城市小资产阶级群众是民主革命的主要力量，在他们中间，涌现了无数无畏的英雄和不屈的战士。（2分）（2）各民主党派和无党派民主人士、各少数民族、爱国的知识分子和华侨等，都在这场斗争中发挥了积极的作用。（1分）（3）中国共产党的正确领导是民主革命胜利的根本原因。中国共产党能够制定出适合中国情况的、符合中国人民利益的纲领、路线、方针和政策。中国共产党人在革命过程中始终英勇地站在斗争的最前线。（2分）（4）同国际无产阶级和人民群众的支持是分不开的。（1分）","id":5},{"type":"short","title":"新中国的社会主义建设取得了那些成就？","hint":"","options":[],"answer":"（1）独立的、比较完整的工业体系和国民经济体系的基本建立。（2分）（2）人民生活水平的提高。（1分）（3）文化、医疗、科技事业的发展。（1分）（4）形成历久弥新的时代精神。（1分）（5）国际地位的提高与国际环境的改善。（1分）","id":6},{"type":"short","title":"简述中共八七会议的内容和意义？","hint":"","options":[],"answer":"内容：（1）彻底清算了大革命后期的陈独秀右倾机会主义错误；（2分）（2）明确了土地革命和武装反抗国民党反动统治的总方针；（1分）（3）选出了以瞿秋白为首的中央临时政治局。（1分）意义：八七会议在我党历史上是一个转折点。使中国共产党在政治上大大前进了一步，开始了从大革命失败到土地革命战争兴起的转折点。（2分）","id":7},{"type":"short","title":"为什么说中国共产党的成立是“开天辟地的大事变”？","hint":"","options":[],"answer":"（1）中国共产党的成立，使中国革命有了坚强的领导核心。（2分）（2）中国共产党的成立，使中国革命有了科学的指导思想、革命纲领、斗争策略、革命方法和新前途。（2分）（3）中国共产党的成立，使中国革命有了新面貌。（1分）（4） 中国共产党的成立，为中国革命获得广泛的国际援助。（1分）","id":8},{"type":"short","title":"简述土地革命战争时期农村革命根据地建设的主要内容？","hint":"","options":[],"answer":"（1）政治；实行工农兵代表大会制度。（1分）（2）经济；根据地军民积极进行经济建设，着重发展农业生产，努力打破敌人的经济封锁。（2分）（3）文化：注重发展文化教育事业，提高工农群众的文化水平，创办各种夜校、半日制学校等，加强马克思主义文化的教育。（2分）（4）党的建设：认真加强廉洁从政的教育，坚决开展反对贪污腐化等斗争，并且颁发出一系列法律法规。（1分）","id":9},{"type":"short","title":"简述在中国革命统一战线中的两个联盟？","hint":"","options":[],"answer":"统一战线中存在着两个联盟：一个是工人阶级同农民和其他劳动人民的联盟，主要是工农联盟；（2分）一个是工人阶级同民族资产阶级和其他可以合作的非劳动人民的联盟，主要是同民族资产阶级的联盟，有时还包括与一部分大资产阶级的暂时的联盟。（2分）前者是基本的、主要的；后者是辅助的、同时又是重要的。必须是坚决依靠第一个联盟，争取建立和扩大第二个联盟。（2分）","id":10},{"type":"short","title":"近代中国社会的两大历史任务及其相互关系是什么？","hint":"","options":[],"answer":"两大历史任务：争取民族独立、人民解放和实现国家富强、人民富裕。（1分）相互关系：（1）由于腐朽的社会制度束缚着生产力的发展，阻碍着经济技术的进步，必须首先改变这种社会制度，争得民族独立和人民解放，才能为实现国家富强和人民富裕创造前提。（3分）（2）实现国家富强、人民富裕是争取民族独立、人民解放的最终目的和必然要求。（2分）","id":11},{"type":"short","title":"中国早期信仰马克思主义的先进分子的主要类型有哪些？","hint":"","options":[],"answer":"首先，是五四以前的新文化运动的精神领袖。其代表为李大钊和陈独秀。（2分）其次，是五四爱国运动的左翼骨干。其代表为毛泽东等。（2分）再次，是一部分原中国同盟会会员、辛亥革命时期的活动家。其代表为董必武等人。（1分）其中李大钊、陈独秀属于先驱者和擎旗人，毛泽东等五四运动的左翼骨干则是其主体部分。（1分）","id":12},{"type":"short","title":"抗日战争胜利后，国民党政府为什么会陷入全民的包围中并迅速走向崩溃？","hint":"","options":[],"answer":"（1）国民党政府由于它的专制独裁统治和官员们的贪污腐败、大发国难财，抗战后期在大后方便已严重丧失人心。 （2分）（2）国民党之所以迅速失去民心，还由于它违背全国人民迫切要求休养生息、和平建国的意愿，执行反人民的内战政策。为了筹措内战经费，国民党政府除了对人民征收苛重的捐税以外，更无限制的发行纸币。导致恶性通货膨胀，工农业生产严重萎缩。（2分）这样，国民党当局就将全国各阶层人民置于饥饿和死亡的界线上，因而就迫使全国各阶层人民团结起来，同蒋介石反动政府作你死我活的斗争，除此以外，再无出路。（2分）","id":13},{"type":"short","title":"为什么说孙中山领导的辛亥革命引起了近代中国的历史性巨大变化？","hint":"","options":[],"answer":"（1）辛亥革命推翻了封建势力的政治代表、帝国主义在中国的代理人清王朝的统治，沉重打击了中外反动势力，使中国反动统治者在政治上乱了阵脚。（2分）（2）辛亥革命结束了中国两千多年封建社会的君主专制制度，建立了中国历史上第一个资产阶级共和政府，使民主共和观念开始深入人心。（1分）（3）辛亥革命推动了中国人民的思想解放。（1分）（4）辛亥革命推动了中国的社会变革，促使中国的社会经济、思想习惯和社会风俗等方面发生了新的积极变化。（1分）（5）辛亥革命不仅在一定程度上打击了帝国主义的侵略势力，而且推动了亚洲各国民族解放运动的高涨。（1分）","id":14},{"type":"short","title":"中国先进分子为什么选择了马克思主义？","hint":"","options":[],"answer":"（1）中国近代资本主义道路探索和实践的失败。（1分）（2）一战后世界范围内的反资本主义浪潮，使中国先进分子开始对它有所怀疑和保留，思想界群体趋向社会主义。（1分）（3）十月革命促进马克思主义的传播，中国产生了一批具有初步共产主义思想的知识分子。（1分）（4）新文化运动形成的一场前所未有的启蒙运动和空前深刻的思想解放运动，为适合中国需要的新思潮，特别是马克思主义的传播，创造有利条件。（2分）（5）五四运动促进马克思主义在中国的传播及其与工人运动的结合。（1分）","id":15},{"type":"short","title":"试述孙中山的三民主义？","hint":"","options":[],"answer":"（1）民族主义：“驱除鞑虏，恢复中华”即实行民族革命。内容：用革命方式推翻满清王朝、建立民族独立国家。（2分）（2）民权主义：“创立民国”，即政治革命，也是三民主义的核心。内容：政治革命与民族革命并行；中心目标是推翻封建君主专制制度，最终目的是建立主权在民、实行民主政治的民国政府。（2分）（3）民生主义：“平均地权”，即社会革命。（1分）孙中山的三民主义学说，初步描绘出中国还不曾有过的资产阶级共和国方案，是一个比较完整而明确的资产阶级民主纲领。（1分）","id":16},{"type":"short","title":"简述近代中国工人阶级的特点？","hint":"","options":[],"answer":"中国工人阶级的主要来源是城乡破产失业的农民/手工业者和城市贫民，他们除了具备世界工人阶级的一般特点如大公无私、富有组织纪律性等外，（1分）自身特点如下：（1）深受帝国主义、封建势力和资产阶级三重压迫和剥削，其革命性最强。（2分）。（2）人数虽少，但相对集中，便于形成革命的力量和传播先进的思想。（1分）。（3）主要是由破产农民和家庭手工业者转化而来，同农民有着天然的联系，便于结成工农联盟。（2分）。","id":17},{"type":"short","title":"简述19世纪末，维新派对封建主义妥协的主要表现？","hint":"","options":[],"answer":"（1）政治上，不敢根本否定封建君主制度，幻想通过合法手段实现君主立宪。（2分）（2）经济上，没有触及封建主义经济基础——封建土地所有制。（2分）（3）思想上，虽提倡学习西方，却仍借孔子之名“托古改制”。（2分）","id":18},{"type":"short","title":"以毛泽东为代表的中国共产党人是如何探索和开辟中国革命新道路的？","hint":"","options":[],"answer":"（1）开展武装反抗国民党统治的斗争。（1分）（2）创建农村革命根据地，保存和发展革命力量。点燃了“工农武装割据”的星星之火。（1分）（3）毛泽东从理论上阐明了武装斗争的极端重要性和农村应当成为党的工作中心的思想。这是促进全国革命高潮的最重要因素。（1分）（4）革命新道路的开辟，使中国革命开始走向复兴。（1分）（5）农村包围城市，武装夺取政权理论的提出，标志着中国化的马克思主义——毛泽东思想的初步形成。（2分）","id":19},{"type":"short","title":"简述过渡时期总路线是如何反映了历史必然性的？","hint":"","options":[],"answer":"过渡时期总路线反映出了历史必然性。（1）社会主义工业化是国家独立富强的首要条件。（1分）（2）资本主义经济力量弱小，发展困难，不可能成为中国工业起飞的基础。（1分）（3）对个体农业进行社会主义改造，是保证工业发展、实现国家工业化的一个必要条件。（1分）（4）当时的国际环境也促使中国选择社会主义。（1分）总之，中国在20世纪50年代的最重要事件就是选择了社会主义，成功地进行了社会主义改造，实现了中国历史上最伟大、最深刻的社会变革。这是十分必要的、完全正确的。（2分）","id":20},{"type":"short","title":"简述中国抗日战争胜利的主要原因是什么？","hint":"","options":[],"answer":"（1）中国共产党在全民族抗战中发挥了中流砥柱作用，这是与历次反侵略战争最大区别（2分）（2）中国人民巨大的民族觉醒、空前的民族团结和英勇的民族抗争，是中国人民抗日战争胜利的决定性因素（2分）（3）中国人民抗日战争的胜利，同世界所有爱好和平和正义的国家和人民、国际组织以及各种反法西斯力量的同情和支持也是分不开的（2分）。","id":21},{"type":"short","title":"简述五四运动爆发的社会历史条件？","hint":"","options":[],"answer":"（1）新时代历史条件，它发生在十月革命所开辟的世界无产阶级社会主义革命的新时代（1分）（2）新的社会力量的成长。第一次世界大战期间，中国的民族资本主义经济得到短暂而又迅速的发展。中国工人阶级和民族资产阶级的力量也近一步壮大起来（2分）（3）新文化运动掀起的思想解放高潮的推动为五四运动准备了最初群众基础和骨干力量（2分）（4）五四运动的直接导火线是巴黎和会上中国外交的失败（1分）","id":22},{"type":"short","title":"简述中国封建社会的基本特点?","hint":"","options":[],"answer":"（1）在经济上，封建土地所有制占主导地位，地主阶级和农民阶级的矛盾尖锐（2分）（2）在政治上，实行高度中央集权的封建君主专制制度。在文化上，以儒家思想为核心（2分）（3）在社会结构上，是族权和政权相结合的封建宗法等级制度。地主阶级和农民阶级的矛盾是中国封建社会的主要矛盾（2分）","id":23},{"type":"short","title":"近代中国民族资本主义经济的特点是什么？","hint":"","options":[],"answer":"（1）民族资本主义经济在国民经济中比重很小，始终没有成为中国社会经济主要形式。（1分）（2）在民族资本中，工业资本所占比重小，商业资本和金融资本所占比重大。（1分）（3）民族资本所经营的工业，规模小，经营分散，技术设备落后，生产率低。（1分）（4）民族资本主义工业以轻工业为主，缺乏重工业，不能构成一个完整的工业体系。（2分）（5）民族资本主义经济和封建势力有联系。（1分）","id":24},{"type":"short","title":"中国共产党抗日民族统一战线的策略总方针是什么?","hint":"","options":[],"answer":"总方针是：发展进步势力、争取中间势力、孤立顽固势力（1分）（1）进步势力主要是指工人、农民和城市小资产阶级。他们统一战线的基础，抗战的主要依靠力量。这是整个策略的中心环节。（2分）（2）中间势力主要是指民族资产阶级、开明绅士和地方实力派。它是统一战线的重要任务。争取中间势力的条件是：共产党要有充足力量；尊重他们的利益；同顽固派坚决斗争并聚星胜利。（2分）（3）顽固势力是指大地主大资产阶级的抗日派。他们采取两面政策，既抗日也反共。共产党必须以革命的两面政策对付他们，又联合又斗争的政策。以团结为主。（1分）","id":25},{"type":"essay","title":"结合大学生思想实际谈谈遵义会议的历史意义？","hint":"","options":[],"answer":"（1）它解决了当时具有决定意义的军事和组织问题。成立了由毛泽东、周恩来、王稼祥组成的三人团，全权负责红军的军事行动（2分）（2）遵义会议在及其危险的情况下挽救了中国共产党，挽救了中国工农红军挽救了中国革命，开始确立了以毛泽东为代表的新的中央的领导，为中国共产党历史上一个生死攸关的转折点，标志着中国共产党在政治上走向成熟（3分）（3）它证明了中国共产党历来都是正视自己的错误，并注意从自己所犯的错误中学习前汲取教训的。不断把党及党领导的革命事业推向前进（2分）（4）结合个人思想实际的论述（8分）","id":1},{"type":"essay","title":"结合大学生思想实际谈谈为什么说党的十一届三中全会是新中国成立以来的伟大历史转折？","hint":"","options":[],"answer":"(1)从十一届三中全会的内容来说 ①全会冲破了长期“左”倾错误的严重束缚，彻底否定了“两个凡是”的错误方针，高度评价了关于真理标准问题的讨论，并且断然否定“以阶级斗争为纲”的指导思想，作出了把工作重点转移到社会主义现代化建设上来和实行改革开放的战略决策。（2分）②全会恢复了党的民主集中制的优良传统，审查解决了历史上遗留的一批重大问题和一些重要领导人的功过是非问题。（1分）(2)从十一届三中全会的影响和意义来讲，①全会结束了粉碎“四人帮”后两年在徘徊中前进的局面，标志着中国共产党重新确立了马克思主义的思想路线、政治路线、组织路线，开始了在思想、政治、组织等领域的全面拨乱反正，形成了以邓小平为核心的党的中央领导集体，揭开了社会主义改革开放的序幕。（2分）②以这次全会为起点，中国进入了改革开放和社会主义现代化建设的历史新时期。党和国家充满希望和活力地踏上了实现社会主义现代化的伟大征程。（2分）（3）结合个人思想实际的论述（8分）","id":2},{"type":"essay","title":"结合大学生思想实际谈谈20世纪中国经历的三次历史性巨大变化？","hint":"","options":[],"answer":"（1）第一次是辛亥革命，推翻了统治中国几千年的君主专制制度。它开创了完全意义上的近代民族民主革命。辛亥革命未能改变旧中国的社会性质和人民的悲惨境遇，但为中国的进步打开了大门，使反动统治秩序也无法稳定下来。（2分）第二次是中华人民共和国的成立和社会主义制度的确立。它推翻了帝国主义、封建主义和官僚资本主义的反动统治，实现了民族独立和人民解放，建立了人民当家作主的新中国，为实现中华民族的伟大复兴创造了前提。（2分）（3）第三次是改革开放，为实现社会主义现代化而奋斗。它成功地开创了中国特色社会主义道路，初步建立起社会主义市场经济体制，大幅度提高了我国的综合国力和人民生活水平，为全面建设小康社会、基本实现现代化开辟了广阔的前景。（3分）（4）结合个人思想实际的论述（8分）","id":3},{"type":"essay","title":"结合大学生思想实际谈谈如何理解五四运动的历史特点和历史意义？","hint":"","options":[],"answer":"（1）五四运动是中国近代史上一次彻底的反帝反封建的革命运动，表现了反帝反封建的彻底性。把中国人民反帝反封建的斗争提升到一个新的水平。（1分）（2）五四运动广泛地动员和组织了群众，是一场真正的群众性的革命运动。青年学生起了先锋作用，中国工人阶级开始登上政治舞台，在运动后期发挥了主力军作用。（2分）（3）五四运动促进了马克思主义在中国的广泛传播，促进了马克思主义同中国工人运动的结合，为中国共产党的成立作了思想和干部上的准备。（2分）（4）五四运动是中国新民主主义革命的伟大开端。五四运动以后，无产阶级逐渐代替资产阶级成为近代中国民族民主革命的领导者。（2分）（5）结合个人思想实际的论述（8分）","id":4},{"type":"essay","title":"结合大学生思想实际谈谈如何理解中国抗日战争胜利的伟大历史意义？","hint":"","options":[],"answer":"（1）彻底打败了日本侵略者捍卫了国家主权和领土完整，使中华民族免遭殖民奴役厄运。（2分）（2）促进了中华民族的觉醒，使中国人民在精神上、组织上的进步达到了前所未有的高度，为新民主主义革命的胜利奠定了基础。（2分）（3）促进了中华民族的大团结，弘扬了中华民族的伟大精神。（1分）（4）为战胜世界法西斯势力作出了历史性贡献，提高了中国的国际地位和国际影响。（2分）（5）结合个人思想实际的论述（8分）","id":5},{"type":"essay","title":"结合大学生思想实际谈谈如何理解中华人民共和国的成立开辟了中国历史的新纪元？","hint":"","options":[],"answer":"（1）帝国主义列强压迫中国、奴役中国人民的历史从此结束，中华民族一洗近百年来蒙受的屈辱，开始以崭新的姿态自立于世界的民族之林。（2分）（2）本国封建主义、官僚资本主义统治的历史从此结束，广大中国人民第一次成为新社会、新国家的主人。（1分）（3）军阀割据、战乱频发、匪患不断的历史从此结束，国家基本统一，民族团结，社会政治局面趋向稳定，各族人民开始过上安居乐业的生活。（1分）（4）从根本上改变了中国社会的发展方向，为实现由新民主主义向社会主义的过渡，创造了前提条件。（1分）（5）中国共产党成为执政党。它可以运用国家政权凝聚和集全国力量，巩固民族独立和人民解放的成果，解放并发展社会生产力，以造福于各族人民，造福于整个中华民族。（2分）（6）结合个人思想实际的论述（8分）","id":6},{"type":"essay","title":"结合大学生思想实际谈谈中国共产党成立的历史意义？","hint":"","options":[],"answer":"（1）她标志着中国革命终于有了一个坚强的领导核心。它的成立使中国革命有了可信赖的组织者和领导者，使中国工人阶级有了自己的司令部。（3分）（2）中国革命从此有了一个科学的指导思想，为中国人民指明了斗争的目标、革命的前途和走向胜利的道路。（3分）（3）沟通了中国革命与世界革命的联系，使中国革命有了新的前途。（1分）（4）结合个人思想实际的论述（8分）","id":7}],"shortName":"大一下·近代史","subtitle":"课程复习题库"},{"key":"marx","name":"大二上·马克思主义基本原理","shortName":"大二上·马原","subtitle":"课程复习题库","questions":[{"type":"theory","title":"马克思主义哲学的直接理论来源","hint":"基本理论观点","options":[],"answer":"德国的古典哲学","id":1},{"type":"theory","title":"在科学社会主义发展史上，标志空想社会主义诞生的著作","hint":"基本理论观点","options":[],"answer":"《乌托邦》","id":2},{"type":"theory","title":"划分唯物主义与唯心主义的唯一标准","hint":"基本理论观点","options":[],"answer":"是否承认物质第一性，意识第二性","id":3},{"type":"theory","title":"“盛年不重来，一日难再晨”，这个谚语说的是","hint":"基本理论观点","options":[],"answer":"时间的一维性","id":4},{"type":"theory","title":"区分量变与质变的根本标志是","hint":"基本理论观点","options":[],"answer":"事物的变化是否超出度的范围","id":5},{"type":"theory","title":"党的思想路线的核心是","hint":"基本理论观点","options":[],"answer":"实事求是","id":6},{"type":"theory","title":"在意识问题上，唯心主义的错误在于","hint":"基本理论观点","options":[],"answer":"夸大意识的能动作用","id":7},{"type":"theory","title":"一个正确的认识需要多次反复，并且是永无止境的发展过程，这说明","hint":"基本理论观点","options":[],"answer":"认识是有限与无限的统一","id":8},{"type":"theory","title":"在真理问题上坚持辩证法，就是承认任何真理都是","hint":"基本理论观点","options":[],"answer":"绝对性与相对性的统一","id":9},{"type":"theory","title":"上层建筑的两大组成部分是","hint":"基本理论观点","options":[],"answer":"政治法律制度及设施、政治组织和社会意识形态","id":10},{"type":"theory","title":"唯物辩证法和形而上学分歧的焦点是","hint":"基本理论观点","options":[],"answer":"是否承认事物发展的根本原因在于事物内部矛盾性","id":11},{"type":"theory","title":"认识的主体和客体之间的最基本关系是","hint":"基本理论观点","options":[],"answer":"改造与被改造的实践关系","id":12},{"type":"theory","title":"唯物辩证法提供的最根本的认识方法是","hint":"基本理论观点","options":[],"answer":"矛盾分析法","id":13},{"type":"theory","title":"马克思的辩证法认为，决定事物性质的是","hint":"基本理论观点","options":[],"answer":"事物主要矛盾的主要方面","id":14},{"type":"theory","title":"古代理论家公孙龙提出的“白马非马”论，割裂了","hint":"基本理论观点","options":[],"answer":"共性与个性的统一","id":15},{"type":"theory","title":"划分阶级的唯一标准是","hint":"基本理论观点","options":[],"answer":"经济标准","id":16},{"type":"theory","title":"区分不变资本和可变资本的依据是","hint":"基本理论观点","options":[],"answer":"资本的不同部分在价值增值过程中起不同的作用","id":17},{"type":"theory","title":"具体劳动和抽象劳动是","hint":"基本理论观点","options":[],"answer":"同一劳动过程的不可分割的两个方面","id":18},{"type":"theory","title":"私人劳动要转化为社会劳动必须通过","hint":"基本理论观点","options":[],"answer":"商品交换","id":19},{"type":"theory","title":"金融寡头在经济上的统治，采取的形式是","hint":"基本理论观点","options":[],"answer":"参与制","id":20},{"type":"theory","title":"在资本循环中，由商品资本转化为增值了的货币资本的阶段是","hint":"基本理论观点","options":[],"answer":"售卖阶段","id":21},{"type":"theory","title":"垄断资本主义发展的历史趋势是","hint":"基本理论观点","options":[],"answer":"生产资料公有制代替私有制","id":22},{"type":"theory","title":"相对剩余价值的获得是","hint":"基本理论观点","options":[],"answer":"全社会劳动生产率普遍提高的结果。","id":23},{"type":"theory","title":"单位商品的价值量与包含在该商品中的社会必要劳动量是","hint":"基本理论观点","options":[],"answer":"成正比","id":24},{"type":"theory","title":"社会资本再生产的核心问题是","hint":"基本理论观点","options":[],"answer":"社会总产品的实现","id":25},{"type":"theory","title":"马克思主义政治经济学的直接理论来源是","hint":"基本理论观点","options":[],"answer":"英国的古典经济学","id":26},{"type":"theory","title":"“只见树木，不见森林”，是","hint":"基本理论观点","options":[],"answer":"形而上学的观点","id":27},{"type":"theory","title":"物质的唯一特性是客观实在性，“客观实在”是指","hint":"基本理论观点","o wer":"实事求是的方法 、辩证分析的方法 、矛盾分析的方法 、历史分析的方法","id":155},{"type":"theory","title":"实践活动基本类型","hint":"基本理论观点","options":[],"answer":"物质生产实践 、社会政治实践 、科学文化实践","id":156},{"type":"theory","title":"任何真理都是","hint":"基本理论观点","options":[],"answer":"客观真理、绝对真理 、相对真理","id":157},{"type":"theory","title":"政治上层建筑包括","hint":"基本理论观点","options":[],"answer":"政治法律制度 、军队 、监狱 、法庭","id":158},{"type":"theory","title":"马克思在劳动创造价值理论的基础上，把商品生产劳动又划分为","hint":"基本理论观点","options":[],"answer":"具体劳动、抽象劳动 、私人劳动 、社会劳动","id":159},{"type":"theory","title":"资本循环经历的阶段","hint":"基本理论观点","options":[],"answer":"购买阶段 、生产阶段 、售卖阶段","id":160},{"type":"theory","title":"共产主义社会，由于社会生产力的巨大发展，必将消失的差别是","hint":"基本理论观点","options":[],"answer":"工业与农业 、城市与乡村 、脑力劳动和体力劳动","id":161},{"type":"theory","title":"唯物辩证法的总特征","hint":"基本理论观点","options":[],"answer":"联系的观点 、发展的观点","id":162},{"type":"theory","title":"矛盾的基本属性","hint":"基本理论观点","options":[],"answer":"斗争性 、同一性","id":163},{"type":"theory","title":"当今世界上的资本主义国家大多实行的是多党制，包括","hint":"基本理论观点","options":[],"answer":"法国 、日本 、德国、意大利","id":164},{"type":"theory","title":"马克思主义基本特征","hint":"基本理论观点","options":[],"answer":"科学性 、人民性 、 实践性 、发展性","id":165},{"type":"theory","title":"必然与偶然的关系","hint":"基本理论观点","options":[],"answer":"二者相互依存 、偶然为必然开辟道路必然决定偶然 、二者可以相互转化","id":166},{"type":"short","title":"简述马克思主义及其特点。","hint":"","options":[],"answer":"（1）马克思主义是由马克思和恩格斯创立并为后继者所不断发展的科学理论体系，是关于自然、社会和人类思维发展一般规律的学说，是关于社会主义必然代替资本主义、最终实现共产主义的学说，是关于无产阶级解放、全人类解放和每个人自由而全面发展的学说，是指导人民创造美好生活的行动指南。（2）马克思主义具有鲜明的科学性、人民性、实践性、发展性。","id":1},{"type":"short","title":"意识的能动作用及其表现。","hint":"","options":[],"answer":"（1）意识的能动作用是人的意识所特有的积极反映世界与改造世界的能力和活动。（2）意识具有目的性和计划性。（3）意识活动具有创造性。（4）意识具有指导实践改造客观世界的作用。（5）意识还具有指导、控制人的行为和生理活动的作用。","id":2},{"type":"short","title":"简述价值规律的基本内容及其表现形式","hint":"","options":[],"answer":"（1）价值规律是商品生产和商品交换的基本规律。（2）商品的价值量是由生产商品的社会必要劳动时间决定的，商品交换以价值量为基础，实行等价交换。（3）价值规律的表现形式是，商品的价格围绕价值自发波动。","id":3},{"type":"short","title":"计算题：资本家投资100万元，每次投资的剩余价值率为80%，每次投资的利润20万元。问该资本家预付资本的有机构成是多少？（要求：写出完整的计算步骤）","hint":"","options":[],"answer":"剩余价值m=利润p，所以m=20万。剩余价值率m’=80%=m/v，所以v=20/80%=25万预付资本c+v=100万，那么c=100万-25万=75万资本有机构成c/v=75万/25万=3/1","id":4},{"type":"short","title":"简述社会主义建设长期性的原因。","hint":"","options":[],"answer":"（1）社会主义是一项崭新的事业，其建设必然是一个不断探索的长期过程。在经济文化相对落后的国家建设社会主义，更具有历史长期性。（2）生产力发展状况的制约；（3）经济基础和上层建筑发展状况的制约；（4）国际环境的挑战；（5）马克思主义政党对社会主义发展道路的探索和对社会主义建设规律的认识，需要一个长期的过程。","id":5},{"type":"short","title":"简述列宁物质定义的理论意义。","hint":"","options":[],"answer":"（1）坚持了唯物主义一元论，同唯心主义一元论和二元论划清了界限。（2）坚持了能动的反映论和可知论，批判了不可知论。（3）体现了唯物论和辩证法的统一，克服了形而上学唯物主义的缺陷。（4）体现了唯物主义自然观与历史观的统一，为彻底的唯物主义奠定了理论基础。","id":6},{"type":"short","title":"简述对立统一规律是唯物辩证法的实质和核心。","hint":"","options":[],"answer":"（1）对立统一规律揭示了事物普遍联系的根本内容和变化发展的内在动力。（2）对立统一规律是贯穿质量互变规律、否定之否定规律以及唯物辩证法基本范畴的中心线索，也是理解这些规律和范畴的“钥匙”。（3）对立统一规律提供了认识世界和改造世界的根本方法----矛盾分析法。","id":7},{"type":"short","title":"简述价值规律的作用","hint":"","options":[],"answer":"（1）自发节生产资料和劳动力在社会各生产部门之间的分配比例。（2）自发地刺激社会生产力的发展。（3）自发地节社会收入的分配。消极作用：导致社会资源浪费；阻碍技术进步；导致收入两极分化。","id":8},{"type":"short","title":"计算题：某一资本家投资创办企业从事生产，60万用于固定资本，以购买机器设","hint":"","options":[],"answer":"备等，40万用于流动资本，以购买原材料和劳动力，其中购买原材料支付了30万。一轮生产结束后，该企业的总资本达到了120万。问该企业的剩余价值率和利润率为多少？（要求：写出完整的计算步骤。）（1） 剩余价值m=120 – 60 – 40 = 20万（2） 可变资本 v= 40 - 30 =10万剩余价值率m’= m/v =20/10x100%=200%全部预付资本为60+40=100万(5) 利润率p’= m/全部预付资本= 20/100 x100%= 20%","id":9},{"type":"short","title":"简述社会主义发展道路多样性的原因。","hint":"","options":[],"answer":"（1）各个国家的生产力发展状况和社会发展阶段决定了社会主义发展道路具有不同的特点。（2）历史文化传统的差异性是造成不同国家社会主义发展道路多样性的重要条件。（3）时代和实践的不断发展，是造成社会主义发展道路多样性的现实原因。（4）无产阶级政党自身的成熟程度的不同，也是导致社会主义发展道路多样化的一个原因。","id":10},{"type":"short","title":"简述马克思主义的辩证否定观。","hint":"","options":[],"answer":"（1）否定是事物的自我否定，是事物内部矛盾运动的结果。（2）否定是事物发展的环节。（3）否定是新旧事物联系的环节。（4）辩证否定的实质是“扬弃”，即新事物对旧事物既批判又继承，既克服又保留。","id":11},{"type":"short","title":"为什么说私人劳动和社会劳动的矛盾构成商品经济的基本矛盾？","hint":"","options":[],"answer":"（1）私人劳动和社会劳动的矛盾构成私有制商品经济的基本矛盾，这一矛盾贯穿商品经济发展过程的始终，决定着商品经济的各种内在矛盾及其发展趋势。（2）私人劳动和社会劳动的矛盾决定着商品经济的本质及发展过程。（3）私人劳动和社会劳动的矛盾是商品经济其他一切矛盾的基础。（4）私人劳动和社会劳动的矛盾决定着商品生产者的命运。","id":12},{"type":"short","title":"简述探索适合本国国情的社会主义发展道路必须坚持的原则。","hint":"","options":[],"answer":"第一，必须坚持对待马克思主义的科学态度。第二，必须从当时当地的历史条件出发，坚持“走自己的路”。第三、必须充分吸收人类一切优秀文明成果。","id":13},{"type":"short","title":"简述运动与静止的对立统一关系。","hint":"","options":[],"answer":"（1）物质世界的运动是绝对的，而物质运动过程中又包含着相对静止。（2）运动的绝对性体现了物质运动的变动性、无条件性，静止的相对性体现了物质运动的稳定性、有条件性。（3）运动和静止相互依赖、相互透、相互包含，“动中有静，静中有动”。无条件的绝对运动和有条件的相对静止构成了对立统一关系。","id":14},{"type":"short","title":"简述现象与本质的区别。","hint":"","options":[],"answer":"（1）本质是一般、普遍的，现象是个别的、具体的；（2）本质是相对稳定的，现象是多变易逝的；（3）本质深藏于事物的内部，只有通过理性思维才能把握，而现象则是表面的、外显的，可以直接为人的感官所感知。","id":15},{"type":"short","title":"简述物质资料的生产方式是社会发展的决定力量。","hint":"","options":[],"answer":"首先，物质生产活动及生产方式是人类社会赖以存在和发展的基础，是人类其他一切活动的首要前提。其次，物质生产活动及生产方式决定社会的结构、性质和面貌，制约着人们的经济生活、政治生活和精神生活等全部生活。最后，物质生产活动及生产方式的变化发展决定了整个社会历史的变化发展，决定社会形态从低级向高级的更替和发展。","id":16},{"type":"short","title":"简述感性认识和理性认识及二者的关系。","hint":"","options":[],"answer":"一是理性认识依赖于感性认识。二是感性认识有待于发展和深化为理性认识。三是感性认识和理性认识相互透、相互包含。","id":17},{"type":"short","title":"简述社会意识相对独立性。","hint":"","options":[],"answer":"一是社会意识与社会存在发展具有不完全同步性和不平衡性。二是社会意识内部各种形式之间存在相互影响且各自具有历史继承性。三是社会意识对社会存在具有能动的反作用，这是社会意识相对独立性的突出表现。","id":18},{"type":"short","title":"简述共产主义社会的基本特征。","hint":"","options":[],"answer":"物质财富极大丰富，消费资料按需分配。社会关系高度和谐，人们精神境界极大提高。实现每个人自由而全面发展，人类从必然王国向自由王国飞跃。","id":19},{"type":"short","title":"简述偶然性与必然性的关系。","hint":"","options":[],"answer":"（1）必然与偶然相互依存。一方面，没有脱离偶然的必然。必然总是伴随着偶然，要通过偶然来表现出来，并为自己开辟道路。另一方面，没有脱离必然的偶然，必然起着决定作用，并制约着偶然。（2）必然与偶然在一定条件下相互转化。","id":20},{"type":"essay","title":"习近平指出：“我们既要绿水青山，也要金山银山。宁要绿水青山，不要金山银山，而且绿水青山就是金山银山。”请结合自然地理环境在社会生存和发展中的作用，谈谈怎样认识和处理经济发展与环境保护的关系。","hint":"","options":[],"answer":"（1）习总书记的讲话，深刻说明了自然地理环境在人类社会生存和发展过程中的重要作用。（2）自然地理环境是人类社会生存和发展永恒的、必要的条件，是人们生活和生产的自然基础。自然地理环境提供了社会生活和生产资料的来源；自然环境的优劣对劳动生产率的提高产生积极或消极的影响，并对社会发展起促进或延缓的作用；自然地理环境的作用要受社会发展状况的制约，特别是物质资料生产方式的制约。（3）自然生态环境对社会发展起着重要作用。合理利用自然资源，保护生态平衡，使社会得以正常发展的必要条件。当今世界出现的生态、环境、人口、资源等全球危机问题，并不单纯是自然系统内平衡关系的破坏，实际上也是人与自然关系的严重失衡。（4）坚持人与自然和谐共生，建设生态文明，是中华民族永续发展的千年大计。我们要从自己做起，像爱护眼睛一样爱护生态环境，形成绿色、低碳、环保的生产方式，创造良好生产生活环境，建设美丽中国。","id":1},{"type":"essay","title":"结合实际谈谈资本主义发展的历史进步性和局限性。","hint":"","options":[],"answer":"（1）资本主义社会同历史上有过的一切其他社会制度一样，其产生、发展以及最终为另一种更高级的社会制度所代替，都是由人类社会发展的一般规律决定的，是客观的不以人的意志为转移的自然历史过程。但同此前的其他社会制度相比，资本主义制度空前地提高了社会生产力，这是以往任何社会所不可比拟的，显示出巨大的历史进步性。第一，资本主义将科学技术转化为强大的生产力；第二，资本追求剩余价值的内在动力和争的外在压力推动了社会生产力的迅速发展；第三，资本主义的意识形态和政治制度在战胜封建社会自给自足的小生产的生产方式，保护、促进和完善资本主义生产方式方面起着重要作用，从而推动了生产力的迅速发展，促进社会进步。（2）然而，资本主义的历史进步性并不能掩盖其自身的局限性，其表现是：第一，资本主义的基本矛盾阻碍社会生产力的发展；第二，资本主义制度下财富占有两极分化，引起经济危机；第三，资产阶级支配和控制资本主义经济和政治的发展和运行，不断激化社会矛盾和冲突。（3）上述局限性决定了在资本主义经济、政治、文化、和社会各个领域以及全球范围内必然产生冲突、动和危机。这些局限性在资本主义生产方式范围内是不可能根本消除的，它决定了资本主义生产方式的历史过渡性，必将被社会主义制度所取代。","id":2},{"type":"essay","title":"结合实际谈谈中国特色社会主义的成功实践、及中国式现代化发展对世界社会主义发展的贡献。","hint":"","options":[],"answer":"（1）经过几十年的实践探索，中国特色社会主义取得了举世瞩目的辉煌成就。中国特色社会主义进入新时代，是社会主义实践探索的新境界，在社会主义发展史上具有重要地位，不仅对中国社会主义事业具有现实意义，而且对世界社会主义的发展具有广泛影响。（2）党的二十大擘画了中国特色社会主义事业发展的崭新蓝图，强以中国式现代化推进中华民族伟大复兴。中国式现代化，是中国共产党领导的现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。中国式现代化是是人口规模巨大的现代化，是全体人民共同富裕的现代化，是物质文明和精神文明相协的现代化，是人与自然和谐共生的现代化，是走和平发展道路的现代化。（3）中国式现代化不仅改变了中国的面貌，而且具有重大世界意义。第一，中国式现代化为人类实现现代化提供了新的选择。中国式现代化用事实表明，世界既不存在唯一的现代化模式，也不存在完全统一的现代化标准。中国式现代化彻底打破了只有遵循资本主义发展模式才能实现现代化的神话，给世界上那些既希望加快发展又希望保持独立性的国家和民族提供了宝贵经验与全新选择。第二，中国式现代化充分证明了科学社会主义的真理性。中国共产党带领中国人民走出了中国式现代化道路，实现了人类现代化史上经济快速发展和社会长期稳定两大奇迹，充分展示了社会主义的巨大优越性，充分证明了科学社会主义的真理性，必将引领世界社会主义走向振兴和辉煌。","id":3},{"type":"essay","title":"试述世界物质统一性原理，对于树立科学世界观和发展中国特色社会主义的指导意义。","hint":"","options":[],"answer":"（1）马克思主义认为，世界的统一性在于它的物质性，世界统一于物质。第一，自然界是物质的；第二，人类社会本质上是生产实践基础上形成的物质体系；第三，人的意识统一于物质。（2）世界物质统一性原理是辩证唯物主义最基本、最核心的观点，是马克思主义的基石，有助于我们树立唯物主义科学世界观，为我们进一步确立正确的人生观和价值观奠定坚实的基础；同时也有助于我们确立正确的思想路线和思想方法，在认识世界和改造世界的过程中，摒弃一切无视客观世界及其规律性的思想观念，遵循一切从实际出发、实事求是的原则。（3）一切从实际出发是世界的物质统一性原理在现实生活中和实际工作的生动体现，是在坚持和发展中国特色社会主义伟大实践中想问题、办事情的根本立足点。（4）特别是在推进新时代中国特色社会主义事业的进程中，我们要从我国社会主义初级阶段的最大国情出发，既要看到我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，也要看到我国社会主义的主要矛盾发生了变化，已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，从而使社会主义初级阶段的长过程中又呈现出更加具体的阶段性特征。","id":4},{"type":"essay","title":"结合实际谈谈经济全球化的发展对于中国经济发展带来的影响。","hint":"","options":[],"answer":"（1）经济全球化是指在生产不断发展、科技加强进步、社会分工和国际分工不断深化、生产社会化程度不断提高的情况下，世界各国各地区的经济活动越来越超出某一国家和地区的范围而相互联系、相互依存的过程。（2）经济全球化体现了社会化生产的要求，不仅发达国家从中受益，一些发展中国家在参与经济全球化进程中也得到了快速发展，中国就是发展中国家的代表。经济全球化对发展中国家的积极作用主要表现在：第一，它为发展中国家提供先进技术和管理经验。第二，它为发展中国家提供了更多的就业机会。第三，它推动发展中国家国际贸易的发展。第四，它促进发展中国家跨国公司的发展。同时它也带来了一些负面影响：第一，发达国家与发展中国家在经济全球化过程中的地位和收益不平等、不平衡。第二，加剧了发展中国家资源短缺和环境污染。第三，一定程度上加剧了经济风险。（3）面对经济全球化发展的历史必然性，面对国际范围内保护主义倾向抬头，国际贸易规则制定出现政治化、碎片化的风险挑战，必须认识到，经济全球化不是一部分国家的独角戏，而是世界各国、各民族共同实现发展的大舞台，要以共同构建人类命运共同体的理念引领经济全球化，“推动经济全球化朝着更加开放、包容、普惠、平衡、共赢的方向发展”。（2分）（4）改革开放以来，我国充分利用经济全球化带来的机遇，不断扩大对外开放，实现了我国同世界关系的历史性改变，中国既是受益者又是贡献者。党的二十大报告指出：“中国坚持经济全球化正确方向，推动贸易和投资自由化便利化，推进双边、区域和多边合作，促进国际宏观经济政策协，共同营造有利于发展的国际环境，共同培育全球发展新动能，反对保护主义，反对‘筑墙设垒’、‘脱钩断链’，反对单边制裁、极限施压。”","id":5},{"type":"essay","title":"如何处理好主观能动性和客观规律性的关系？实践过程中，怎样才能正确发挥人的主观能动性？","hint":"","options":[],"answer":"（1）二者关系：一方面，尊重客观规律是正确发挥主观能动性的前提。另一方面，只有充分发挥主观能动性，才能正确认识规律和利用规律。（2）正确发挥人的主观能动性，应具备三个条件：A从实际出发是正确发挥人的主观能动性的前提。B实践是正确发挥人的主观能动性的基本途径。C正确发挥人的主观能动性，还需要依赖一定的物质条件和物质手段。注：每一观点需要展开，没有展开扣一分。","id":6},{"type":"essay","title":"为什么说真理既是绝对的又是相对的？把握这一观点对于坚持和发展马克思主义有什么重要意义？","hint":"","options":[],"answer":"（1）真理是标志主观与客观相符合的哲学范畴，是对客观事物及其规律的正确反映。真理既具有绝对性，又具有相对性，它们是同一客观真理的两种属性，这是真理问题上的辩证法。任何真理都是绝对性和相对性的统一，二者相互联系、不可分割。（2分）（2）真理的绝对性是指真理主客观统一的确定性和发展的无限性。它有两个方面的含义：一是指任何真理都是标志着主观与客观之间的符合，都包含着不依赖于人和人的意识的客观内容，都是同谬误有原则的界限。二是人类认识按其本性来说，能够正确认识无限发展的物质世界，认识每前进一步，都是对无限发展着的物质世界的接近，这一点也是绝对的、无条件的。（3分）（3）真理的相对性是指人们在一定条件下对客观事物及其本质和发展规律的正确认识总是有限度的、不完善的。它具有两个方面的含义：一是从客观世界的整体来看，任何真理都只是对客观世界的某一阶段、某一部分的正确认识，但认识的广度总是有限度的，因而认识有待扩展。二是就特定事物而言，任何真理都只是对客观对象一定方面、一定层次和一定程度的正确认识，但认识的深度是有限度的，或是近似性的。因而认识有待于深化。（3分）（4）马克思主义作为客观真理，是绝对性和相对性的统一。它正确反映了人类社会的发展规律，因而具有绝对性。但马克思主义并没有穷尽对一切事物及其规律的认识，仍需要随着社会实践的发展而发展，因而又具有相对性。马克思主义真理的绝对性要求我们必须坚持以马克思主义作为指导思想，反对马克思主义“过时论”。马克思主义真理的相对性要求我们又必须在实践中丰富和发展马克思主义，反对实际工作中的教条主义。（2分）","id":7},{"type":"essay","title":"习近平总书记指出：“青年是标志时代的最灵敏的晴雨表，时代的责任赋予青年，时代的光荣属于青年。”结合实际谈谈当代大学生应该怎样确立和追求自己的人生理想？","hint":"","options":[],"answer":"（1）青年是祖国的未来、民族的希望。青年兴则国家兴，青年强则国家强。实现中华民族的伟大复兴的中国梦，夺取新时代中国特色社会主义的伟大胜利，将全国各族人民的共同理想变为现实，需要一代又一代的有志青年接续奋斗。青年一代的理想信念、精神状态、综合素质，是一个国家发展活力的重要体现，也是一个国家核心争力的重要因素。青年一代有理想、有本领、有担当，国家就有前途，民族就有希望。（2）党的十八大以来，中国特色社会主义进入新时代，为当代青年特别是当代大学生提供了施展才华的舞台和历史机遇，新时代青年必须坚定理想信仰。习近平指出：青年时代树立正确的理想、坚定的信念十分紧要，不仅要树立，而且要在心中扎根，一辈子都能坚持为之奋斗。理想信念是精神上的“钙” ，是人的精神支柱和精神脊梁 ，是鼓舞人们前进和奋斗的强大精神动力。（3）我们当代大学生要坚定理想信念，自觉做中国特色社会主义共同理想的坚定信仰者、忠诚实践者。为此就要深入学习马克思主义基本原理和马克思主义中国化时代化的理论成果，特别是要学习习近平新时代中国特色社会主义思想，让真理武装我们的头脑，让真理指引我们的理想，让真理坚定我们的信仰。要坚持学而信、学而用、学而行，把学习成果转化为不可撼动的理想信念，转化为正确的世界观、人生观、价值观，用理想之光照奋斗之路，用信仰之力开创美好未来。（4）结合实际部分。（自己的做法）","id":8},{"type":"essay","title":"深刻分析第二次世界大战后资本主义发生变化的原因，对于我们正确认识资本主义的本质，把握资本主义发展趋势有什么重要意义？","hint":"","options":[],"answer":"（1）二战后，资本主义法神变化的原因：首先，科学技术革命和生产力的发展，是资本主义发生变化的根本推动力量。其次，工人阶级争取自身权力和利益的斗争，是推动资本主义发生变化的重要力量。再次，社会主义制度初步现实的优越性对资本主义产生重要的影响。最后，主张改良主义政党对资本主义制度的改革，也是资本主义发生变化起到了重要作用。（2）正视这些变化，深刻分析这些变化的实质，对于我们正确认识资本主义的本质、把握资本主义发展趋势具有重要意义。第一，第二次世界大战后资本主义发生的变化从根本上说是人类社会发展的一般规律和资本主义经济规律作用的结果。第二，第二次世界大战后资本主义发生的变化是资本主义制度基本框架内的变化，并不意味着资本主义生产关系的根本性质发生了变化。（3）这些表明，虽然第二次世界大战后资本主义发生了一些变化，但是这些变化并没有改变资本主义制度的本质，并没有克服资本主义的基本矛盾，也没有改变马克思主义关于资本主义的基本科学论断的科学性，根源于资本主义基本矛盾的经济危机依然是资本主义不可克服的痼疾。（4）正确认识资本主义这些变化，有助于我们在深刻洞察资本主义本质的同时，实事求是地分析和借鉴资本主义发展过程中出现的符合社会化大生产要求的积极因素，为我所用，以进一步完善和发展社会主义制度。","id":9},{"type":"essay","title":"用马克思主义关于人民群众是历史的创造者原理，阐述习近平总书记“以人民为中心”思想的科学性。","hint":"","options":[],"answer":"（1）原理：a人民群众是社会物质财富的创造者。b人民群众是社会精神财富的创造者。c人民群众是社会变革的决定力量。d人民群众创造历史的活动受到一定社会历史条件的制约，包括经济条件、政治条件、精神条件。（2）当前，我国处于并将长期处于社会主义初级阶段，还存在发展不平衡不充分的问题。这就要求我们必须坚持社会主义改革，加强五位一体的建设，进一步动和发挥人民群众的积极性和创造性。（3）a、中国特色社会主义是中国人民开创和推进的伟大事业。以习近平总书记为核心的党中央提出坚持“以人民为中心”的思想，创造性地运用和发展了唯物史观关于人民群众创造历史的基本原理。b、坚持以人民为中心的思想，鲜明地体现了马克思主义政党的政治立场和执政理念，体现了共产党人的价值取向和工作导向。c、坚持以人民为中心的思想，站在时代和历史的高度，总结和概括了人民群众在中国特色社会主义实践中的伟大创造作用和主体地位，充分反映和顺应了人民群众的根本利益诉求，深刻阐明了中国共产党作为执政党的历史使命，进一步明确了实现人民对美好生活向往的奋斗目标。","id":10},{"type":"essay","title":"阐述科学社会主义基本原则的主要内容。","hint":"","options":[],"answer":"第一，资本主义必然灭亡，社会主义必然胜利。第二，无产阶级是最先进最革命的阶级，肩负着资本主义旧世界、建立社会主义和共产主义新世界的历史使命。第三，无产阶级革命是无产阶级进行斗争的最高形式，以建立无产阶级专政的国家权力为目的。第四，要在生产资料公有制的基础上组织生产，以满足全体社会成员的需要为生产的根本目的。第五，要对社会生产进行有计划的指导和节，实行按劳分配原则。第六，要合乎自然规律地改造和利用自然，努力实现人与自然的和谐共生。第七，必须坚持科学的理论指导，大力发展社会主义先进文化。第八，无产阶级政党是无产阶级先锋队，社会主义事业必须始终坚持无产阶级政党的领导。第九，社会主义社会要大力解放和发展生产力，逐步消灭剥削和消除两极分化，实现共同富裕和社会全面进步，并最终向共产主义社会过渡。第十，共产主义是人类最美好的社会制度，实现共产主义是共产党人的最高理想。","id":11}]},{"key":"mao","name":"大二下·毛概","shortName":"大二下·毛概","subtitle":"课程复习题库","questions":[{"id":1,"type":"short","title":"如何认识邓小平理论形成的社会历史条件?","hint":"如何·认识·邓小·平理","options":[],"answer":"和平与发展成为时代主题是邓小平理论形成的时代背景;(2分) 社会主义建设的经验教训是邓小平理论形成的历史根据;(2分) 改革开放和现代化建设的实践是邓小平理论形成的现实依据;(2分)"},{"id":2,"type":"short","title":"实行对外开放为什么要正确对待资本主义社会创造的现代文明成果?","hint":"实行·对外·开放·为什","options":[],"answer":"资本主义社会经过几百年发展,特别是一些发达国家,在经济、科技、教育、文化和社会管理等方面,积累了丰富经验,取得了许多历史性的文明成果。(3分)社会主义作为后起的崭新的社会制度,必须大胆借鉴、吸收人类社会包括资本主义社会创造出来的全部文明成果,结合新的实践进行新的创造,为我所用,才能加快发展,赢得同资本主义相比较的优势。(3分)"},{"id":3,"type":"short","title":"社会主义市场经济的理论要点有哪些?","hint":"社会·主义·市场·经济","options":[],"answer":"一是计划经济和市场经济不是划分社会制度的标志,计划经济不等于社会主义,市场经济也不等于资本主义;(2分) 二是计划和市场都是经济手段,对经济活动的节各有优势和长处,社会主义实行市场经济要把两者结合起来;(2分) 三是市场经济作为资源配置的一种方式本身不具有制度属性,可以和不同的社会制度结合,从而表现出不同的性质。(2分)"},{"id":4,"type":"short","title":"怎样认识社会主义改革的实质?","hint":"怎样·认识·社会·主义","options":[],"answer":"改革的实质,是要从根本上改变束缚我国生产力发展的经济体制,建立充满生机和活力的社会主义新经济体制,(3分)同时相应地改革政治体制和其他方面的体制,以实现中国的社会主义现代化。(3分)"},{"id":5,"type":"short","title":"如何认识邓小平理论的历史地位?","hint":"如何·认识·邓小·平理","options":[],"answer":"是马克思列宁主义、毛泽东思想的继承和发展;(2分) 是中国特色社会主义理论体系的开篇之作;(2分) 是改革开放和社会主义现代化建设的科学指南;(2分)"},{"id":6,"type":"short","title":"邓小平理论形成的时代背景、历史和现实依据是什么?","hint":"邓小·平理·论形·成的","options":[],"answer":"和平与发展成为时代主题是邓小平理论形成的时代背景;(2分) 社会主义建设的经验教训是邓小平理论形成的历史根据;(2分) 改革开放和现代化建设的实践是邓小平理论形成的现实依据;(2分)"},{"id":7,"type":"short","title":"在对外开放过程中,该如何对待资本主义社会的文明成果?","hint":"在对·外开·放过·程中","options":[],"answer":"资本主义社会经过几百年发展,特别是一些发达国家,在经济、科技、教育、文化和社会管理等方面,积累了丰富经验,取得了许多历史性的文明成果。(3分)社会主义作为后起的崭新的社会制度,必须大胆借鉴、吸收人类社会包括资本主义社会创造出来的全部文明成果,结合新的实践进行新的创造,为我所用,才能加快发展,赢得同资本主义相比较的优势。(3分)"},{"id":8,"type":"short","title":"社会主义改革的目标是什么?","hint":"社会·主义·改革·的目","options":[],"answer":"改革的目标,是要从根本上改变束缚我国生产力发展的经济体制,建立充满生机和活力的社会主义新经济体制,(3分)同时相应地改革政治体制和其他方面的体制,以实现中国的社会主义现代化。(3分)"},{"id":9,"type":"short","title":"对外开放的对象和范围是什么?","hint":"对外·开放·的对·象和","options":[],"answer":"对外开放包括对发达国家的开放,也包括对发展中国家的开放,是对世界所有国家的开放。(3分)它不仅是经济领域的开放,还包括科技、教育、文化等领域的开放。(3分)"},{"id":10,"type":"short","title":"怎样评价邓小平理论?","hint":"怎样·评价·邓小·平理","options":[],"answer":"是马克思列宁主义、毛泽东思想的继承和发展;(2分) 是中国特色社会主义理论体系的开篇之作;(2分) 是改革开放和社会主义现代化建设的科学指南;(2分)"},{"id":11,"type":"short","title":"如何理解科学发展观形成发展的社会历史条件?","hint":"如何·理解·科学·发展","options":[],"answer":"是在深刻把握我国基本国情和新的阶段性特征的基础上形成和发展的;(2分) 是在深入总结改革开放以来特别是党的十六大以来实践经验的基础上形成和发展的;(2分) 是在深刻分析国际形势、顺应世界发展趋势、借鉴国外发展经验的基础上形成和发展的;(2分)"},{"id":12,"type":"short","title":"怎样理解科学发展观的核心立场?","hint":"怎样·理解·科学·发展","options":[],"answer":"以人为本是科学发展观的核心立场。(1分) 以人为本就是以最广大人民的根本利益为本。(1分) 坚持以人为本,就要坚持发展为了人民,始终把最广大人民的根本利益放在第一位。(1分) 坚持以人为本,就要坚持发展依靠人民,从人民群众的伟大创造中汲取智慧和力量。(1分) 坚持以人为本,就要坚持发展成果由人民共享,着力提高人民物质文化生活水平。(1分) 坚持以人为本,最终是为了实现人的全面发展。(1分)"},{"id":13,"type":"short","title":"科学发展观的科学内涵是什么?","hint":"科学·发展·观的·科学","options":[],"answer":"推动经济社会发展是科学发展观的第一要义;(2分) 以人为本是科学发展观的核心立场;(2分) 全向协可持续是科学发展观的基本要求;统筹兼顾是科学发展观的根本方法;(2分)"},{"id":14,"type":"short","title":"怎样认识科学发展观的根本方法?","hint":"怎样·认识·科学·发展","options":[],"answer":"统筹兼顾是科学发展观的根本方法,深刻体现了唯物辩证法在发展问题上的科学运用,(3分)深刻揭示了实现科学发展、促进社会和谐的基本途径,是正确处理经济社会发展中重大关系的方针原则。(3分)"},{"id":15,"type":"short","title":"根据科学发展观,应当怎样运用统筹兼顾的根本方法?","hint":"根据·科学·发展·观","options":[],"answer":"坚持统筹兼顾,必须正确认识和妥善处理中国特色社会主义事业中的重大关系。(2分) 坚持统筹兼顾,必须认真考虑和对待各方面的发展需要,正确反映和兼顾各阶层各群体的利益要求。(2分) 坚持统筹兼顾,要牢牢掌握统筹兼顾的科学思想方法,努力提高战略思维、创新思维、辩证思维能力,不断增强统筹兼顾的本领,更好地推动科学发展。(1分) 坚持统筹兼顾,还要求我们既立足当前,又着眼长远,做到兼顾各方、综合平衡。(1分)"},{"id":16,"type":"short","title":"科学发展观的主要内容有哪些?","hint":"科学·发展·观的·主要","options":[],"answer":"加快转变经济发展方式;(1分) 发展社会主义民主政治;(1分) 推进社会主义文化强国建设;(1分) 构建社会主义和谐社会;(1分) 推进生态文明建设;(1分) 全面提高党的建设科学化水平;(1分)"},{"id":17,"type":"short","title":"如何理解科学发展观的历史地位?","hint":"如何·理解·科学·发展","options":[],"answer":"是中国特色社会主义理论体系的接续发展;(3分) 是全面建设小康社会、加快推进社会主义现代化的根本指针;(3分)"},{"id":18,"type":"short","title":"科学发展观是在怎样的基础上形成和发展的?","hint":"科学·发展·观是·在怎","options":[],"answer":"深刻把握我国基本国情和新的阶段性特征;(2分) 深入总结改革开放以来特别是党的十六大以来实践经验;(2分) 深刻分析国际形势、顺应世界发展趋势、借鉴国外发展经验;(2分)"},{"id":19,"type":"short","title":"应该如何把握“以人为本”这一科学发展观的立场?","hint":"应该·如何·把握·以人","options":[],"answer":"以人为本就是以最广大人民的根本利益为本。(1分) 坚持以人为本,就要坚持发展为了人民,始终把最广大人民的根本利益放在第一位。(2分) 坚持以人为本,就要坚持发展依靠人民,从人民群众的伟大创造中汲取智慧和力量。(1分) 坚持以人为本,就要坚持发展成果由人民共享,着力提高人民物质文化生活水平。(1分) 坚持以人为本,最终是为了实现人的全面发展。(1分)"},{"id":20,"type":"short","title":"应当怎样评价科学发展观?","hint":"应当·怎样·评价·科学","options":[],"answer":"是中国特色社会主义理论体系的接续发展;(3分) 是全面建设小康社会、加快推进社会主义现代化的根本指针;(3分)"},{"id":21,"type":"short","title":"新民主主义革命有哪些新的特点?","hint":"新民·主主·义革·命有","options":[],"answer":"中国革命处于世界无产阶级社会主义革命的时代,是世界无产阶级社会主义革命的一部分;(2分) 革命的领导力量是中国无产阶级及其先锋队--中国共产党;(2分) 革命的指导思想是马克思列宁主义;革命的前途是社会主义而不是资本主义;(2分)"},{"id":22,"type":"short","title":"新民主主义基本纲领的主要内容是什么?","hint":"新民·主主·义基·本纲","options":[],"answer":"推翻帝国主义和封建主义的统治,建立一个无产阶级领导的、以工农联盟为基础的、各革命阶级联合专政的新民主主义的共和国。(2分) 新民主主义的经济纲领是:没收封建地主阶级的土地归农民所有,没收官僚资产阶级的垄断资本归新民主主义的国家所有,保护民族工商业。(2分) 新民主主义文化,就是无产阶级领导的人民大众的反帝反封建的文化,即民族的科学的大众的文化。(2分)"},{"id":23,"type":"short","title":"如何认识党在社会主义建设道路上初步探索的重大意义?","hint":"如何·认识·党在·社会","options":[],"answer":"第一,巩同和发展了我国的社会主义制度。(2分) 第二,为开创中国特色社会主义提供了宝贵经验、理论准备、物质基础。(2分) 第三,丰富了科学社会主义的理论和实践。(2分)"},{"id":24,"type":"short","title":"新民主主义革命时期,为什么要建立最广泛的统一战线?","hint":"新民·主主·义革·命时","options":[],"answer":"建立最广泛的统一战线,首先是由中国半殖民地半封建社会的阶级状况所决定的。(3分) 建立最广泛的统一战线,也是由中国革命的长期性、残酷性及其发展的不平衡性所决定的。(3分)"},{"id":25,"type":"short","title":"新民主主义革命时期,中国共产党在加强自身建设中积累了哪些经验?","hint":"新民·主主·义革·命时","options":[],"answer":"第一,必须把思想建设始终放在党的建设的首位。(2分) 第二,必须在任何时候都重视党的组织建设。(2分) 第三,必须重视党的作风建设。(1分) 第四,必须联系党的政治路线加强党的建设。(1分)"},{"id":26,"type":"short","title":"与旧民主主义革命相比,新民主主义革命有什么新内容?","hint":"与旧·民主·主义·革命","options":[],"answer":"中国革命处于世界无产阶级社会主义革命的时代,是世界无产阶级社会主义革命的一部分;(2分) 革命的领导力量是中国无产阶级及其先锋队--中国共产党;(2分) 革命的指导思想是马克思列宁主义;革命的前途是社会主义而不是资本主义。(2分)"},{"id":27,"type":"short","title":"社会主义建设道路初步探索的意义有哪些?","hint":"社会·主义·建设·道路","options":[],"answer":"第一,巩同和发展了我国的社会主义制度。(2 ·展的","options":["政治","经济","文化","社会","生态"],"answer":"ABCDE"},{"id":73,"type":"multi","title":"科学发展观坚持全面发展和协发展，注重统筹( )，体现了唯物辩证法关于事物之间普遍联系、辩证统一的基本原理。","hint":"科学·发展·观坚·持全","options":["国内发展和对外开放","经济社会发展","人与自然和谐发展","区域发展","城乡发展"],"answer":"ABCDE"},{"id":74,"type":"multi","title":"（ ）构成社会主义核心价值体系的基本内容。","hint":"构成·社会·主义·核心","options":["马克思主义指导思想","中国特色社会主义共同理想","以爱国主义为核心的民族精神","以改革创新为核心的时代精神","社会主义荣辱观"],"answer":"ABCDE"},{"id":1,"type":"essay","title":"【论述题】分析中国共产党成立以来我国社会主要矛盾的变化（本题满分10分）","hint":"论述·题·分析·中国","options":[],"answer":"答案要点：新民主主义革命时期：帝国主义和中华民族矛盾，地主阶级和农民阶级的矛盾；社会主义革命时期：社会主义和资本主义的矛盾，无产阶级和资产阶级的矛盾（4分）；社会主义建设时期：党的八大提出“我们国内的主要矛盾，已经是人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾，已经是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾。（2分）”改革开放新时期：党的十一届六中全会对党的八大提出的我国社会的主要矛盾进行了完善，会议通过的《关于建国以来党的若干历史问题的决议》明确规定我国社会的主要矛盾为“人民日益增长的物质文化需要同落后的社会生产之间的矛盾。”（2分）中国特色社会主义新时代2017年党的十九大根据改革开放以来所取得的历史性成就的基础上，明确提出我国社会的主要矛盾已经转化为“人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。”（2分）"},{"id":2,"type":"essay","title":"【论述题】马克思主义中国化的理论成果及其主题（本题满分10分）","hint":"论述·题·马克·思主","options":[],"answer":"答案要点马克思主义中国化的两大理论成果是：毛泽东思想和中国特色社会主义理论体系。毛泽东思想是中国特色社会主义理论体系的重要思想渊源。（2分）中国特色社会主义理论体系包括邓小平理论、“三个代表”重要思想、科学发展观以及习近平新时代中国特色社会主义思想在内的科学理论体系。（2分）毛泽东思想的主题是进行什么样的革命，怎样进行革命；邓小平理论的主题是什么是社会主义，怎样建设社会主义；三个代表重要思想的主题是建设什么样的党，怎样建设党；科学发展观的主题是实现什么样的发展怎样发展；（3分）习近平新时代中国特色社会主义的思想的主题是：新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义，建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国，建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党。（3分）"},{"id":3,"type":"essay","title":"【论述题】谈谈党对社会主义建设道路的初步探索有哪些经验教训？（本题满分10分）","hint":"论述·题·谈谈·党对","options":[],"answer":"答案要点:各点要适当展开论述 第一，必须把马克思主义与中国实际相结合，探索符合中国特点的社会主义建设道路；（2分） 第二，必须正确认识社会主义社会的主要矛盾和根本任务，集中力量发展生产力；（2分） 第三，必须从实际出发进行社会主义建设，建设规模和速度要和国力相适应，不能急于求成；（2分） 第四，必须发展社会主义民主，健全社会主义法制；（2分） 第五，必须坚持党的民主集中制和集体领导制度，加强执政党建设；（1分） 第六，必须坚持对外开放，不能关起门来搞建设，要借鉴和吸收人类文明的共同成果建设社会主义。（1分）"},{"id":4,"type":"essay","title":"【论述题】毛泽东思想的主要内容及其活的灵魂","hint":"论述·题·毛泽·东思","options":[],"answer":"答案要点：(内容六点要适当展开；灵魂的三个方面要答定义及其三者之间的关系） （1）毛泽东思想的主要内容：新民主主义革命理论；社会主义革命和社会主义建设理论；革命军队建设和军事战略理论；政策和策略理论；思想政治工作和文化工作理论；党的建设理论。（6分） （2）毛泽东思想活的灵魂：实事求是；群众路线；独立自主。（4分）"},{"id":5,"type":"essay","title":"【论述题】论述毛泽东关于走中国工业化道路的思想（本题满分10分）","hint":"论述·题·论述·毛泽","options":[],"answer":"答案要点：各点要适当展开论述 （1）走工业化道路必须明确战略目标和战略步骤（2分） （2）走工业化道路必须采取正确的经济建设方针（2分） （3）走工业化道路必须发展科学技术和文化教育（2分） （4）走工业化道路必须重视知识分子工作（1分） （5）走工业化道路必须整和完善所有制结构（1分） （6）走工业化道路必须积极探索适合我国情况的经济体制和运行机制（1分） （7）走中国工业化道路的思想，是党探索我国社会主义建设道路的一个重要思想，对于加快我国社会主义建设事业具有重要的意义。（1分）"},{"id":6,"type":"essay","title":"【论述题】如何正确认识和看待我国社会主义改造这一重要历史事件？（本题满分10分）","hint":"论述·题·如何·正确","options":[],"answer":"答案要点 （1）社会主义改造取得了历史性的胜利，并且积累了坚持社会主义工业化建设与社会主义改造同时并举，采取积极引导、逐步过渡的方式，用和平的方法进行改造等丰富的历史经验。（2分）（2）但是，社会主义改造也出现了一些失误和偏差，比如改造要求过急，工作过粗，改变过快，形式也过于简单划一等问题。（2分）（3）但是，不能因为出现这些失误而否定社会主义改造的伟大意义。在我国社会主义改造的历史上，有两个事实是世界历史上各种革命大变动中罕见的：一是在一个几亿人口的大国比较顺利地实现了如此复杂、困难和深刻的社会变革，不仅没有造成生产力的破坏，反而促进工农业和整个国民经济的发展；二是这样的变革没有引起巨大的社会动，反而极大地加强了人民的团结，并且是在人民普遍拥护的情况下完成的。这充分说明我国三大改造的完成的确是一个伟大的胜利，是中国共产党紧紧依靠人民所作出的伟大创造。（6分）"},{"id":7,"type":"essay","title":"【论述题】作为当代青年大学生，请你结合教材和社会实际，谈谈如何实事求是地评价毛泽东？（本题满分10分）","hint":"论述·题·作为·当代","options":[],"answer":"答案要点 （1）习近平同志在纪念毛泽东诞辰120周年纪念座谈会上指出，对历史领袖人物的评价，应该放在其所处时代和社会的历史条件下去分析，做到六个“不能 ”：   第一，不能离开对历史条件、历史过程的全面认识和对历史规律的科学把握。第二，不能忽略历史必然性和历史偶然性的关系。第三、四，不能把历史顺境中的成功简单归功于个人，也不能把历史逆境中的挫折简单归咎于个人。第五，不能用今天的时代条件、发展水平、认识水平去衡量和要求前人。第六，不能苛求前人干出只有后人才能干出的业绩来。（6分） （2）历史和实践证明，毛泽东是伟大的马克思主义者，伟大的无产阶级革命家、战略家和理论家，是毛泽东思想的主要创立者。他为中国共产党和中国人民人民解放军的创立和发展，为中国各族人民解放事业的胜利，为中华人民共和国的缔造和社会主义事业的发展，建立了不可磨灭的功勋，为世界被压迫民族的解放和人类进步事业作出了重大贡献。毛泽东晚年犯了严重错误，包括错误地发动大跃进运动、人民公社化运动和文化大革命等。导致这些错误发生的原因主要有：一是在中国建设社会主义是一项崭新的事业，人民对如何建设社会主义还缺少规律性的认识；二是受当时严峻复杂的国际环境的影响。但是就他的一生来看，他的功绩远远大于他的过失。（4分）"}]},{"key":"xi","name":"大三上 · 习近平新时代中国特色社会主义思想概论","questions":[{"type":"single","title":"经过长期努力，中国特色社会主义进入新时代，这是我国发展新的（ ）","hint":"","options":["历史地位","历史时期","历史阶段","历史方位"],"answer":"D","id":1},{"type":"single","title":"（ ）是贯彻习近平新时代中国特色社会主义思想的一根红线。","hint":"","options":["人民立场","人民主体","人民至上","人民幸福"],"answer":"C","id":2},{"type":"single","title":"坚持和发展中国特色社会主义，总任务是（ ）。","hint":"","options":["完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化",
