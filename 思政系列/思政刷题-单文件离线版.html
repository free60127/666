le":"着力抓好军队党的政治建设，严肃政治纪律和政治规矩，确保部队（ ），确保枪杆子永远听党指挥。","hint":"","options":["绝对纯洁","绝对先进","绝对可靠","绝对忠诚"],"answer":"ACD","id":49},{"type":"multi","title":"《中共中央关于党的百年奋斗重大成就和历史经验的决议》中明确党在新时代的强军目标是建设一支（ ）的人民军队，把人民军队建设成为世界一流军队。","hint":"","options":["能打胜仗","听党指挥","作风优良","纪律严明"],"answer":"ABC","id":50},{"type":"multi","title":"在重塑人民军队组织形态方面，按照\"（ ）\"原则，强化军委集中统一领导和战略指挥、战略管理功能，打破长期实行的总部体制、大军区体制、大陆军体制，构建新的军队领导管理和作战指挥体制。","hint":"","options":["部队自建","战区主战","军种主建","军委管总"],"answer":"BCD","id":51},{"type":"multi","title":"党提出新时代人民军队使命任务，创新军事战略指导，整优化军事战略布局，强化人民军队（ ）的战略功能。","hint":"","options":["遏制战争","打赢战争","塑造态势","管控危机"],"answer":"ABCD","id":52},{"type":"multi","title":"全面加强练兵备战，提高人民军队打赢能力，要深入推进实战化军事训练，深化（ ）。","hint":"","options":["科技练兵","对抗训练","实战演练","联合训练"],"answer":"ABD","id":53},{"type":"multi","title":"两岸同胞血脉相连，是血浓于水的一家人。我们始终尊重、关爱、造福台湾同胞，继续致力于（）","hint":"","options":["促进两岸经济文化交流合作，","深化两岸各领域融合发展，","完善增进台湾同胞福祉的制度和政策，","推动两岸共同弘扬中华文化，促进两岸同胞心灵契合。"],"answer":"ABCD","id":54},{"type":"multi","title":"支持香港、澳门发展经济、改善民生、破解经济社会发展中的深层次矛盾和问题。发挥香港、澳门优势和特点，","hint":"","options":["巩固提升香港、澳门在国际金融、贸易、航运航空、创新科技、文化旅游等领域的地位","深化香港、澳门同各国各地区更加开放、更加密切的交往合作","推进粤港澳大湾区建设","支持香港、澳门更好融入国家发展大局，为实现中华民族伟大复兴更好发挥作用"],"answer":"ABCD","id":55},{"type":"multi","title":"在确保国家（ ）的前提下，和平统一后，台湾同胞的社会制度和生活方式等将得到充分尊重，台湾同胞的私人财产、宗教信仰、合法权益将得到充分保障。","hint":"","options":["发展利益","战略方针","主权","安全"],"answer":"ACD","id":56},{"type":"multi","title":"年来，中国共产党( )从最初50多名党员发展到今天拥有9600多万名党员的世界上最大的马克思主义执政党，历经千锤百炼而朝气蓬勃，正带领中国人民以不可阻挡的步伐迈向伟大复兴。","hint":"","options":["坚持性质宗旨","坚持理想信念","坚守初心使命","勇于自我革命"],"answer":"ABCD","id":57},{"type":"multi","title":"全面加强党的思想建设，坚持用习近平新时代中国特色社会主义思想( )，组织实施党的创新理论学习教育计划，建设马克思主义学习型政党。","hint":"","options":["统一思想","统一意志","统一行动","统一话语"],"answer":"ABC","id":58},{"type":"multi","title":"新时代党的组织路线,全面贯彻新时代中国特色社会主义思想，( )为坚持和加强党的全面领导、坚持和发展中国特色社会主义提供坚强组织保证。","hint":"","options":["以组织体系建设为重点","着力培养忠诚干净担当的高素质干部","着力集聚爱国奉献的各方面优秀人才","坚持德才兼备、以德为先、任人唯贤"],"answer":"ABCD","id":59},{"type":"multi","title":"突出工作重点，抓紧建立和完善主干性、支撑性党内法规制度，健全相关配套法规制度，统筹推进立改废释工作，形成( )的党内法规制度体系。以改革创新精神解决突出问题、补齐法规制度短板，提高党内法规制度质量。","hint":"","options":["内容科学","程序严密","配套完备","运行有效"],"answer":"ABCD","id":60},{"type":"short","title":"党的十九大报告指出，“经过了长期努力，中国特色社会主义进入了新时代”，进入新时代意味着什么？","hint":"","options":[],"answer":"意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃，迎来了实现中华民族伟大复兴的光明前景；意味着科学社会主义在二十一世纪的中国焕发出强大生机活力，在世界上高高举起了中国特色社会主义伟大旗帜；意味着中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了全新选择，为解决人类问题贡献了中国智慧和中国方案。","id":1},{"type":"short","title":"习近平新时代中国特色社会主义思想回答了什么重大时代课题？","hint":"","options":[],"answer":"新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党","id":2},{"type":"short","title":"如何奋力实现中国梦？","hint":"","options":[],"answer":"实现中国梦必须走中国道路，这就是中国特色社会主义道路；实现中国梦必须弘扬中国精神——以爱国主义为核心的民族精神和以改革创新为核心的时代精神；实现中国梦必须凝聚中国力量——中国各族人民大团结的力量。","id":3},{"type":"short","title":"中国梦是国家的梦、民族的梦，也是每一个中国人的梦。谈谈你对中国梦的本质的理解。","hint":"","options":[],"answer":"国家富强：在全面建成小康社会的基础上，建设富强民主文明和谐美丽的社会主义现代化强国；民族振兴：中华民族更加坚强有力地自立于世界民族之林，为人类作出新的更大的贡献；人民幸福：坚持以人民为中心，增进人民福祉，促进人的全面发展，实现全体人民共同富裕。","id":4},{"type":"short","title":"中国共产党领导是中国特色社会主义制度的最大优势，结合你的理解谈谈为什么会得出这样的结论？","hint":"","options":[],"answer":"中国共产党是中国特色社会主义制度的创建者。没有中国共产党，就没有中国特色社会主义制度的形成、发展和完善，制度优势就无从谈起。党的领导作为一项制度安排是中国特色社会主义制度的重要组成部分。作为党的根本组织制度和领导制度的民主集中制，最能体现中国特色社会主义制度的优越性。中国共产党的自身优势是中国特色社会主义制度优势的主要来源。中国共产党的自身优势引领和锻造了中国特色社会主义的制度优势，从根本上保证中国特色社会主义不变色、不变质。","id":5},{"type":"short","title":"为什么说中国共产党领导是中国特色社会主义制度的最大优势？","hint":"","options":[],"answer":"中国共产党是中国特色社会主义制度的创建者。没有中国共产党，就没有中国特色社会主义制度的形成、发展和完善，制度优势就无从谈起。党的领导作为一项制度安排是中国特色社会主义制度的重要组成部分。作为党的根本组织制度和领导制度的民主集中制，最能体现中国特色社会主义制度的优越性。中国共产党的自身优势是中国特色社会主义制度优势的主要来源。中国共产党的自身优势引领和锻造了中国特色社会主义的制度优势，从根本上保证中国特色社会主义不变色、不变质。","id":6},{"type":"short","title":"党的十九大报告指出，“经过了长期努力，中国特色社会主义进入了新时代”，请谈谈进入新时代的历史意义？","hint":"","options":[],"answer":"意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃，迎来了实现中华民族伟大复兴的光明前景；意味着科学社会主义在二十一世纪的中国焕发出强大生机活力，在世界上高高举起了中国特色社会主义伟大旗帜；意味着中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了全新选择，为解决人类问题贡献了中国智慧和中国方案。","id":7},{"type":"short","title":"中国共产党百年奋斗的“四个伟大成就”是什么？","hint":"","options":[],"answer":"党领导人民浴血奋战、百折不挠，创造了新民主主义革命的伟大成就；党领导人民自力更生、发愤图强，创造了社会主义革命和建设的伟大成就；党领导人民解放思想、锐意进取，创造了改革开放和社会主义现代化建设的伟大成就；党领导人民自信自强、守正创新，创造了新时代中国特色社会主义的伟大成就。","id":8},{"type":"short","title":"中国梦的本质是什么？","hint":"","options":[],"answer":"国家富强：在全面建成小康社会的基础上，建设富强民主文明和谐美丽的社会主义现代化强国；民族振兴：中华民族更加坚强有力地自立于世界民族之林，为人类作出新的更大的贡献；人民幸福：坚持以人民为中心，增进人民福祉，促进人的全面发展，实现全体人民共同富裕。","id":9},{"type":"short","title":"如何理解习近平新时代中国特色社会主义思想的历史地位？","hint":"","options":[],"answer":"当代中国马克思主义、二十一世纪马克思主义；中华文化和中国精神的时代精华；马克思主义中国化时代化新的飞跃。11、扎实推动共同富裕的重大举措？第一，提高发展的平衡性、协性、包容性。第二，着力扩大中等收入群体规模。第三，促进基本公共服务均等化。第四， 加强对高收入的规范和节。第五，促进人民精神生活共同富裕。第六，促进农民农村共同富裕。","id":10},{"type":"short","title":"如何理解江山就是人民、人民就是江山?","hint":"","options":[],"answer":"江山就是人民、人民就是江山。深刻揭示了人民与政权之间的辩证关系，闪耀着历史唯物主义的真理光芒，充分说明我国国体政体的人民性，人民是中国共产党执政兴国的最大底气，人民是我们党的生命之根、执政之基、力量之源。老百姓是地，老百姓是天，老百姓是共产党永远的挂念。对我们这样一个长期执政的政党而言，没有比忘记初心使命、脱离群众更大的危险。只要我们始终同人民生死相依、休戚与共，人民就会铁心跟党走，党就能长盛不衰。","id":11},{"type":"short","title":"我国现代化经济体系的内容是什么？","hint":"","options":[],"answer":"第一创新引领、协同发展的产业体系。第二统一开放、争有序的市场体系。第三体现效率、促进公平的收入分配体系。第四彰显优势、协联动的城乡区域发展体系。第五资源节约、环境友好的绿色发展体系。第六多元平衡、安全高效的全面开放体系。","id":12},{"type":"short","title":"供给侧结构性改革的必要性是什么?","hint":"","options":[],"answer":"第一.适应把握引领经济发展新常态的重大创新。第二.适应国际金融危机发生后综合国力争新形势的主动选择。第三.推动我国经济实现高质量发展的必然要求。","id":13},{"type":"short","title":"如何理解我国进入新发展阶段的基本依据？","hint":"","options":[],"answer":"理论依据：马克思主义是远大理想和现实目标相结合、历史必然性和发展阶段性相统一的统一论者，坚信人类社会必然走向共产主义，但实现这一崇高目标必然经历若干历史阶段。历史依据：新发展阶段是我们党带领人民迎来从站起来、富起来到强起来历史性跨越的新阶段。现实依据：我们已经拥有开启新征程、实现新的更高目标的雄厚物质基础。","id":14},{"type":"short","title":"改革的系统集成主要体现在哪些方面？","hint":"","options":[],"answer":"（1）加强顶层设计和总体规划，党中央集中统一领导，全国一盘棋。（2）注重系统性、整体性、协同性，善于打好改革的“组合拳”，做到前后呼应。（3）从“五位一体”总体布局和党的制度建设上整体推进，防止出现畸重畸轻、单兵突进、顾此失彼。","id":15},{"type":"short","title":"全面深化改革主要围绕哪些领域进行改革?","hint":"","options":[],"answer":"第一，紧紧围绕使市场在资源配置中起决定性作用深化经济体制改革。第二，紧紧围绕坚持党的领导、人民当家作主、依法治国有机统一深化政治体制改革。第三，紧紧围绕建设社会主义核心价值体系、社会主义文化强国深化文化体制改革。第四，紧紧围绕更好保障和改善民生、促进社会公平正义深化社会体制改革。第五，紧紧围绕建设美丽中国深化生态文明体制改革。第六，紧紧围绕提高科学执政、民主执政、依法执政水平深化党的建设制度改革。","id":16},{"type":"short","title":"新常态下我国经济发展的主要特点","hint":"","options":[],"answer":"增长速度由高速增长转变为中高速增长；发展方式由规模速度型转变为质量效率型；经济结构上以增量扩能为主转变为整存量做优增量并举；发展动力上由主要依靠资源和低成本劳动力等要素收入转变为创新驱动。","id":17},{"type":"short","title":"供给侧结构性改革的必要性","hint":"","options":[],"answer":"适应把握引领经济发展新常态的重大创新；适应国际金融危机发生后综合国力争新形势的主动选择；推动我国经济实现高质量发展的必然要求。","id":18},{"type":"short","title":"我国经济发展进入新常态的判断依据","hint":"","options":[],"answer":"从时间上看，新常态是我国不同发展阶段更替变化的结果。我国经济发展正处于增长速度换挡期，结构整阵痛期，前期刺激政策消化期，经济发展面临着速度换挡节点、结构整节点、动力转换节点。从空间上看，新常态是我国出口优势和参与国际产业分工模式变化的体现。维持出口高增长、出口占国内生产总值的高比例已不大可能，必须把经济增长动力更多放在创新驱动和扩大内需特别是消费需求上。","id":19},{"type":"short","title":"如何建设教育强国？","hint":"","options":[],"answer":"坚持党对教育事业的全面领导，坚持社会主义办学方向。（2分）（2）坚持把立德树人作为根本任务。（2分）（3）坚持扎根中国大地办教育。（2分）","id":20},{"type":"short","title":"习近平在中国共产党第十九次全国代表大会上的报告指出，建设教育强国是中华民族伟大复兴的基础工程，谈谈建设教育强国的具体措施。","hint":"","options":[],"answer":"坚持党对教育事业的全面领导，坚持社会主义办学方向。（2分）（2）坚持把立德树人作为根本任务。（2分）（3）坚持扎根中国大地办教育。（2分）","id":21},{"type":"short","title":"如何办好人民满意的教育？","hint":"","options":[],"answer":"（1）必须深化教育领域综合改革。（2分）（2）必须促进教育公平，必须建设高质量教育体系。（2分）（3）必须加强教师队伍建设。（2分）","id":22},{"type":"short","title":"全面贯彻党的教育方针，落实立德树人根本任务，应该如何做？","hint":"","options":[],"answer":"（1）必须深化教育领域综合改革。（2分）（2）必须促进教育公平，必须建设高质量教育体系。（2分）（3）必须加强教师队伍建设。（2分）","id":23},{"type":"short","title":"为什么全过程人民民主是全链条、全方位、全覆盖的民主？","hint":"","options":[],"answer":"（1）在领域上，具有完整的制度程序和完整的参与实践；在环节上，人民民主具体地、生动地体现在人民当家作主的全过程各环节（2分）（2）在形式上，人民通过选举、投票行使权利，人民内部各方面在重大决策之前进行充分协商（2分）（3）在实际效果上，全过程人民民主实现了过程民主和成果民主、程序民主和实质民主、直接民主和间接民主、人民民主和国家意志相统一。（2分）","id":24},{"type":"short","title":"我国全过程人民民主是全链条、全方位、全覆盖的民主，如何理解这句话？","hint":"","options":[],"answer":"（1）在领域上，具有完整的制度程序和完整的参与实践；在环节上，人民民主具体地、生动地体现在人民当家作主的全过程各环节（2分）（2）在形式上，人民通过选举、投票行使权利，人民内部各方面在重大决策之前进行充分协商（2分）（3）在实际效果上，全过程人民民主实现了过程民主和成果民主、程序民主和实质民主、直接民主和间接民主、人民民主和国家意志相统一。（2分）","id":25},{"type":"short","title":"全过程人民民主好在哪里？","hint":"","options":[],"answer":"（1）人民民主参与不断扩大。（2分）（2）国家治理高效，社会和谐稳定（2分）（3）权力运用得到有效制约和监督。（2分）","id":26},{"type":"short","title":"为什么全过程人民民主是最广泛、最真实、最管用的社会主义民主？","hint":"","options":[],"answer":"（1）人民民主参与不断扩大。（2分）（2）国家治理高效，社会和谐稳定（2分）（3）权力运用得到有效制约和监督。（2分）","id":27},{"type":"short","title":"中国特色社会主义法治道路的核心要义是什么？","hint":"","options":[],"answer":"（1）坚持党的领导。（2分）（2）坚持中国特色社会主义制度。（2分）（3）贯彻中国特色社会主义法治理论。（2分）","id":28},{"type":"short","title":"如何确保中国特色社会主义法治体系的本质属性和前进方向？","hint":"","options":[],"answer":"（1）坚持党的领导。（2分）（2）坚持中国特色社会主义制度。（2分）（3）贯彻中国特色社会主义法治理论。（2分）","id":29},{"type":"short","title":"什么是“脱贫攻坚精神”？","hint":"","options":[],"answer":"上下同心、尽锐出战（2分）、精准务实、开拓创新（2分）、攻坚克难、不负人民（2分）。","id":30},{"type":"short","title":"“脱贫攻坚精神”的内涵有哪些？","hint":"","options":[],"answer":"上下同心、尽锐出战（2分）、精准务实、开拓创新（2分）、攻坚克难、不负人民（2分）。","id":31},{"type":"short","title":"为什么要建设生态文明？","hint":"","options":[],"answer":"第一，是顺应人类文明进程，应对全球生态环境领域挑战的客观要求；（2分）第二，是破解我国经济社会发展短板问题的现实需要；（2分）第三，满足人民日益增长的优美生态环境需要。（2分）","id":32},{"type":"short","title":"建设生态文明的意义有哪些？","hint":"","options":[],"answer":"第一，是顺应人类文明进程，应对全球生态环境领域挑战的客观要求；（2分）第二，是破解我国经济社会发展短板问题的现实需要；（2分）第三，满足人民日益增长的优美生态环境需要。（2分）","id":33},{"type":"short","title":"为什么说坚持马克思主义在意识形态领域指导地位的根本制度是历史的结论、是现实的必然？","hint":"","options":[],"answer":"第一，是恪守党的本质属性、巩固党的团结统一的必然要求，是坚持正确发展道路、实现国家长治久安的必然要求。（2分）第二，是筑牢全体人民共同思想基础、凝聚团结奋进强大精神力量的必然要求。（2分）第三，是保证我国文化建设正确方向、更好担负起新时代使命任务的必然要求。（2分）","id":34},{"type":"short","title":"怎样推进社会治理现代化","hint":"","options":[],"answer":"第一，坚持系统治理、综合治理、依法治理、源头治理。（2分）第二，健全党组织领导的自治、法治、德治相结合的城乡基层治理体系。（2分）第三，加强社会治安综合治理。（2分）","id":35},{"type":"short","title":"什么是国家安全？","hint":"","options":[],"answer":"国家安全是指国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展（3分）和国家其他重大利益相对处于没有危险和不受内外威胁的状态，以及保障持续安全状态的能力。（3分）","id":36},{"type":"short","title":"国家安全的科学内涵是什么？","hint":"","options":[],"answer":"国家安全是指国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展（3分）和国家其他重大利益相对处于没有危险和不受内外威胁的状态，以及保障持续安全状态的能力。（3分）","id":37},{"type":"short","title":"为什么要建设中国特色社会主义文化？","hint":"","options":[],"answer":"文化是一个国家、一个民族的灵魂；（2分）没有文化繁荣兴盛就没有中华民族伟大复兴；（2分）更好满足人民日益增长的精神文化需要。（2分）","id":38},{"type":"short","title":"建设中国特色社会主义文化强国的战略意义是什么？","hint":"","options":[],"answer":"第一，文化是一个国家、一个民族的灵魂；（2分）第二，没有文化繁荣兴盛就没有中华民族伟大复兴；（2分）第三，更好满足人民日益增长的精神文化需要。（2分）","id":39},{"type":"short","title":"为什么要建设一支强大人民军队","hint":"","options":[],"answer":"（1）国际战略形势发生深刻变化（2分）（2）我国处于由大向强发展的关键阶段（2分）（3）国际军事争日趋激烈（1分）（4）我军需要一场革命性变革（1分）","id":40},{"type":"short","title":"怎样建设巩固国防和强大人民军队","hint":"","options":[],"answer":"（1）确立党在新时代的强军目标（2分）（2）贯彻政治建军方略（2分）（3）深化国防和军队改革（1分）（4）聚焦能打胜仗练兵备战（1分）","id":41},{"type":"short","title":"人民军队怎样捍卫国家主权、安全、发展利益","hint":"","options":[],"answer":"（1）人民军队实现整体性革命性重塑（2分）（2）新时代人民军队使命任务（2分）（3）坚定灵活开展军事斗争（1分）（4）积极遂行重大任务必须深化教育领域综合改革（1分）","id":42},{"type":"short","title":"如何坚持“一国两制”","hint":"","options":[],"answer":"“一国两制”是前无古人的开创性事业（2分）全面准确、坚定不移贯彻“一国两制”方针（2分）坚持和完善“一国两制”制度体系（2分）","id":43},{"type":"short","title":"怎样坚持和完善“一国两制”制度体系？","hint":"","options":[],"answer":"必须依法治港治澳，维护宪法和基本法确定的宪制秩序；（2分）坚守“一国”原则，尊重“两制”差异；（2分）完善特别行政区同宪法和基本法实施相关的制度和机制；健全中央依照宪法和基本法对特别行政区行使全面管治权制度。（2分）","id":44},{"type":"short","title":"“一国”和“两制”的关系是什么？","hint":"","options":[],"answer":"“一国”是实行“两制”的前提和基础，“两制”从属和派生于“一国”，并统一于“一国”之内。（2分）“一国”是根，根深才能叶茂； “一国”是本，本固才能枝荣。（2分）“一国两制”的提出首先是为了实现和维护国家统一。（2分）","id":45},{"type":"short","title":"一个中国原则指的是什么？","hint":"","options":[],"answer":"恪守“一个中国”原则，努力实现两岸和平统一（2分）；一个中国原则是两岸关系的政治基础（2分）；一个中国原则是推动两岸关系和平发展的最根本原则（2分）。","id":46},{"type":"short","title":"人类命运共同体的内涵是什么？","hint":"","options":[],"answer":"中国坚持对话协商，推动建设一个持久和平的世界；坚持共建共享，推动建设一个普遍安全的世界；（2分）坚持合作共赢，推动建设一个共同繁荣的世界；坚持交流互鉴，推动建设一个开放包容的世界；（2分）坚持绿色低碳，推动建设一个清洁美丽的世界。（2分）","id":47},{"type":"short","title":"请阐释人类命运共同体的内涵？","hint":"","options":[],"answer":"中国坚持对话协商，推动建设一个持久和平的世界；坚持共建共享，推动建设一个普遍安全的世界；（2分）坚持合作共赢，推动建设一个共同繁荣的世界；坚持交流互鉴，推动建设一个开放包容的世界；（2分）坚持绿色低碳，推动建设一个清洁美丽的世界。（2分）","id":48},{"type":"short","title":"“一国”和“两制”有什么关系？","hint":"","options":[],"answer":"“一国”是实行“两制”的前提和基础，“两制”从属和派生于“一国”，并统一于“一国”之内。（2分）“一国”是根，根深才能叶茂； “一国”是本，本固才能枝荣。（2分）“一国两制”的提出首先是为了实现和维护国家统一。（2分）","id":49},{"type":"essay","title":"论述题1：时代的发展有一个从量变到质变的过程，在量变中蕴含和孕育着质变，质变是量变的必然结果，同时又开启新的量变。历史车轮滚滚向前，时代潮流浩浩。一个国家、一个民族要振兴，就必须在历史前进的逻辑中前进、在时代发展的潮流中发展。中国特色社会主义进入新时代，是新中国成立以来特别是改革开放以来我国社会发展进步的必然结果，是我国社会主要矛盾变化的必然结果，也是我们党团结带领全国各族人民开创光明未来的必然要求。","hint":"","options":[],"answer":"请论述新时代是什么样的时代？中国特色社会主义新时代是承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代。中国特色社会主义新时代是决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代。中国特色社会主义新时代是全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代。中国特色社会主义新时代是全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代。中国特色社会主义新时代是我国不断为人类作出更大贡献的时代。","id":1},{"type":"essay","title":"论述题2：从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。在新中国成立特别是改革开放以来长期探索和实践基础上，经过十八大以来在理论和实践上的创新突破，我们党成功推进和拓展了中国式现代化。请论述中国式现代化的科学的内涵？","hint":"","options":[],"answer":"中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。人口规模巨大的现代化。 我国十四亿多人口整体迈进现代化社会，规模超过现有发达国家人口的总和，艰巨性和复杂性前所未有，发展途径和推进方式也必然具有自己的特点。 我们始终从国情出发想问题、作决策、办事情，既不好高骛远，也不因循守旧，保持历史耐心，坚持稳中求进、循序渐进、持续推进。全体人民共同富裕的现代化。共同富裕是中国特色社会主义的本质要求，也是一个长期的历史过程。我们坚持把实现人民对美好生活的向往作为现代化建设的出发点和落脚点，着力维护和促进社会公平正义，着力促进全体人民共同富裕，坚决防止两极分化。物质文明和精神文明相协的现代化。物质富足、精神富有是社会主义现代化的根本要求。不断厚植现代化的物质基础，不断夯实人民幸福生活的物质条件。大力发展社会主义先进文化，加强理想信念教育，传承中华文明。人与自然和谐共生的现代化。“绿水青山就是金山银山”理念融入我们的制度、政策和文化之中。我们坚持可持续发展，坚持节约优先、保护优先、自然恢复为主的方针，像保护眼睛一样保护自然和生态环境，坚定不移走生产发展、生活富裕、生态良好的文明发展道路，实现中华民族永续发展。走和平发展道路的现代化。不走一些国家通过战争、殖民、掠夺等方式实现现代化的老路。走依靠和平发展实现现代化的道路。我们坚定站在历史正确的一边、站在人类文明进步的一边，高举和平、发展、合作、共赢旗帜，在坚定维护世界和平与发展中谋求自身发展，又以自身发展更好维护世界和平与发展。","id":2},{"type":"essay","title":"论述题3：如何构建对外开放新格局？","hint":"","options":[],"answer":"（一）实行更加积极主动的开放战略。开放是当代中国的鲜明标识，党的十八大以来，我国采取了更加积极主动的开放战略，我国对外开放水平持续提升，我们要推动更加包容的全球发展。人类文明已经进入21世纪，冷战思维早已过时。我们应该携手努力，开辟合作共赢的新境界。（二）构建互利共赢、多元平衡、安全高效的开放型经济体系。扩内需和增外需相互动，“引进来”和“走出去”并举，促开放和护安全统筹，稳步扩大规则、规制、管理、标准等制度型开放。（三）推动共建“一带一路”高质量发展。经济发展、民生改善、文明进步。","id":3},{"type":"essay","title":"论述题4：如何把握新发展阶段、贯彻新发展理念、构建新发展格局？","hint":"","options":[],"answer":"（一）进入新发展阶段是中华民族伟大复兴历史进程的大跨越。正确认识党和人民事业所处的历史方位和发展阶段，是我们党明确阶段性中心任务、制定路线方针政策的根本依据，也是我们党领导革命、建设、改革不断取得胜利的重要经验。今天我们所处的新发展阶段，就是社会主义初级阶段中的一个阶段，同时是其中经过几十年积累、站到了新的起点上的一个阶段。全面建设社会主义现代化国家、基本实现社会主义现代化，既是社会主义初级阶段我国发展的要求，也是我国社会主义从初级阶段向更高阶段迈进的要求。（二）贯彻新发展理念是关系我国发展全局的一场深刻变革。党的十八大以来，我们党对经济社会发展提出了许多重大理论和理念，其中新发展理念是最重要、最主要的。新发展理念是一个系统的理论体系：回答了关于发展的目的、动力、方式、路径等一系列理论和实践问题。阐明了我们党关于发展的政治立场、价值导向、发展模式、发展道路等重大政治问题。（三）构建新发展格局是把握发展主动权的战略性布局。构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，是根据我国发展阶段、环境、条件变化，特别是基于我国比较优势变化，审时度势作出的重大决策，是新发展阶段要着力推动完成的重大历史任务，也是贯彻新发展理念的重大举措。","id":4},{"type":"essay","title":"论述题5：要加快科技自立自强步伐，解决外国“卡脖子”问题。健全新型举国体制，强化国家战略科技力量，优化配置创新资源，使我国在重要科技领域成为全球领跑者，在前沿交叉领域成为开拓者，力争尽早成为世界主要科学中心和创新高地。","hint":"","options":[],"answer":"请论述怎样加快建设科技强国？（1）发挥新型举国体制优势。（2分）健全新型举国体制，强化国家战略科技力量，优化配置创新资源，使我国在重要科技领域成为全球领跑者，在前沿交叉领域成为开拓者，力争尽早成为世界主要科学中心和创新高地。（2分）发挥新型举国体制优势，要坚持党对科技事业的集中统一领导。发挥新型举国体制优势，要全面推进科技体制改革。（2分）（2）打赢关键核心技术攻坚战。（2分）只有把关键核心技术掌握在自己手中，才能从根本上保障国家经济安全、国防安全和其他安全。（2分）只有把关键核心技术掌握在自己手中，才能真正掌握争和发展的主动权。打赢关键核心技术攻坚战，首要任务是加快实现“卡脖子”关键核心技术突破。（2分）（3）增强自主创新能力。（2分）增强自主创新能力，要着力推进基础研究。增强自主创新能力，要着力推动应用研究。（2分）增强自主创新能力，要着力推动前沿研究。中国特色社会主义新时代是决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代。（2分）","id":5},{"type":"essay","title":"论述题6：建设中国特色社会主义法治体系，要顺应事业发展需要，坚持系统观念，全面加以推进。党的十九届四中全会对“坚持和完善中国特色社会主义法治体系，提高党依法治国、依法执政能力”作出了专门部署，提出了明确要求和一系列重要举措。","hint":"","options":[],"answer":"请论述如何坚持和完善中国特色社会主义法治体系？健全保证宪法全面实施的体制机制。（2分）坚持和完善中国特色社会主义法治体系，首先要健全保证宪法全面实施的体制机制。（2分）完善立法体制机制。（2分）建设中国特色社会主义法治体系，必须不断加强和改进立法工作，发挥立法的引领和推动作用。（2分）（3）健全社会公平正义法治保障制度。（2分）坚持法治建设为了人民、依靠人民，加强人权法治保障，保证人民依法享有广泛的权利和自由、承担应尽的义务。（2分）（4）加强对法律实施的监督。（2分）保证行政权、监察权、审判权、检察权得到依法正确行使。拓展公益诉讼案件范围。（2分）加大全民普法工作力度，增强全民法治观念。各级党和国家机关以及领导干部要带头尊法学法守法用法。（2分）","id":6},{"type":"essay","title":"论述题7：党的二十大报告指出：“意识形态工作是为国家立心、为民族立魂的工作。”能否做好意识形态工作，事关党的前途命运，事关国家长治久安，事关民族凝聚力和向心力。那么，我们如何才能牢牢掌握意识形态工作的领导权？","hint":"","options":[],"answer":"用习近平新时代中国特色社会主义思想武装全党。（2分）按照学懂、弄通、做实的要求，深入推进习近平新时代中国特色社会主义思想学习教育；（2分）巩固和发展主流意识形态。（2分）旗帜鲜明坚持党管宣传、党管意识形态、党管媒体，坚持和加强党对意识形态工作的全面领导；（1分）提升党、国家和民族的凝聚力向心力。（2分）增强意识形态领域主导权和话语权，坚定广大干部群众的道路自信、理论自信、制度自信、文化自信；（2分）加强意识形态人才队伍建设。（2分）以政治家的标准严格要求、以专门家的标准提升素质、以实干家的标准推进工作，建设一支高素质的人才队伍；（2分）推动传播手段建设和创新。（2分）抓好理念创新、手段创新、方式方法创新，坚持正确舆论导向，创新对外话语表达方式。（1分）","id":7},{"type":"essay","title":"论述题8：如何提升国家文化软实力和中华文化影响力？","hint":"","options":[],"answer":"第一，推动中华优秀传统文化创造性转化、创新性发展。（3分）加强研究阐释工作，讲清楚中华优秀传统文化的历史渊源、发展脉络、基本走向，讲清楚中华文化的独特创造、价值理念、鲜明特色，增强文化自信和价值观自信。加强文物保护利用和文化遗产保护传承。在保护中发展，在发展中保护。全面融入国民教育、文化创造、生产生活。（3分）第二，用中国特色社会主义文化培根铸魂。（3分）必须坚定文化自信，牢牢把握社会主义先进文化前进方向，围绕举旗帜、聚民心、育新人、兴文化、展形象的使命任务，坚持为人民服务、为社会主义服务，更好构筑中国精神、中国价值、中国力量。（3分）第三，推进文化事业和文化产业全面发展，讲好中国故事，传播好中国声音。（3分）要弘扬社会主义先进文化，深化文化体制改革，推动社会主义文化大发展大繁荣，增强全民族文化创造活力，推动文化事业全面繁荣、文化产业快速发展，加快构建中国话语和中国叙事体系，提高讲好中国故事的能力。（3分）论述题9：怎样建设美丽中国？","id":8},{"type":"essay","title":"论述题10：为什么要全面从严治党？","hint":"","options":[],"answer":"从严治党是马克思主义政党的政治优势（2分）我们党是用革命理想和铁的纪律组织起来的马克思主义政党，组织严密、纪律严明是党的优良传统和政治优势，也是我们的力量所在。 （2分）从严治党是马克思主义政党建设的一贯要求；马克思曾提出，“每一支部应对接受的会员的品质纯洁负责”。从严治党是中国共产党建设的优良传统， 百年来，中国共产党始终把从严治党视为重中之重，党始终坚持从严治党，保持了党的先进性和纯洁性。（2分）全面从严治党是实现民族复兴的根本保证（2分）全面建设社会主义现代化国家、全面推进中华民族伟大复兴，关键在党。（2分）把全面从严治党纳入“四个全面”战略布局，党的十八大以来，以习近平同志为核心的党中央将全面从严治党纳入“四个全面”战略布局，把严的标准、严的措施贯穿管党治党全过程和各方面，为实现中华民族伟大复兴提供坚强政治引领和政治保障。（2分）全面从严治党是决定党兴衰成败的关键因素（2分）新形势下党面临“四大考验”“四种危险”，有没有强烈的自我革命精神，有没有自我净化的过硬特质，能不能坚持不懈同自身存在的问题和错误作斗争，就成定党兴衰成败的关键因素。（2分）党内出现管党不力、治党不严的问题“七个有之”本质上是政治问题，概括起来是两个方面。一个是政治问题和经济问题交织形成利益集团，妄图攫取党和国家权力；一个是山头主义和宗派主义作祟，大搞非组织活动，破坏党的集中统一。（2分）","id":9},{"type":"material","title":"材料分析题1：百年不遇的新冠疫情席卷全球，世界经济陷入二战以来最严重的衰退，人民生命安全和身体健康遭受极大威胁。我国发展的外部环境也急剧变化，不确定难预料因素显著增多，尤其是以美国为首的西方国家对我实施了全方位的遏制、围堵、打压，给我国发展带来前所未有的严峻挑战。重大历史关头，重大考验面前，党中央展现出非凡的判断力、决策力、行动力，带领亿万人民从容应对各种复杂局面和风险挑战，交出了一份人民满意、世界瞩目、可以载入史册的优异答卷，充分发挥了党的领导这一中国特色社会主义制度的最大优势。衡量一个国家的制度是否成功、是否优越，一个重要方面是看其在重大风险挑战面前，能不能有效应对。2020年以来，面对前所未有的困难挑战，党政军民学、东西南北中，连成一条心、拧成一股绳，在党中央统一指挥、统一协、统一度下，坚持全国一盘棋，凝聚起了攻坚克难的磅礴伟力。我国如期打赢脱贫攻坚战、全面建成小康社会，实现“十四五”良好开局，经济保持4.5%左右的年均增长，明显高于世界平均水平，在世界主要经济体中保持领先。这份来之不易的答卷雄辩地证明，坚持党的全面领导是坚持和发展中国特色社会主义的必由之路。结合上述材料内容，请分析为什么要坚持中国共产党的领导？","hint":"","options":[],"answer":"党的领导是党和国家事业不断发展的“定海神针”。我国之所以能保持长期稳定，根本的一条就是我们始终坚持共产党领导。中国共产党是最高政治领导力量。中国共产党领导是中国特色社会主义最本质的特征，是中国特色社会主义制度的最大优势。中国共产党领导是由科学社会主义的理论逻辑决定的。坚持无产阶级政党的领导是无产阶级革命和社会主义建设取得胜利的根本保证。中国特色社会主义是科学社会主义基本原则同当代中国实际和时代特征相结合的产物，是植根于当代中国的科学社会主义。坚持党的全面领导是坚持和发展中国特色社会主义的必由之路。只有坚持中国共产党的领导，才能保证中国特色社会主义的性质和正确方向。中国共产党领导是由中国特色社会主义产生与发展的历史逻辑决定的。中国共产党是中国特色社会主义事业的开创者、推动者、引领者，团结带领人民开辟了中国特色社会主义道路，创立了中国特色社会主义理论，创建了中国特色社会主义制度，发展了中国特色社会主义文化。历史和现实证明，没有中国共产党的领导，就没有中国特色社会主义的产生和发展。中国共产党领导是由中国特色社会主义迈向新征程的实践逻辑决定的。 在实现中华民族伟大复兴征程中，面临着来自国际国内多种多样前所未有的挑战，不知还要爬多少坡、过多少坎，经历多少风风雨雨、克服多少艰难险阻。坚定走中国道路，把14亿多人民凝聚成中国力量，焕发出中国精神，把新时代中国特色社会主义这篇大文章继续写好、写精彩，从根本上要靠党的全面领导，靠党把好方向盘。","id":1},{"type":"material","title":"材料分析题2:公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，社会主义市场经济体制等社会主义基本经济制度，既体现了社会主义制度优越性，又同我国社会主义初级阶段社会生产力发展水平相适应，是党和人民的伟大创造。——《中共中央关于坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化若干重大问题的决定》（2019年10月31日）我们坚持和完善社会主义基本经济制度，并把“两个毫不动摇”写入新时代坚持和发展中国特色社会主义的基本方略，作为党和国家一项大政方针进一步确定下来。——习近平在中共第十九届中央政治局第三十八次集体学习时的讲话（2022年4月29日）在中国共产党领导和我国社会主义制度下，国有企业和国有经济必须不断发展壮大，这个问题应该是毋庸置疑的。然而，一段时间以来，社会上一些人制造了不少针对国有企业的奇谈怪论，大谈“国有企业垄断论”，宣扬“国有企业与民争利”、“国企是不堪的存在”，鼓吹“私有化”、“去国有化”、“去主导化”，操弄所谓“国进民退”、“民进国退”的话题。特别是各种敌对势力和一些别有用心的人重点拿国有企业说事，恶意攻击、抹黑国有企业，宣扬“国企不破、中国不立”，声称“肢解”是国有企业改革的最佳方式。醉翁之意不在酒！这些人很清楚国有企业对我们党执政、对我国社会主义制度的重要性，想搞乱人心、釜底抽薪。——习近平在全国国有企业党的建设工作会议上的讲话（2016年10月10日）结合上述材料内容，请分析如何坚持和完善社会主义基本经济制度？","hint":"","options":[],"answer":"（一）社会主义基本经济制度是我国经济发展的制度基础。我国基本经济制度是中国特色社会主义制度的重要支柱，既体现了社会主义制度的优越性，又同我国社会主义初级阶段社会生产力发展水平相适应，既有利于激发各类市场主体活力、解放和发展社会生产力，又有利于促进效率和公平有机统一、推动全体人民共同富裕。（二）坚持公有制为主体、多种所有制经济共同发展。毫不动摇巩固和发展公有制经济；毫不动摇鼓励、支持、引导非公有制经济发展。（三）坚持按劳分配为主体、多种分配方式并存。分配制度是促进共同富裕的基础性制度。坚持按劳分配为主体、多种分配方式并存，构建初次分配、再分配、第三次分配协配套的制度体系。（四）加快完善社会主义市场经济体制。完善社会主义市场经济体制的核心问题是处理好政府和市场关系；发挥社会主义市场经济体制优势的内在要求；正确认识和把握资本的特性和行为规律。","id":2},{"type":"material","title":"材料分析题3:贯彻新发展理念是新时代我国发展壮大的必由之路。——习近平在中国共产党第二十次全国代表大会上的报告（2022年10月16日）中国国家统计局发布的数据显示，2022年中国国内生产总值（GDP）达121.02万亿元人民币，稳居世界第二。随着我国社会主要矛盾变化和国际力量对比深刻整，我国发展面临的内外部风险空前上升，必须增强忧患意识、坚持底线思维，随时准备应对更加复杂困难的局面。自2008年国际金融危机以来，我国经济已经向以国内大循环为主体转变，国内需求对经济增长的贡献率有多个年份超过100%。 我国经济发展阶段也在发生历史性变化，不平衡不充分的发展就是发展质量不高的表现，发展中的矛盾和问题主要就集中在发展质量上。解决我国社会的主要矛盾，必须把发展质量摆在更为突出的位置，着力提升发展质量和效益，推动高质量发展。我们既要重视量的发展，更要重视解决质的问题，在质的大幅度提升中实现量的有效增长。结合上述材料内容，请分析如何把握新发展阶段、贯彻新发展理念、构建新发展格局？","hint":"","options":[],"answer":"（一）进入新发展阶段是中华民族伟大复兴历史进程的大跨越。正确认识党和人民事业所处的历史方位和发展阶段，是我们党明确阶段性中心任务、制定路线方针政策的根本依据，也是我们党领导革命、建设、改革不断取得胜利的重要经验。今天我们所处的新发展阶段，就是社会主义初级阶段中的一个阶段，同时是其中经过几十年积累、站到了新的起点上的一个阶段。全面建设社会主义现代化国家、基本实现社会主义现代化，既是社会主义初级阶段我国发展的要求，也是我国社会主义从初级阶段向更高阶段迈进的要求。（二）贯彻新发展理念是关系我国发展全局的一场深刻变革。党的十八大以来，我们党对经济社会发展提出了许多重大理论和理念，其中新发展理念是最重要、最主要的。新发展理念是一个系统的理论体系：回答了关于发展的目的、动力、方式、路径等一系列理论和实践问题。阐明了我们党关于发展的政治立场、价值导向、发展模式、发展道路等重大政治问题。（三）构建新发展格局是把握发展主动权的战略性布局。构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，是根据我国发展阶段、环境、条件变化，特别是基于我国比较优势变化，审时度势作出的重大决策，是新发展阶段要着力推动完成的重大历史任务，也是贯彻新发展理念的重大举措。","id":3},{"type":"material","title":"材料分析题4：上海浦东统筹利用政务服务、生活配套等各类资源，支持海内外人才创新创业；重庆开展减轻青年科研人员负担专项行动，让人才一心扑在研发一线；陕西西安打造青年人才驿站，为青年人才及引才企业提供暖心政策服务，营造拴心留人的好环境……一段时间以来，各地积极贯彻落实人才强国战略，进一步打开引贤纳才之门、培厚人才发展土壤，不断激发各类人才的创新活力和创造潜力。功以才成，业由才广。全国两会上，习近平总书记在参加江苏代表团审议时指出，“为创新人才脱颖而出、尽展才华创造良好环境”。尊重人才方能广聚人才，崇尚人才自会人才辈出。党的十八大以来，以习近平同志为核心的党中央深刻回答为什么建设人才强国、什么是人才强国、怎样建设人才强国的重大理论和实践问题，作出全方位培养、引进、使用人才的重大部署，推动新时代人才工作取得历史性成就、发生历史性变革。请结合上述材料和所学内容，分析怎样深入实施新时代人才强国战略。","hint":"","options":[],"answer":"（1）人才是国家和民族长远发展大计。（2分）人才是创新的根基是创新的核心要素；国家发展靠人才，民族振兴靠人才。（2分）（2）坚持党管人才。（2分）坚持党管人才原则，必须坚持党对人才工作的全面领导，这是做好人才工作的根本保证；（2分）坚持党管人才原则，必须深化人才发展体制机制改革，这是做好人才工作的重要保障；（2分）坚持党管人才原则，必须全方位培养用好人才，这是做好人才工作的重点任务；坚持党管人才原则，必须聚天下英才而用之，这是做好人才工作的基本要求。（2分）（3）加快建设世界人才中心和创新高地。（2分）加快建设世界重要人才中心和创新高地，必须把握战略主动，做好顶层设计和战略谋划；（2分）加快建设世界人才中心和创新高地，必须走好人才自主培养之路；（2分）加快建设世界人才中心和创新高地，必须抓好国家战略人才力量；加快建设世界重要人才中心和创新高地，需要进行战略布局。（2分）","id":4},{"type":"material","title":"材料分析题5：习近平总书记在党的二十大报告中指出：“发展全过程人民民主，保障人民当家作主”“全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。必须坚定不移走中国特色社会主义政治发展道路，坚持党的领导、人民当家作主、依法治国有机统一”。学报告、谈认识、话落实，党的二十大代表们认为，要更加准确把握全过程人民民主的丰富内涵、重大意义和实践要求，扎实推进全过程人民民主，察民情、听民意、解民忧，不断实现发展为了人民、发展依靠人民、发展成果由人民共享，让现代化建设成果更多更公平惠及全体人民，为实现第二个百年奋斗目标和中华民族伟大复兴的中国梦筑牢民主基石、汇聚磅礴力量。请结合上述材料和所学内容，分析如何进一步发展全过程人民民主。","hint":"","options":[],"answer":"坚持走中国特色社会主义政治发展道路。（2分）绝不照搬西方政治制度模式。中国特色社会主义制度和国家治理体系是能够持续推动拥有14亿多人口大国进步和发展、确保拥有5000多年文明史的中华民族实现“两个一百年”奋斗目标进而实现伟大复兴的制度和治理体系。（2分）加强人民当家作主制度保障。（2分）坚持和完善我国根本政治制度、基本政治制度、重要政治制度，拓展民主渠道，丰富民主形式，确保人民依法通过各种途径和形式管理国家事务，管理经济和文化事业，管理社会事务。（2分）全面发展协商民主。（2分）协商民主是实践全过程人民民主的重要形式。社会主义协商民主是实现党的领导的重要方式，是党领导人民有效治理国家、保证人民当家作主的重要制度设计，是我国社会主义民主政治的特有形式和独特优势。（2分）积极发展基层民主。（2分）基层民主是全过程人民民主的重要体现。广大人民群众最直接的政治参与主要在基层，最直观的当家作主感受也主要在基层。发展基层民主是发展全过程人民民主的题中之义。（2分）巩固和发展最广泛的爱国统一战线。（2分）实现中华民族伟大复兴的梦想，需要海内外中华儿女共同奋斗。（2分）","id":5},{"type":"material","title":"材料分析题6：在庆祝中国共产党成立100周年大会上，习近平总书记总结中国特色社会主义的伟大成就，强“走自己的路，是党的全部理论和实践立足点，更是党百年奋斗得出的历史结论”。《中共中央关于党的百年奋斗重大成就和历史经验的决议》指出，“坚持中国道路”是党百年来领导人民进行伟大奋斗积累的宝贵历史经验。从新民主主义革命时期，我们党领导人民制定《中华苏维埃共和国宪法大纲》等法律法令，为新中国社会主义法制建设和改革开放新时期中国特色社会主义法治建设积累宝贵历史经验；到社会主义革命和建设时期，我们党领导人民建立起社会主义法制框架体系，初步奠定社会主义法治的基础；到改革开放和社会主义现代化建设新时期，我们党领导人民形成并不断完善中国特色社会主义法律体系，开辟中国特色社会主义法治道路；再到中国特色社会主义新时代，以习近平同志为核心的党中央提出全面依法治国、建设法治中国，推动我国社会主义法治建设发生历史性变革、取得历史性成就、创造历史性经验，中国特色社会主义法治道路在新民主主义法制建设和社会主义法治建设的伟大实践中形成和完善，实现了社会主义和法治的有机结合，走出了一条中国式法治现代化新道路，为人类法治文明进步提供了中国方案和中国智慧。请结合上述材料和所学内容，分析我们为什么要走中国特色社会主义法治道路。","hint":"","options":[],"answer":"（1）全面依法治国必须走对路。（2分）中国特色社会主义法治道路，有着深厚的中华优秀传统法律文化底蕴；（2分）中国特色社会主义法治道路，是中国人民长期探索出来的，符合中国国情的法治道路。（2分）（2）中国特色社会主义法治道路的核心要义。（2分）坚持党的领导，把党的领导贯彻到依法治国全过程和各方面；（2分）坚持中国特色社会主义制度，中国特色社会主义制度是全面依法治国的制度基石；（2分）贯彻中国特色社会主义法治理论，习近平法治思想是马克思主义法治理论中国化时代化最新成果。（2分）（3）走中国特色社会主义法治道路必须坚持的基本原则。（2分）坚持党的领导是中国特色社会主义法治之魂；坚持人民主体地位；（2分）坚持法律面前人人平等；坚持依法治国和以德治国相结合；坚持从中国实际出发。（2分）","id":6},{"type":"material","title":"材料分析题7：党的二十大报告将人与自然和谐共生的现代化列为中国式现代化的5个方面的中国特色之一，就“推动绿色发展，促进人与自然和谐共生”作出了战略部署，这是以习近平同志为核心的党中央深刻洞察人类文明发展大势、站在新的历史起点上作出的重大历史判断和战略布局。我们要站在促进人与自然和谐共生的高度，扎实推进绿色发展和生态文明建设，谋划经济社会发展，为全面建设社会主义现代化国家奠定坚实基础。生态兴则文明兴，生态衰则文明衰。人与自然是生命共同体，无止境地向自然索取甚至破坏自然必然会遭到大自然的报复。我国作为14亿多人口的发展中大国，环境容量有限、生态系统脆弱，生态环境状况尚未得到根本扭转，要整体迈入现代化社会，高消耗、高污染的模式是行不通的，资源环境的压力不可承受。必须坚持节约优先、保护优先、自然恢复为主的方针，像保护眼睛一样保护自然和生态环境，坚持可持续发展，坚定不移走生产发展、生活富裕、生态良好的文明发展道路。这是对西方以资本为中心、物质主义膨胀、先污染后治理的现代化发展道路的超越。（1）请叙述习近平生态文明思想的主要内容。（12分）（2）结合材料，请你为推动建设人与自然和谐共生的现代化，提出切实可行的建议。（8分）","hint":"","options":[],"answer":"（1）习近平生态文明思想内涵丰富、逻辑严密，主要包括六个方面的重要内容。第一，坚持人与自然和谐共生。（2分）第二，绿水青山就是金山银山。（2分）第三，良好生态环境是最普惠的民生福祉。（2分）第四，统筹山水林田湖草沙系统治理。（2分）第五，用最严格制度最严密法治保护生态环境。（2分）第六，共谋全球生态文明建设。（2分）（2）加快构建生态文明体系；（2分）全面推动绿色发展；（2分）深入推进生态文明体制改革；（2分）有效防范生态环境风险。（2分）本题第（2）问为开放式命题，学生答案言之成理即可酌情给分，每条建议2分，满分8分。","id":7},{"type":"material","title":"材料分析题8:樊锦诗曾是北大的天之骄子，却在1963年毕业后奔赴了这座位于西北荒漠中的小镇，与她的老师段文杰一样，开始了与敦煌几十年的“厮守”时光。当时在自然环境破坏、洞窟本体老化与游客蜂拥而至的三重威胁下，莫高窟一度岌岌可危。樊锦诗为了让这些存留千年的脆弱艺术瑰宝“活”得更久，大胆构思了“数字敦煌”。“数字敦煌”是一项敦煌保护的虚拟工程，利用现代数字技术拍摄、扫描、获取、存储敦煌石窟文物信息。樊锦诗和她的团队利用数字技术，为每一个洞窟、每一幅壁画、每一尊彩塑建立数字档案，让莫高窟“容颜永驻”。樊锦诗把自己的青春和生命融入到莫高窟保护、研究事业中，只要一说起敦煌，已是高龄的她，仍似孩子般手舞足蹈，眼里透着光亮。党的二十大报告就“推进文化自信自强，铸就社会主义文化新辉煌”做了部署，要求“增强中华文明传播力影响力。坚守中华文化立场，提炼展示中华文明的精神标识和文化精髓，加快构建中国话语和中国叙事体系，讲好中国故事、传播好中国声音，展现可信、可爱、可敬的中国形象。加强国际传播能力建设，全面提升国际传播效能，形成同我国综合国力和国际地位相匹配的国际话语权。深化文明交流互鉴，推动中华文化更好走向世界。”（1）请结合实际谈一谈，如何实现传统文化与现代文化相融合。（12分）（2）结合材料，谈一谈如何讲好中国故事，传播好中国声音。（8分）","hint":"","options":[],"answer":"（1）实现传统文化与现代文化相融合，需要做好三方面工作：第一，加强研究阐释工作，讲清楚中华优秀传统文化的历史渊源、发展脉络、基本走向，（2分）讲清楚中华文化的独特创造、价值理念、鲜明特色，增强文化自信和价值观自信。（2分）第二，加强文物保护利用和文化遗产保护传承。（2分）在保护中发展，在发展中保护。全面融入国民教育、文化创造、生产生活。（2分）第三，坚持守正创新。（2分）推动中华优秀传统文化同社会主义社会相适应，展示中华民族的独特精神标识，更好构筑中国精神、中国价值、中国力量。（2分）（2）讲好中国故事，传播好中国声音第一，讲好中国的故事、中国共产党的故事。（2分）第二，讲好中国特色社会主义的故事、中国人民的故事。（2分）第三，展示文明大国、东方大国、负责任大国、社会主义大国形象。（2分）第四，让当代中国形象在世界上不断树立和闪亮起来。（2分）本题为开放式命题，学生答案言之成理即可酌情给分，每条建议2分，本小题满分8分。","id":8},{"type":"material","title":"材料分析题9:习近平总书记指出“民生是最大的政治”。在日常工作中，习近平总书记经常和人民群众在一起，关系人民群众的生活。2016年，在湖南代表团审议现场，总书记为十八洞村的男青年“娶媳妇儿”操心，特地询问：“去年有多少人娶媳妇儿？”2017年，在四川代表团，总书记特别讲到了悬崖村，他说，曾在电视上看到有关凉山州“悬崖村”的报道，特别是看着村民们的出行状态，感到很揪心。了解到当地建了新的铁梯，心里稍稍松了一些。关乎百姓的出行与安全，总书记始终牵挂在心。这些年，青海农牧民生活持续改善，土炕也变成电热炕了。“村民们的电热炕是什么样的？”2021年，参加青海代表团审议时，总书记同海东市互助县的代表拉起了家常。“刺绣产业怎么助力脱贫”“酩馏酒怎么做成产业的”……关乎百姓衣食冷暖的事情，总书记细致询问。（1）结合实际，谈谈你对“民生是最大的政治”的理解。（12分）（2）结合实际，谈谈为增强人民获得感、幸福感、安全感，党做了哪些工作。（8分）","hint":"","options":[],"answer":"（1）说“民生是最大的政治”，是因为：第一，民生事关人民幸福生活，民生是广大人民群众最关心最直接最现实的利益问题，民生工作离老百姓最近，同老百姓生活最密切；（3分）第二，民生事关党的事业成败和国家命运兴衰，江山就是人民，人民就是江山，中国共产党领导人民打江山、守江山，守的是人民的心；（3分）第三，民生事关社会和谐稳定，民生连着民心，民心凝聚人心，民生稳，人心就稳，社会就稳；（3分）第四，抓民生也是抓发展，做好经济社会发展工作，民生是“指南针”。（3分）（2）增强人民获得感、幸福感、安全感，党做了大量工作，包括：第一，在发展中保障和改善民生。（2分）第一，抓住人民最关心最直接最现实的利益问题。（2分）第二，坚决打赢脱贫攻坚战。（2分）第三，抗疫斗争最大限度保护人民生命安全和身体健康。（2分）本题第（2）问为开放式命题，学生答案言之成理即可酌情给分，每条建议2分，满","id":9},{"type":"material","title":"材料分析题10:黄炎培提出：“我生六十多年，耳闻的不说，所亲眼看到的，真所谓“其兴也浡焉，其亡也忽焉，……一部历史，“政怠宦成，的也有，“人亡政息，的也有，“求荣取辱的也有，总之没有能跳出这周期率。”毛泽东答道：“我们已经找到新路，我们能跳出这周期率。这条新路，就是民主。只有让人民来监督政府，政府才不敢松懈。只有人人起来负责，才不会人亡政息。”党的十八大以来，习近平总书记围绕推进全面从严治党作出的一系列重要论述，彰显了全面从严的鲜明品格，强化了全面过硬的庄严承诺，提出了全面建设的时代课题，明确了全面领导的根本落点，把新时代党的建设提升到新的理论高度、思想高度和实践高度，也为推动新时代正风反腐向纵深发展提供了根本指导和遵循。习近平总书记指出：“我们党历史这么长、规模这么大、执政这么久，如何跳出治乱兴衰的历史周期率？毛泽东同志在延安的窑洞里给出了第一个答案，这就是只有让人民来监督政府，政府才不敢松懈。经过百年奋斗特别是党的十八大以来新的实践，我们党又给出了第二个答案，这就是自我革命。这一重要思想，深刻揭示了正风反腐工作的深厚政治意蕴和深远政治考量。这就要求我们根据新时代的发展要求，深入把握政治建设规律，有针对性地采取措施，解决不守政治纪律、不讲政治规矩、政治生活不严肃、管党治党不严等突出问题，推动全面从严治党向纵深发展。请结合上述材料和所学内容，阐述如何理解全面从严治党这场伟大自我革命","hint":"","options":[],"answer":"（一）勇于自我革命是跳出历史周期率的第二个答案（2分）全面从严治党是一场自我革命，必须探索出一条党长期执政条件下实现自我净化的有效路径，这关乎党和国家事业成败，关乎我们能不能跳出历史周期率。（2分）勇于自我革命是我们党最鲜明的品格和最大的优势。中国共产党人用一次又一次的自我革命，以高度的政治自觉、思想自觉和行动自觉不断进行革命性锻造，使我们党一路勘误纠错，永葆先进。（2分）勇于自我革命是我们党区别于其他政党的显著标志。中国共产党作为马克思主义政党，党的性质决定了我们党除了国家、民族、人民的利益，没有任何自己的特殊利益。不谋私利才能谋根本、谋大利，才有资格、有底气敢于直面问题、勇于自我革命。（2分）（二）全面从严治党以其丰富内涵诠释了自我革命的内在要求（2分）全面从严治党，核心是加强党的领导，基础在全面，关键在严，要害在治。 （2分）全面从严治党，要求增强系统性、预见性、创造性、实效性，使从严治党的一切努力都集中到增强党自我净化、自我完善、自我革新、自我提高能力上来，集中到提高党的领导能力和执政能力、保持和发展党的先进性和纯洁性上来。不断以勇于自我革命的精神打造和锤炼自己，实现管党治党真正从宽松软走向严紧硬。（2分）（三）全面从严治党推进自我革命不断走向深入（2分）实施中央八项规定改进作风，构建行之有效的权力监督制度和执纪执法体系；反腐败无禁区、全覆盖、零容忍，一体推进不敢腐、不能腐、不想腐；（2分）开展党的群众路线教育实践活动，建立不忘初心、牢记使命的制度；严格规范党内政治生活，着力营造风清气正的政治生态。（2分）","id":10}],"shortName":"大三上·习思","subtitle":"课程复习题库"}];

  <script>(() => {
  const escapeHtml = value => String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const withLineBreaks = value => escapeHtml(value).replace(/\n/g, '<br>');
  const mobileBrowser = () => navigator.userAgentData?.mobile || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
  const fileName = title => `${String(title || '题库').replace(/[\\/:*?"<>|]/g, '-').slice(0, 80)}-A4打印版.pdf`;
  const isAppleMobile = () => /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
  const isWeChat = () => /MicroMessenger/i.test(navigator.userAgent || '');
  let activeMobilePdfUrl = '';

  function wrapText(value, maxWidth = null) {
    const output = [];
    String(value || '').replace(/\r/g, '').split('\n').forEach(paragraph => {
      if (!paragraph) { output.push(''); return; }
      const asciiRatio = [...paragraph].filter(character => /[\u0000-\u00ff]/.test(character)).length / Math.max(1, [...paragraph].length);
      const limit = maxWidth == null ? (asciiRatio > .6 ? 56 : 47) : maxWidth;
      const tokens = paragraph.match(/\s+|[A-Za-z0-9]+(?:['’\-][A-Za-z0-9]+)*|[\u4e00-\u9fff]|[^\s]/g) || [];
      let line = '';
      let width = 0;
      let previousWord = false;
      let pendingSpace = false;
      tokens.forEach(token => {
        if (/^\s+$/.test(token)) { pendingSpace = true; return; }
        const word = /^[A-Za-z0-9]+(?:['’\-][A-Za-z0-9]+)*$/.test(token);
        const punctuation = /^[,.!?;:，。！？；：、…%‰）》】』」』\]\)}]/.test(token);
        let separator = !punctuation && (pendingSpace || (word && previousWord)) ? ' ' : '';
        const tokenWidth = textWidth(token) + textWidth(separator);
        if (line && !punctuation && width + tokenWidth > limit) {
          output.push(line.trimEnd());
          line = '';
          width = 0;
          previousWord = false;
          pendingSpace = false;
          separator = '';
        }
        line += separator + token;
        width += tokenWidth;
        previousWord = word;
        pendingSpace = false;
      });
      if (line) output.push(line.trimEnd());
    });
    return output;
  }

  function textWidth(value) { return [...String(value || '')].reduce((width, character) => width + (/[^\u0000-\u00ff]/.test(character) ? 1 : .55), 0); }
  function optionRows(options) { const entries = (options || []).map((option, index) => `${String.fromCharCode(65 + index)}. ${option}`); if (!entries.length) return []; if (entries.length <= 4 && entries.reduce((width, entry) => width + textWidth(entry), 0) + (entries.length - 1) * 2 <= 47) return [{entries, columns: entries.length}]; const rows = []; for (let index = 0; index < entries.length; index += 2) { const left = wrapText(entries[index], 21); const right = entries[index + 1] ? wrapText(entries[index + 1], 21) : []; const count = Math.max(left.length, right.length); for (let line = 0; line < count; line++) rows.push({entries: [left[line] || '', right[line] || ''], columns: 2}); } return rows; }

  function prepareQuestions(source) {
    const prepared = [];
    (source || []).forEach(item => {
      const question = String(item.question || '').trim();
      const match = question.match(/^(.*?)[（(]\s*空格\s*([ivxlcdm\d]+)\s*[）)]\s*$/i);
      const base = match ? match[1].trim() : question;
      const label = match ? `空格 ${match[2]}` : '';
      const previous = prepared[prepared.length - 1];
      if (label && previous && previous.type === item.type && previous.question === base && previous.optionGroups) {
        previous.optionGroups.push({label, options: item.options || []});
        previous.answer = `${previous.answer}；${label.replace('空格 ', '')}：${cleanAnswer(item.answer)}`;
        return;
      }
      prepared.push({
        ...item,
        question: base,
        answer: label ? `${label.replace('空格 ', '')}：${cleanAnswer(item.answer)}` : cleanAnswer(item.answer),
        optionGroups: label ? [{label, options: item.options || []}] : null,
      });
    });
    return prepared;
  }

  function buildPages({title, subtitle, questions, mode = 'standard'}) {
    questions = prepareQuestions(questions);
    const pages = [];
    let page;
    let section = '';
    let continuation = false;

    function startPage() {
      page = {title, subtitle, section: continuation ? `${section}（续）` : section, lines: [], y: 730};
      pages.push(page);
      continuation = true;
    }

    function addLine(text, size = 10.5, gap = 15) {
      if (!page) startPage();
      if (page.y - gap < 54) startPage();
      if (text) page.lines.push({text, size, y: page.y});
      page.y -= gap;
    }

    function addText(text, size = 10.5, gap = 15, maxWidth = null) {
      wrapText(text, maxWidth).forEach(line => addLine(line, size, gap));
    }

    function addOptions(options) {
      optionRows(options).forEach(row => {
        const size = row.columns === 4 ? 9.5 : 10.5;
        const gap = row.columns === 4 ? 15 : 16;
        if (!page) startPage();
        if (page.y - gap < 54) startPage();
        page.lines.push({kind: 'options', entries: row.entries, columns: row.columns, size, y: page.y});
        page.y -= gap;
      });
    }

    function addOptionGroupLabel(label) {
      if (!page) startPage();
      if (page.y - 20 < 54) startPage();
      page.lines.push({kind: 'option-label', text: label, size: 9, y: page.y});
      page.y -= 14;
    }

    function addModuleHeading(type) {
      const heading = String(type || '').trim();
      if (!heading) return;
      if (!page) startPage();
      if (page.y - 30 < 54) startPage();
      page.lines.push({kind: 'module', text: heading, size: 10, y: page.y});
      page.y -= 18;
    }

    function addBank(text) {
      const bankLines = wrapText(text, 47);
      if (!page) startPage();
      // 保留 bank 与其后首题同页：预留提示行 + 约一题的空间，避免提示孤悬页尾（Codex review P2）
      if (page.y - (bankLines.length * 13 + 44) < 54) startPage();
      bankLines.forEach(line => {
        page.lines.push({kind: 'bank', text: line, size: 9.5, y: page.y});
        page.y -= 13;
      });
      addLine('', 10.5, 8);
    }

    section = mode === 'memorize' ? '题目与答案' : '题目';
    continuation = false;
    startPage();
    let previousType = '';
    let lastBank = '';
    questions.forEach((item, index) => {
      const currentType = String(item.type || '').trim();
      if (currentType && currentType !== previousType) addModuleHeading(currentType);
      previousType = currentType;
      const bank = String(item.bank || '').trim();
      if (bank && bank !== lastBank) { addBank(bank); lastBank = bank; }
      addText(`${index + 1}. ${item.question || ''}`, 10.5, 16);
      if (item.optionGroups) item.optionGroups.forEach(group => { addOptionGroupLabel(group.label); addOptions(group.options); });
      else addOptions(item.options);
      if (mode === 'memorize') {
        addLine('', 10.5, 5);
        addText(`答案：${cleanAnswer(item.answer)}`, 10.5, 16);
      }
      addLine('', 10.5, 10);
    });

    if (mode !== 'memorize') {
      section = '参考答案';
      continuation = false;
      startPage();
      previousType = '';
      questions.forEach((item, index) => {
        const currentType = String(item.type || '').trim();
        if (currentType && currentType !== previousType) addModuleHeading(currentType);
        previousType = currentType;
        addText(`${index + 1}. ${cleanAnswer(item.answer)}`, 10.5, 16);
        addLine('', 10.5, 10);
      });
    }
    return pages;
  }

  function cleanAnswer(value) {
    const answer = String(value || '').trim().replace(/^(?:(?:查看)?参考答案\s*[:：]?\s*)+/i, '');
    if (/教师用书对应页未提供本题答案|暂不作推测/.test(answer)) return '原书未提供答案';
    return answer || '原书未提供答案';
  }

  function unicodeHex(value) {
    let hex = '';
    for (const character of String(value || '')) {
      const code = character.codePointAt(0);
      hex += (code > 0xffff ? 0x3f : code).toString(16).padStart(4, '0');
    }
    return hex || '0020';
  }

  function textCommand(text, x, y, size) {
    return `BT\n/F1 ${size} Tf\n1 0 0 1 ${x} ${y} Tm\n<${unicodeHex(text)}> Tj\nET\n`;
  }

  function pdfBytes(options) {
    const pages = buildPages(options);
    const objects = [];
    const pageIds = pages.map((_, index) => 5 + index * 2);
    objects[1] = '<< /Type /Catalog /Pages 2 0 R >>';
    objects[2] = `<< /Type /Pages /Kids [${pageIds.map(id => `${id} 0 R`).join(' ')}] /Count ${pages.length} >>`;
    objects[3] = '<< /Type /Font /Subtype /Type0 /BaseFont /STSong-Light /Encoding /UniGB-UCS2-H /DescendantFonts [4 0 R] >>';
    objects[4] = '<< /Type /Font /Subtype /CIDFontType0 /BaseFont /STSong-Light /CIDSystemInfo << /Registry (Adobe) /Ordering (GB1) /Supplement 4 >> /DW 1000 >>';

    pages.forEach((page, index) => {
      const pageId = pageIds[index];
      const contentId = pageId + 1;
      const header = [
        textCommand('外院 · 知识分享站', 42, 807, 8.5),
        textCommand(page.title, 42, 786, 16),
        page.subtitle ? textCommand(page.subtitle, 42, 770, 8.5) : '',
        textCommand(page.section, 42, 748, 14),
      ].join('');
      const body = page.lines.map(line => textCommand(line.text, 42, line.y, line.size)).join('');
      const footer = textCommand(`A4 打印版 · 第 ${index + 1} / ${pages.length} 页`, 42, 34, 8);
      const stream = `${header}${body}${footer}`;
      objects[pageId] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${contentId} 0 R >>`;
      objects[contentId] = `<< /Length ${stream.length} >>\nstream\n${stream}endstream`;
    });

    let pdf = '%PDF-1.4\n% A4 question bank\n';
    const offsets = [0];
    const maxId = objects.length - 1;
    for (let id = 1; id <= maxId; id++) {
      offsets[id] = pdf.length;
      pdf += `${id} 0 obj\n${objects[id]}\nendobj\n`;
    }
    const xrefOffset = pdf.length;
    pdf += `xref\n0 ${maxId + 1}\n0000000000 65535 f \n`;
    for (let id = 1; id <= maxId; id++) pdf += `${String(offsets[id]).padStart(10, '0')} 00000 n \n`;

  function copyCurrentAddress(button) {
    const address = location.href.split('#')[0];
    const done = () => {
      button.textContent = '网址已复制，请到浏览器粘贴打开';
      button.style.background = '#28634f';
    };
    if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(address).then(done).catch(() => fallbackCopy(address, done));
    fallbackCopy(address, done);
  }

  function fallbackCopy(value, done) {
    const input = document.createElement('textarea');
    input.value = value;
    input.setAttribute('readonly', '');
    input.style.cssText = 'position:fixed;left:-9999px;top:0;';
    document.body.appendChild(input);
    input.select();
    try { document.execCommand('copy'); done(); }
    catch (_) { alert(`请复制网址后到手机浏览器打开：\n${value}`); }
    input.remove();
  }

  async function downloadMobilePdf(options) {
    try {
      const blob = new Blob([portablePdfBytes(options)], {type: 'application/pdf'});
      const name = fileName(options.title);
      const nd = window.WaiyuanNativeDownload;
      if (nd && nd.isNative && nd.isNative()) {
        // Capacitor App：WebView 无法下载 blob，走原生保存桥（保存到手机「下载」目录）
        const ok = await nd.saveBlob(name, blob).catch(() => false);
        if (ok) {
          showNativeSavedTip('PDF 已保存到手机「下载」目录', name);
          return;
        }
        // 原生保存失败时回退旧逻辑（桌面浏览器等）
      }
      const url = URL.createObjectURL(blob);
      removeMobileDownloadPanel();
      activeMobilePdfUrl = url;
      showMobileDownloadPanel(url, name);
      if (!isAppleMobile()) triggerDownload(url, name);
      setTimeout(() => { if (activeMobilePdfUrl === url) removeMobileDownloadPanel(); }, 10 * 60 * 1000);
    } catch (error) {
      alert('PDF 生成失败，请稍后重试。');
      console.error(error);
    }
  }

  function open(options = {}) {
    const normalized = {...options, subtitle: options.subtitle || '', questions: options.questions || []};
    if (!normalized.questions.length) {
      alert('当前没有可导出的题目。');

    }
    // Use one portable A4 renderer on every device so the downloaded file is
    // identical in layout whether it was created on a phone or a computer.
    chooseMode(normalized);
  }

  window.A4QuestionPrint = {open, buildPages};
})();
</script>
  <script>(() => {
  const banks = window.POLITICS_BANKS || [];
  const labels = {all: '全部', single: '单选题', multi: '多选题', theory: '基本理论观点', short: '简答题', essay: '论述题', material: '材料分析题'};
  // Bump whenever the source data is corrected so saved mock papers rebuild.
  const PAPER_VERSION = 3;
  const storeKey = 'politics-h5-state-v1';
  const paymentQr = window.PAYMENT_QR_DATA_URL || '../payment-qr.jpg';
  const welcomeCat = window.WELCOME_CAT_DATA_URL || '../welcome-cat.jpg';
  const app = document.getElementById('app');
  // Handles both /栏目/index.html and a directory-style /栏目 URL on GitHub Pages.
  // The latter otherwise makes ../index.html jump outside a project Pages site.
  const goToHub = () => {
    const parts = location.pathname.replace(/\/+$/, '').split('/');
    if (parts[parts.length - 1]?.toLowerCase() === 'index.html') parts.pop();
    parts.pop();
    parts.push('index.html');
    location.href = `${location.protocol}//${location.host}${parts.join('/')}`;
  };
  let saved = (() => { try { return JSON.parse(localStorage.getItem(storeKey) || '{}'); } catch (_) { return {}; } })();
  let screen = 'home';
  let bankKey = '';
  let paper = null;
  let mistakes = false;
  let filter = 'all';
  let displayLimit = 30;
  let accessDialog = '';

  let persistWarned = false;
  const showPersistWarning = () => {
    if (persistWarned) return;
    persistWarned = true;
    const bar = document.createElement('div');
    bar.setAttribute('role', 'alert');
    bar.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:70;max-width:min(92vw,560px);padding:10px 14px;border-radius:10px;background:#fff8e6;border:1px solid #e4b84a;color:#6b4d00;box-shadow:0 6px 20px rgba(0,0,0,.12);font-size:14px;line-height:1.5';
    bar.textContent = '⚠ 本地保存失败（浏览器存储不可用或空间不足），答题进度可能无法保存。';
    const close = document.createElement('button');
    close.type = 'button';
    close.textContent = '知道了';
    close.style.cssText = 'border:0;background:#e4b84a;color:#fff;border-radius:999px;padding:4px 12px;margin-left:10px;cursor:pointer';
    close.addEventListener('click', () => bar.remove());
    bar.appendChild(close);
    document.body.appendChild(bar);
    setTimeout(() => bar.remove(), 10000);
  };
  const persist = () => { try { localStorage.setItem(storeKey, JSON.stringify(saved)); } catch (error) { console.warn('思政刷题: 保存失败', error); showPersistWarning(); } };
  const getBank = key => banks.find(bank => bank.key === key);
  const bankQuestions = () => paper ? paper.questions : (getBank(bankKey)?.questions || []);
  const questionKey = question => paper ? `paper-${paper.key}-${question.id}` : `${bankKey}-${question.type}-${question.id}`;
  const questionToken = question => paper ? `${paper.key}--${question.id}` : `${question.type}--${question.id}`;
  const stateFor = question => saved.progress?.[questionKey(question)] || {};
  const ensure = () => { if (!saved.progress) saved.progress = {}; if (!saved.papers) saved.papers = {}; };
  // First-time visitors have no localStorage state yet.  Initialize it before
  // any option/answer interaction so the very first tap can be persisted.
  ensure();
  persist();
  const escape = text => String(text || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  // Remove source-document answer blanks such as "（ ）" only when they
  // appear at the very end of an option; normal brackets in the text remain.
  const optionText = text => String(text || '').replace(/\s*[（(]\s*[）)]\s*$/, '');
  const answerMarker = /([（(]\s*[一二三四五六七八九十\d]+\s*[）)]|[一二三四五六七八九十]+、|[①②③④⑤⑥⑦⑧⑨⑩])/g;
  const answerLine = text => escape(text).replace(/([（(]\s*\d+\s*分\s*[）)])/g, '<span class="score">$1</span>');
  // Only numbered outline markers with explicit punctuation are candidates.
  // This deliberately excludes prose such as “第一次”“第一位”.
  // Deliberately accept only formal enumerators, never words such as
  // “第一次”“第一粒扣子”“第一阶段”.
  const wordAnswerMarker = /(第[一二三四五六七八九十]+(?:、|，|,|：|:)|[一二三四五六七八九十]+是(?:、|，|,|：|:))/g;
  const repeatedLead = '(?:意味着|表明|说明|体现|要求|有利于|必须|需要|坚持|促进|推动|反映|标志着|关键是|核心是|根本是)';
  const allAnswerMarkers = new RegExp(`${answerMarker.source}|${wordAnswerMarker.source}`, 'g');
  const answerStartMarker = new RegExp(`^(?:${answerMarker.source}|${wordAnswerMarker.source})`);
  // Short labels such as “内容：”“意义：”“教训：” are answer section
  // headings, even where the source document omitted a number before them.
  const sectionHeadingNames = '根本原因|主要原因|直接原因|原因|内容|意义|教训|启示|结论|特点|表现|作用|要求|原则|措施|途径|本质|实质|内涵|关系|影响|任务|目标|重点|关键|基础|保证';
  const sectionHeadingAtStart = new RegExp(`^(${sectionHeadingNames})：$`);
  const sectionHeadingAfterScore = new RegExp(`([（(]\\s*\\d+\\s*分\\s*[）)])\\s*(${sectionHeadingNames})：`, 'g');
  const repeatedStartMarker = new RegExp(`^(${repeatedLead})`);
  const repeatedAfterSemicolon = new RegExp(`([；;])\\s*(?=${repeatedLead})`, 'g');
  const scorePrefix = /^[（(]\s*\d+\s*分\s*[）)]\s*/;
  const parallelLead = /^(是|要|应|必须|坚持|通过|以|把|从|在|由|对于|实现|促进|推动|反映|体现|表明|说明|意味着|有利于|需要|要求)/;
  function findParallelSemicolonLead(source) {
    const leads = source.split(/[；;]/).map(part => part.trim().replace(scorePrefix, '')).map(part => part.match(parallelLead)?.[1]).filter(Boolean);
    return [...new Set(leads)].find(lead => leads.filter(item => item === lead).length >= 2) || '';
  }
  // Detect repeated sentence-openers such as “马克思主义是…” or
  // “法治思维以…”.  A prefix must occur at least twice after a sentence
  // boundary, preventing ordinary long prose from being split.
  function findRepeatedPhraseLead(source) {
    const clauses = source.split(/[。；;]/).map(part => part.trim().replace(scorePrefix, '')).filter(Boolean);
    const candidates = clauses.map(part => {
      const matched = part.match(/^([\u4e00-\u9fff]{2,10}(?:是|以|要|应当|必须|需要|具有|坚持|通过|反映|体现|表明|意味着))/);
      return matched?.[1] || '';
    }).filter(Boolean);
    return [...new Set(candidates)].find(lead => candidates.filter(item => item === lead).length >= 2) || '';
  }
  const regexEscape = text => text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const hasParallelWordOutline = source => {
    const first = /第[一二三四五六七八九十]+(?:、|，|,|：|:)/.test(source) && /第[二三四五六七八九十]+(?:、|，|,|：|:)/.test(source);
    const second = /[一二三四五六七八九十]是(?:、|，|,|：|:)/.test(source) && /[二三四五六七八九十]是(?:、|，|,|：|:)/.test(source);
    return first || second;
  };
  function formatAnswer(answer) {
    const source = String(answer || '').replace(/\r/g, '').trim();
    if (!source) return '<p class="answer-lead">原文未提供标准答案，请结合教材复习。</p>';
    const hasRepeatedLead = (source.match(new RegExp(repeatedLead, 'g')) || []).length > 1;
    const markerPattern = hasParallelWordOutline(source) ? allAnswerMarkers : answerMarker;
    const startPattern = hasParallelWordOutline(source) ? answerStartMarker : new RegExp(`^(?:${answerMarker.source})`);
    const semicolonLead = findParallelSemicolonLead(source);
    const phraseLead = findRepeatedPhraseLead(source);
    const semicolonSeparator = semicolonLead ? new RegExp(`([；;])\\s*(([（(]\\s*\\d+\\s*分\\s*[）)])\\s*)?(?=${semicolonLead})`, 'g') : /$^/;
    const phraseSeparator = phraseLead ? new RegExp(`([。；;])\\s*(([（(]\\s*\\d+\\s*分\\s*[）)])\\s*)?(?=${phraseLead})`, 'g') : /$^/;
    const phraseStart = phraseLead ? new RegExp(regexEscape(phraseLead), 'g') : /$^/;
    const prepared = source.replace(markerPattern, match => `\n${match}`).replace(hasRepeatedLead ? repeatedAfterSemicolon : /$^/, '$1\n').replace(sectionHeadingAfterScore, '$1\n@@SECTION@@$2：\n').replace(semicolonSeparator, '$2\n').replace(phraseSeparator, '$2\n').replace(phraseStart, match => `\n${match}`);
    return prepared.split('\n').map(part => part.trim()).filter(Boolean).map(part => {
      const section = part.replace('@@SECTION@@', '');
      if (sectionHeadingAtStart.test(section)) return `<p class="answer-section">${escape(section)}</p>`;
      const matched = part.match(startPattern);
      const repeated = !matched && hasRepeatedLead ? part.match(repeatedStartMarker) : null;
      const parallel = !matched && !repeated && semicolonLead && part.replace(scorePrefix, '').startsWith(semicolonLead);
      const phrase = !matched && !repeated && !parallel && phraseLead && part.replace(scorePrefix, '').startsWith(phraseLead);
      if (!matched && !repeated && !parallel && !phrase) return `<p class="answer-lead">${answerLine(part)}</p>`;
      if (parallel) {
        const prefix = part.match(scorePrefix)?.[0] || '';
        const text = part.slice(prefix.length);
        const content = (prefix + text.slice(semicolonLead.length).trim()).replace(/[；;](?=\s*(?:[（(]\s*\d+\s*分|$))/, '');
        return `<div class="answer-item level-one parallel-item"><span class="answer-marker">${escape(semicolonLead)}</span><span class="answer-content">${answerLine(content)}</span></div>`;
      }
      if (phrase) {
        const prefix = part.match(scorePrefix)?.[0] || '';
        const text = part.slice(prefix.length);
        const content = (prefix + text.slice(phraseLead.length).trim()).replace(/[。；;](?=\s*(?:[（(]\s*\d+\s*分|$))/, '');
        return `<div class="answer-item level-one parallel-item"><span class="answer-marker">${escape(phraseLead)}</span><span class="answer-content">${answerLine(content)}</span></div>`;
      }
      const marker = (matched || repeated)[0]; const body = part.slice(marker.length).trim();
      const level = matched && /^[①②③④⑤⑥⑦⑧⑨⑩]/.test(marker) ? 'level-two' : 'level-one';
      return `<div class="answer-item ${level}"><span class="answer-marker">${escape(marker)}</span><span class="answer-content">${answerLine(body)}</span></div>`;
    }).join('');
  }
  const shuffle = list => { const copy = [...list]; for (let i = copy.length - 1; i; i--) { const j = Math.floor(Math.random() * (i + 1)); [copy[i], copy[j]] = [copy[j], copy[i]]; } return copy; };
  function accessOverlay() {
    if (accessDialog !== 'pay') return '';
    return `<div class="modal-mask" role="dialog" aria-modal="true"><section class="access-modal pay-modal"><button class="modal-x" data-action="modal-close" aria-label="关闭">×</button><p class="access-kicker">SUPPORT</p><h2>感谢你的赞助</h2><p>本题库永久免费使用。若它对你有帮助，欢迎微信扫码自愿赞助。</p><img class="payment-qr" src="${escape(paymentQr)}" alt="微信收款码"><p class="payment-note">赞助完全自愿，不影响题库、模拟卷和错题本的全部使用。</p></section></div>`;
  }

  function summary(bank) {
    const counts = bank.questions.reduce((out, question) => (out[question.type] = (out[question.type] || 0) + 1, out), {});
    // 只统计普通题库进度：模拟卷使用独立 key（paper-…），不得混入
    const progress = Object.entries(saved.progress || {}).filter(([key]) => key.startsWith(`${bank.key}-`) && !key.startsWith('paper-'));
    const correct = progress.filter(([, item]) => item.ok).length;
    return {...counts, total: bank.questions.length, done: progress.length, mistakes: progress.filter(([, item]) => item.wrong).length, accuracy: progress.length ? `${Math.round(correct / progress.length * 100)}%` : '—'};
  }

  // 题库内容指纹：任一题题干/答案变化都会改变指纹，
  // 使旧模拟卷自动重建（随机抽题结果不变时仍可保留进度）。
  const bankFingerprint = bank => { let value = 2166136261; for (const question of bank.questions) { const t = String(question.title || '') + String(question.answer || ''); for (const char of t) value = Math.imul(value ^ char.charCodeAt(0), 16777619); } return (value >>> 0).toString(36); };

  function paperPlan(bank) {
    const defaults = bank.key === 'marx' ? {short: 5, essay: 2} : bank.key === 'xi' ? {single: 20, multi: 20, short: 5, essay: 2, material: 2} : {single: 20, multi: 20, short: 5, essay: 2};
    return Object.fromEntries(Object.entries(defaults).map(([type, count]) => [type, Math.min(count, bank.questions.filter(question => question.type === type).length)]).filter(([, count]) => count));
  }

  function createPaper(bank, number) {
    let id = 0;
    const plan = paperPlan(bank);
    return {key: `${bank.key}-${number}`, bankKey: bank.key, number, version: PAPER_VERSION, fingerprint: bankFingerprint(bank), questions: Object.entries(plan).flatMap(([type, count]) => shuffle(bank.questions.filter(question => question.type === type)).slice(0, count).map(question => ({...question, id: ++id, sourceId: question.id, sourceType: type})))};
  }

  function loadPaper(key, number) {
    ensure();
    const bank = getBank(key);
    const old = saved.papers[`${key}-${number}`];
    paper = old && old.version === PAPER_VERSION && old.fingerprint === bankFingerprint(bank) ? old : createPaper(bank, number);

    persist(); bankKey = key; screen = 'questions'; mistakes = false; filter = 'all'; displayLimit = 30; render();
  }

  // 模拟卷自身统计（与普通题库进度分离）
  function paperSummary() {
    if (!paper) return null;
    const entries = Object.entries(saved.progress || {}).filter(([key]) => key.startsWith(`paper-${paper.key}-`));
    const attempted = entries.filter(([, item]) => item.answered || item.ok || item.wrong);
    const correct = entries.filter(([, item]) => item.ok).length;
    return {total: paper.questions.length, done: attempted.length, accuracy: attempted.length ? `${Math.round(correct / attempted.length * 100)}%` : '—', mistakes: entries.filter(([, item]) => item.wrong).length};
  }

  function card(question) {
    const state = stateFor(question);
    const choices = question.options || [];
    const answer = question.answer || '';
    const token = questionToken(question);
    const options = choices.map((option, index) => {
      const feedback = state.feedback?.[index] || '';
      const selected = state.selected?.includes(index) ? 'selected' : '';
      return `<button class="option ${feedback} ${selected}" data-action="choose" data-id="${token}" data-index="${index}"><span class="${question.type === 'multi' ? 'check' : 'radio'} ${selected}"></span><span>${String.fromCharCode(65 + index)}．${escape(optionText(option))}</span></button>`;
    }).join('');
    return `<article class="card" id="q-${token}"${paper ? ' data-unified-scope="paper"' : ''}>
      <div class="qrow"><span class="qindex">${question.id}</span><div><h2>${escape(question.title)}</h2><span class="tag">${labels[question.type] || question.type}</span>${question.hint ? `<span class="hint">记忆 · ${escape(question.hint)}</span>` : ''}</div></div>
      ${choices.length ? `<div class="options">${options}${question.type === 'multi' && answer ? `<button class="confirm" data-action="confirm" data-id="${token}">确认答案</button>` : ''}</div>` : ''}
      <button class="answer-toggle" data-action="answer" data-id="${token}">${state.showAnswer ? '收起答案' : '点击展开答案'}</button>
      ${state.showAnswer ? `<div class="answer">${escape(answer || '原文未提供标准答案，请结合教材复习。')}</div>` : ''}
    </article>`;
  }

  function renderHome() {
    app.innerHTML = `<button class="back hub-back" data-action="hub">‹ 返回知识分享站</button><header class="brand"><div class="mark">M</div><div><strong>思政 · 刷题站</strong><small>THEORY REVIEW / 2026</small></div></header>
      <section class="hero"><small>POLITICAL THEORY QUESTION BANKS</small><h1>选择你的<span>课程题库。</span></h1><p>五门课程统一练习，进度分别保存在本机。</p></section>
      <section class="bank-list">${banks.map(bank => { const s = summary(bank); return `<button class="bank-card" data-action="bank" data-bank="${bank.key}"><div><b>${escape(bank.shortName)}</b><em>进入</em></div><h2>${escape(bank.name)}</h2><p>${escape(bank.subtitle)}</p><small>${s.total} 题　已完成 ${s.done}　正确率 ${s.accuracy}</small><footer>${['single','multi','theory','short','essay','material'].filter(type => s[type]).map(type => `<i>${labels[type]} ${s[type]}</i>`).join('')}</footer></button>`; }).join('')}</section>
      <button class="entry paper-entry" data-action="papers"><b>卷</b><span><strong>模拟卷</strong><small>每门课程 5 套随机组卷，首次进入后固定</small></span><em>进入</em></button>
      <button class="entry mistake-entry" data-action="mistakes"><b>错</b><span><strong>错题本</strong><small>按课程归类，反复训练直到答对</small></span><em>进入</em></button>`;
  }

  function renderPapers() {
    app.innerHTML = `<button class="back" data-action="home">‹ 返回题库</button><section class="hero"><small>MOCK EXAMS</small><h1>开始一套<span>模拟卷。</span></h1><p>题目随机抽取；再次打开会保留同一套卷子。</p></section>${banks.map(bank => { const plan = paperPlan(bank); const description = Object.entries(plan).map(([type, count]) => `${count} ${labels[type].replace('题','')}`).join(' · '); return `<section class="paper-bank"><h2>${escape(bank.shortName)}</h2><p>${description}</p><div>${[1,2,3,4,5].map(number => `<button data-action="paper" data-bank="${bank.key}" data-paper="${number}">模拟卷${number}${saved.papers?.[`${bank.key}-${number}`] ? '<small>已生成</small>' : ''}</button>`).join('')}</div></section>`; }).join('')}`;
  }

  function renderMistakes() {
    app.innerHTML = `<button class="back" data-action="home">‹ 返回题库</button><section class="hero"><small>MISTAKE REVIEW</small><h1>集中攻克<span>错题。</span></h1><p>答对后会自动从错题本移除。</p></section><section class="bank-list">${banks.map(bank => { const s = summary(bank); return `<button class="bank-card ${s.mistakes ? '' : 'disabled'}" data-action="mistake-bank" data-bank="${bank.key}"><div><b>${escape(bank.shortName)}</b><em>${s.mistakes ? '练习' : '暂无错题'}</em></div><h2>${escape(bank.name)}</h2><small>错题 ${s.mistakes}　已完成 ${s.done}</small></button>`; }).join('')}</section>`;
  }

  function renderQuestions() {
    const bank = getBank(bankKey); const source = bankQuestions();
    const questions = source.filter(question => !mistakes || stateFor(question).wrong);
    const types = ['all', ...Object.keys(labels).filter(type => type !== 'all' && questions.some(question => question.type === type))];
    const matching = questions.filter(question => filter === 'all' || question.type === filter);
    const visible = matching.slice(0, displayLimit);
    const s = paper ? paperSummary() : summary(bank);
    app.innerHTML = `<button class="back" data-action="back">‹ 返回题库</button><section class="hero compact"><small>${mistakes ? '错题本 · ' : ''}${escape(paper ? `${bank.name} · 模拟卷${paper.number}` : bank.name)}</small><div class="stats"><span><b>${paper || mistakes ? questions.length : s.total}</b>题目</span><span><b>${s.done}</b>已完成</span><span><b>${s.accuracy}</b>正确率</span></div></section>
      <nav class="tabs">${types.map(type => `<button class="${filter === type ? 'active' : ''}" data-action="filter" data-filter="${type}">${labels[type]}</button>`).join('')}</nav>
      <div class="actions"><button data-action="random">↻ 随机一题</button><button data-action="export">导出当前题目 A4 PDF</button>${paper ? '<button data-action="clear-paper">清空本模拟卷进度</button>' : (!mistakes ? '<button data-action="clear">清除本题库进度</button>' : '')}</div><p class="notice">${mistakes ? '错题答对后将自动移出错题本。' : '选择题支持判题；简答、论述和材料题可展开参考答案。'}</p>
      ${visible.length ? visible.map(card).join('') : '<p class="empty">本题库暂无错题，继续保持。</p>'}${visible.length < matching.length ? `<div class="actions"><button data-action="more">加载更多（剩余 ${matching.length - visible.length} 题）</button></div>` : ''}`;
  }

  function render() { if (screen === 'home') renderHome(); else if (screen === 'papers') renderPapers(); else if (screen === 'mistakes') renderMistakes(); else renderQuestions(); document.querySelectorAll('.answer').forEach(node => { node.innerHTML = formatAnswer(node.textContent); }); app.insertAdjacentHTML('beforeend', accessOverlay()); }
  function findQuestion(id) { return bankQuestions().find(question => questionToken(question) === String(id)); }
  function printableQuestion(question) {
    return question.title || '';
  }
  function printableAnswer(question) {
    const answer = String(question.answer || '').trim();
    // 支持 A-Z（按 options.length 过滤越界字母），当前题库为 A-E
    const letters = (answer.match(/^[A-Z]+/i)?.[0].toUpperCase().split('') || []).filter(l => l.charCodeAt(0) - 65 < (question.options || []).length);
    if (!letters.length || !(question.options || []).length) return answer || '原文未提供标准答案，请结合教材复习。';
    const choices = letters.map(letter => {
      const option = question.options[letter.charCodeAt(0) - 65];
      return option === undefined ? letter : `${letter}. ${optionText(option)}`;
    }).join('\n');
    const explanation = answer.slice(letters.length).trim();
    return explanation ? `${choices}\n${explanation}` : choices;
  }
  function exportCurrentQuestions() {
    const bank = getBank(bankKey);
    const questions = bankQuestions().filter(question => !mistakes || stateFor(question).wrong).filter(question => filter === 'all' || question.type === filter);
    const title = paper ? `${bank.name} · 模拟卷${paper.number}` : (mistakes ? `${bank.name} · 错题本` : bank.name);
    window.A4QuestionPrint?.open({
      title,
      subtitle: `${labels[filter] || labels.all} · ${questions.length} 题`,
      questions: questions.map(question => ({question: printableQuestion(question), options: (question.options || []).map(optionText), answer: printableAnswer(question), type: labels[question.type] || question.type})),

      const saved = JSON.parse(localStorage.getItem(LOOKUP_STORAGE_KEY)) || {};

      return false;

  function toggleLookupFavorite() {

    const key = lookupFavoriteKey(activeLookup);
    try {
      if (activeLookup.entry?.id && activeLookup.entry?.bookKey) {
        const progress = JSON.parse(localStorage.getItem(VOCABULARY_STORAGE_KEY)) || {};
        if (!progress.words) progress.words = {};
        const current = progress.words[key] || {reps: 0, interval: 0, lapses: 0, due: new Date().toISOString().slice(0, 10)};
        progress.words[key] = {...current, favorite: !current.favorite};

      } else {
        const saved = JSON.parse(localStorage.getItem(LOOKUP_STORAGE_KEY)) || {};
        if (saved[key]) delete saved[key];
        else saved[key] = {word: activeLookup.word, language: activeLookup.language, context: activeLookup.context, savedAt: new Date().toISOString()};
        localStorage.setItem(LOOKUP_STORAGE_KEY, JSON.stringify(saved));

    const utterance = new SpeechSynthesisUtterance(activeLookup.entry?.word || activeLookup.word);
    utterance.lang = activeLookup.language === 'en' ? 'en-US' : activeLookup.language;
    utterance.rate = .86;
    // iOS 默认语音可能不发声：英文词显式挑选英文语音（优先常见英文名，兜底任意 en）
    if (utterance.lang === 'en-US') {
      try {
        const voices = speechSynthesis.getVoices() || [];
        utterance.voice = voices.find(v => /en[-_]us/i.test(v.lang) && /samantha|google us english|microsoft/i.test(v.name || ''))
          || voices.find(v => /^en/i.test(v.lang)) || null;
      } catch (_) {}
    }
    speechSynthesis.speak(utterance);
  }

  function buildPdfMenu(books) {
    const menu = document.createElement('div');
    menu.className = 'reading-tools__pdf-menu';
    const heading = document.createElement('strong');
    heading.className = 'reading-tools__pdf-title';
    heading.textContent = '选择 PDF 范围';
    menu.appendChild(heading);

    const openedButton = document.createElement('button');
    openedButton.type = 'button';
    openedButton.className = 'reading-tools__pdf-option reading-tools__pdf-option--opened';
    openedButton.innerHTML = '<b>已展开单元</b><span>导出当前展开的一个或多个 Unit</span>';
    openedButton.addEventListener('click', () => {

      exportPdf();

    books.forEach(book => {

      const count = book.querySelectorAll('article .q').length;

      option.addEventListener('click', () => {

  function exportPdf(book = null, bookTitle = '') {
    if (book) {
      const questions = extractQuestions(book);
      openPdf({
        title: `${document.title.replace(/\s*[·|｜].*$/, '')} · ${bookTitle}`,
        subtitle: `整本书 · 共 ${questions.length} 个作答项`,
        questions,
      });
      return;
    }
    const openedUnits = [...document.querySelectorAll('details[open]')]
      .filter(item => item.querySelector('article .q'));
    const scopes = openedUnits.length ? openedUnits : [document];
    const questions = scopes.flatMap(scope => extractQuestions(scope));
    if (!questions.length) {
      alert('当前页面没有识别到可导出的题目。');
      return;
    }
    if (!openedUnits.length && questions.length > 250) {
      alert(`当前题库共有 ${questions.length} 题。为避免手机生成超大文件，请先展开需要的一个或多个 Unit，再点击“PDF 下载”。`);
      return;
    }
    const firstUnit = openedUnits[0]?.querySelector(':scope > summary')?.textContent?.trim();
    const title = firstUnit ? `${document.title.replace(/\s*[·|｜].*$/, '')} · ${firstUnit}` : document.title;
    openPdf({title, subtitle: openedUnits.length ? `已展开 ${openedUnits.length} 个单元` : '当前题库', questions});
  }

  function openPdf(options) {
    if (window.A4QuestionPrint?.open) return window.A4QuestionPrint.open(options);
    const nd = window.WaiyuanNativeDownload;
    if (nd && nd.isNative && nd.isNative()) {
      alert('App 内不支持系统打印，请使用题库页的「PDF 下载 / 导出」功能保存文件。');
      return;
    }
    window.print();
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char]));
  }

  function extractQuestions(scope) {
    return [...scope.querySelectorAll('article')].map(article => {
      const questionNode = article.querySelector('.q pre, .q .question, .question');
      if (!questionNode) return null;
      const options = [...article.querySelectorAll('.options > div, .options .option')]
        .map(item => item.textContent.replace(/^\s*[A-Z][.．、]\s*/, '').trim())
        .filter(Boolean);
      const answerNode = article.querySelector('.answer p, .answer');
      const moduleTitle = article.closest('.exercise-module')?.querySelector('h3, .exercise-module-title')?.textContent?.trim() || '';
      return {
        type: moduleTitle,
        question: questionNode.textContent.trim(),
        options,
        answer: answerNode?.textContent?.trim() || '原文未提供参考答案。',
      };
    }).filter(Boolean);
  }
})();

  <script>/* ============================================================
   外院知识分享站 · 番茄钟（全站悬浮工具）
   - 右下角小番茄图标（可收缩：点击开合面板）
   - 预设/自定义时长倒计时（真实时间，interval 漂移免疫）
   - 计时期间可选择白噪音（Web Audio 实时生成：白噪音/雨声/粉红噪音）
   - 结束提示音 + 页面隐藏时系统通知（不主动申请权限）
   依赖：无（离线可用，单文件版同样生效）
   ============================================================ */
(() => {
  if (window.__WAIYUAN_TOMATO__) return;
  window.__WAIYUAN_TOMATO__ = true;

  const LS_KEY = 'waiyuan-tomato-v1';
  const loadPrefs = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (_) { return {}; } };
  const savePrefs = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(prefs)); } catch (_) {} };
  const prefs = loadPrefs();

  let currentMinutes = prefs.minutes && prefs.minutes > 0 ? Math.min(prefs.minutes, 120) : 25;
  let noiseOn = !!prefs.noise;
  let noiseKind = prefs.noiseKind === 'rain' || prefs.noiseKind === 'pink' ? prefs.noiseKind : 'white';
  let noiseVolume = typeof prefs.noiseVolume === 'number' ? Math.min(Math.max(prefs.noiseVolume, 0), 1) : 0.4;

  let timer = null;
  let endAt = 0;
  let remainMs = currentMinutes * 60000;
  let running = false;
  let audioCtx = null;
  let noiseNodes = null;
  const originalTitle = document.title;

  /* ---------- DOM 构建 ---------- */
  const wrap = document.createElement('div');
  wrap.className = 'tomato-timer';
  wrap.innerHTML = `
    <button type="button" class="tomato-timer__toggle" aria-label="番茄钟" aria-expanded="false">
      <svg class="tomato-timer__icon" viewBox="0 0 64 64" aria-hidden="true">
        <ellipse cx="32" cy="39" rx="19" ry="17" fill="#e0503a"/>
        <ellipse cx="25" cy="33" rx="6" ry="3.5" fill="#ff8a6b" opacity=".5" transform="rotate(-25 25 33)"/>
        <rect x="30.8" y="9.5" width="2.4" height="9.5" rx="1.2" fill="#3f8f4e"/>
        <g fill="#4c9e55">
          <ellipse cx="32" cy="21.5" rx="2.8" ry="5"/>
          <ellipse cx="26.5" cy="22.5" rx="2.6" ry="4.6" transform="rotate(-50 26.5 22.5)"/>
          <ellipse cx="37.5" cy="22.5" rx="2.6" ry="4.6" transform="rotate(50 37.5 22.5)"/>
          <ellipse cx="23.5" cy="26.5" rx="2.4" ry="4.2" transform="rotate(-28 23.5 26.5)"/>
          <ellipse cx="40.5" cy="26.5" rx="2.4" ry="4.2" transform="rotate(28 40.5 26.5)"/>
        </g>
      </svg>
      <span class="tomato-timer__remain"></span>
    </button>
    <section class="tomato-timer__panel" role="dialog" aria-label="番茄钟">
      <header><b>🍅 番茄钟</b><button type="button" class="tomato-timer__close" aria-label="关闭">×</button></header>
      <div class="tomato-timer__time" role="timer">25:00</div>
      <div class="tomato-timer__presets">
        <button type="button" class="tomato-timer__chip" data-min="15">15 分</button>
        <button type="button" class="tomato-timer__chip" data-min="25">25 分</button>
        <button type="button" class="tomato-timer__chip" data-min="45">45 分</button>
        <input class="tomato-timer__custom" type="number" min="1" max="120" placeholder="自定义(分)" inputmode="numeric">
      </div>
      <div class="tomato-timer__controls">
        <button type="button" class="tomato-timer__start">开始</button>
        <button type="button" class="tomato-timer__reset">重置</button>
      </div>
      <div class="tomato-timer__noise">
        <label class="tomato-timer__noise-label"><input type="checkbox" class="tomato-timer__noise-check">白噪音</label>
        <select class="tomato-timer__kind" aria-label="白噪音音色">
          <option value="white">白噪音</option>
          <option value="rain">雨声</option>
          <option value="pink">粉红噪音</option>
        </select>
        <input class="tomato-timer__volume" type="range" min="0" max="100" value="40" aria-label="音量">
      </div>
      <p class="tomato-timer__hint">计时结束有提示音；白噪音由浏览器实时生成，无需联网，可边刷题边听。</p>
    </section>`;
  document.body.appendChild(wrap);

  const toggle = wrap.querySelector('.tomato-timer__toggle');
  const panel = wrap.querySelector('.tomato-timer__panel');
  const timeEl = wrap.querySelector('.tomato-timer__time');
  const remainEl = wrap.querySelector('.tomato-timer__remain');
  const chips = [...wrap.querySelectorAll('.tomato-timer__chip')];
  const customEl = wrap.querySelector('.tomato-timer__custom');
  const startBtn = wrap.querySelector('.tomato-timer__start');
  const resetBtn = wrap.querySelector('.tomato-timer__reset');
  const noiseCheck = wrap.querySelector('.tomato-timer__noise-check');
  const kindSel = wrap.querySelector('.tomato-timer__kind');
  const volumeEl = wrap.querySelector('.tomato-timer__volume');

  /* ---------- 显示 ---------- */
  const fmt = ms => {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  };

  const renderToggle = () => {
    if (running) {
      remainEl.textContent = String(Math.max(1, Math.ceil((endAt - Date.now()) / 60000)));

    } else {

  function updateUI() {

    chips.forEach(chip => chip.classList.toggle('is-active', !running && Number(chip.dataset.min) === currentMinutes));
    customEl.value = chips.some(chip => Number(chip.dataset.min) === currentMinutes) ? '' : currentMinutes;
    noiseCheck.checked = noiseOn;
    kindSel.value = noiseKind;
    volumeEl.value = Math.round(noiseVolume * 100);
    render();
    renderToggle();
  }

  /* ---------- 计时 ---------- */
  function tick() {
    const left = endAt - Date.now();
    if (left <= 0) { finish(); return; }
    render();
    renderToggle();
    document.title = `🍅 ${fmt(left)} · ${originalTitle}`;
  }
  function start() {
    if (running) { pause(); return; }
    if (remainMs <= 0) remainMs = currentMinutes * 60000;
    endAt = Date.now() + remainMs;
    running = true;
    timer = setInterval(tick, 500);
    tick();
    if (noiseOn) ensureNoise();
    updateUI();
  }
  function pause() {
    if (!running) return;
    remainMs = endAt - Date.now();
    running = false;
    clearInterval(timer); timer = null;
    restoreTitle();
    stopNoise();
    updateUI();
  }
  function reset() {
    running = false;
    clearInterval(timer); timer = null;
    remainMs = currentMinutes * 60000;
    restoreTitle();
    stopNoise();
    updateUI();
  }
  function finish() {
    running = false;
    clearInterval(timer); timer = null;
    remainMs = 0;
    restoreTitle();
    stopNoise();
    beep();
    if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
      try { new Notification('🍅 番茄钟结束', { body: '休息一下，起来活动活动吧！' }); } catch (_) {}
    }
    updateUI();
  }
  function setMinutes(m) {
    if (!Number.isFinite(m)) return;
    const clamped = Math.min(Math.max(Math.round(m), 1), 120);
    if (running || remainMs === currentMinutes * 60000) remainMs = clamped * 60000;
    currentMinutes = clamped;
    prefs.minutes = clamped;
    savePrefs();
    updateUI();
  }

  /* ---------- 白噪音（Web Audio 实时生成） ---------- */
  function ensureNoise() {
    if (noiseNodes || !noiseOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const rate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, rate * 2, rate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.loop = true;
      let tail = src;
      if (noiseKind === 'rain') {
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 900; filter.Q.value = 0.5;
        src.connect(filter); tail = filter;
      } else if (noiseKind === 'pink') {
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 1500;
        src.connect(filter); tail = filter;
      }
      const gain = audioCtx.createGain();
      gain.gain.value = noiseVolume;
      tail.connect(gain);
      gain.connect(audioCtx.destination);
      src.start();
      noiseNodes = { src, gain };
    } catch (_) { /* 音频不可用则静默忽略 */ }
  }
  function stopNoise() {
    if (!noiseNodes) return;
    try { noiseNodes.src.stop(); } catch (_) {}
    noiseNodes = null;
  }
  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [880, 880, 1174];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const t0 = audioCtx.currentTime + i * 0.28;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.35, t0 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.26);
      });
    } catch (_) {}
  }

  /* ---------- 事件 ---------- */
  toggle.addEventListener('click', () => {
    const open = panel.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  wrap.querySelector('.tomato-timer__close').addEventListener('click', () => {
    panel.classList.remove('is-open');
    toggle.setAttribute('aria-expanded', 'false');
  });
  chips.forEach(chip => chip.addEventListener('click', () => setMinutes(Number(chip.dataset.min))));
  customEl.addEventListener('change', () => { const v = parseInt(customEl.value, 10); if (Number.isFinite(v)) setMinutes(v); });
  startBtn.addEventListener('click', start);
  resetBtn.addEventListener('click', reset);
  noiseCheck.addEventListener('change', () => {
    noiseOn = noiseCheck.checked;
    prefs.noise = noiseOn;
    savePrefs();
    if (noiseOn && running) ensureNoise();
    if (!noiseOn) stopNoise();
  });
  kindSel.addEventListener('change', () => {
    noiseKind = kindSel.value;
    prefs.noiseKind = noiseKind;
    savePrefs();
    if (noiseOn && running) { stopNoise(); ensureNoise(); }
  });
  volumeEl.addEventListener('input', () => {
    noiseVolume = Number(volumeEl.value) / 100;
    prefs.noiseVolume = noiseVolume;
    savePrefs();
    if (noiseNodes) { try { noiseNodes.gain.gain.value = noiseVolume; } catch (_) {} }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) renderToggle(); });

  updateUI();
})();

  <script>(() => {
  const KEY = 'waiyuan-unified-web-study-v1';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {version:1,progress:{},favorites:{}}; } catch (_) { return {version:1,progress:{},favorites:{}}; } };
  // 本地存储失败提示：隐私模式/空间不足时进度会丢，至少让用户知道（每页一次，不刷屏）
  let saveWarned = false;
  const warnSaveFailed = () => {
    if (saveWarned) return;
    saveWarned = true;
    const notice = document.createElement('div');
    notice.className = 'unified-focus-notice';
    notice.setAttribute('role', 'alert');
    notice.textContent = '⚠ 本地保存失败（浏览器存储不可用或空间不足），答题进度可能无法保存。可到学习中心「导出学习数据」备份。';
    const close = document.createElement('button');
    close.type = 'button';
    close.textContent = '知道了';
    close.addEventListener('click', () => notice.remove());
    notice.appendChild(close);
    document.body.appendChild(notice);
    setTimeout(() => notice.remove(), 10000);
  };
  const save = state => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (error) { console.warn('统一引擎: 保存失败', error); warnSaveFailed(); }
  };
  const state = load(); if (!state.progress) state.progress = {}; if (!state.favorites) state.favorites = {};
  const clean = text => String(text || '').replace(/\s+/g, ' ').trim();
  const hash = text => { let value = 2166136261; for (const char of text) value = Math.imul(value ^ char.charCodeAt(0), 16777619); return (value >>> 0).toString(36); };
  const pageKey = location.pathname.replace(/\/index\.html$/i, '').replace(/[^a-z0-9\u4e00-\u9fff]+/gi, '-');

  // 页面（思政/计算机/泛读/基英/翻译/改写）反查定位时使用同一 key 算法
  const computeKey = (stableId, title) => `${pageKey}-${hash(`${stableId}-${clean(title)}`)}`;
  const cardSelector = '.question-card,.card,.question';
  const findCardByKey = key => [...observeRoot().querySelectorAll(cardSelector)].find(item => item.dataset.unifiedReady === key);

  function copyText(text) {
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
    else legacyCopy(text);
  }
  function legacyCopy(text) {
    try {
      const area = document.createElement('textarea');
      area.value = text;
      area.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      area.remove();
    } catch (_) {}
  }
  function showFeedbackNotice(message, mailtoHref) {
    const notice = document.createElement('div');
    notice.className = 'unified-feedback-notice';
    notice.setAttribute('role', 'status');
    const close = document.createElement('button');
    close.type = 'button';
    close.textContent = '知道了';
    close.addEventListener('click', () => notice.remove());

  function enhanceCard(card, index) {
