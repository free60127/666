<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#28634f">
  <title>会员中心 · 外院知识分享站</title>
  <meta name="description" content="外院知识分享站 · 会员中心：开通全站会员，解锁付费题库内容。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="外院知识分享站">
  <meta property="og:title" content="会员中心 · 外院知识分享站">
  <meta property="og:description" content="外院知识分享站 · 会员中心：开通全站会员，解锁付费题库内容。">
  <meta property="og:url" content="https://free60127.top/%E4%BC%9A%E5%91%98%E4%B8%AD%E5%BF%83/index.html">
  <meta property="og:image" content="https://free60127.top/og-image.png">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="style.css?v=20260822-2229">
  <script data-theme-boot>(function(){var t;try{t=localStorage.getItem('waiyuan-web-theme-v1')}catch(e){}if(t!=='dark'&&t!=='light'){try{t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){t='light'}}document.documentElement.dataset.theme=t})();</script>
</head>
<body>
  <header class="mc-header">
    <a class="mc-back" href="../index.html">← 返回首页</a>
    <div class="mc-brand">👑 会员中心</div>
    <div class="mc-auth" id="mc-auth">
      <button class="mc-auth-btn" id="auth-open-btn">👤 登录 / 注册</button>
      <span class="mc-auth-email" id="auth-email" hidden></span>
      <button class="mc-auth-btn ghost" id="auth-logout-btn" hidden>退出</button>
    </div>
  </header>

  <main class="mc-shell">
    <section class="mc-card status-card" id="status-card">
      <div class="status-title" id="status-title">会员状态</div>
      <div class="status-value" id="status-value">加载中…</div>
      <div class="status-sub" id="status-sub"></div>
    </section>

    <section class="mc-card plan-card" id="plan-card">
      <div class="plan-head">
        <div>
          <div class="plan-name">全站会员 · 30 天</div>
          <div class="plan-desc">解锁全部会员专享题库与内容</div>
        </div>
        <div class="plan-price"><small>¥</small>2</div>
      </div>
      <ul class="plan-benefits">
        <li>会员专享题库无限刷</li>
        <li>学习进度 / 错题 / 收藏云同步</li>
        <li>支持本站持续更新（一杯奶茶钱）</li>
      </ul>
      <button class="mc-btn primary" id="buy-btn">立即开通</button>
      <div class="plan-note">微信扫码支付 · 自动开通 · 到期自动失效，续费顺延</div>
    </section>

    <section class="mc-card faq-card">
      <div class="faq-title">常见问题</div>
      <p><b>支付后多久开通？</b>扫码支付成功后自动开通，无需人工（约 1~3 秒）。</p>
      <p><b>多设备通用吗？</b>通用。用同一账号登录即可，会员跟着账号走。</p>
      <p><b>能退款吗？</b>虚拟内容不支持退款，请确认需求后购买。</p>
    </section>
  </main>

  <!-- 支付弹窗 -->
  <div class="modal-mask" id="pay-modal" hidden>
    <div class="modal-box pay-box">
      <div class="modal-title">微信扫码支付</div>
      <div class="pay-amount" id="pay-amount">¥2.00</div>
      <div class="pay-qr" id="pay-qr"></div>
      <div class="pay-tip" id="pay-tip">请使用微信扫一扫完成支付</div>
      <button class="mc-btn" id="pay-cancel">我已支付 / 取消</button>
    </div>
  </div>

  <!-- 登录/注册弹窗 -->
  <div class="modal-mask" id="auth-modal" hidden>
    <div class="modal-box auth-box">
      <div class="auth-tabs">
        <button class="auth-tab active" data-atab="login">登录</button>
        <button class="auth-tab" data-atab="register">注册</button>
      </div>
      <div class="auth-fields">
        <input class="mc-input" id="auth-email-input" type="email" placeholder="邮箱" autocomplete="email">
        <input class="mc-input" id="auth-password-input" type="password" placeholder="密码（至少 8 位）" autocomplete="current-password">
        <input class="mc-input" id="auth-nickname-input" type="text" placeholder="昵称（选填）" hidden>
        <button class="mc-btn primary" id="auth-submit-btn">登录</button>
        <div class="auth-hint" id="auth-hint"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="../qrcode.js?v=20260822-2229"></script>
  <script src="../学习中心/auth.js?v=20260822-2229"></script>
  <script src="app.js?v=20260822-2229"></script>
  <script defer src="../common.js" data-common-injected></script>
</body>
</html>
