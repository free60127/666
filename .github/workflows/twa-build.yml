name: TWA APK Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: '构建应用: both / share / paotui'
        required: true
        default: both
        type: choice
        options:
          - both
          - share
          - paotui

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install bubblewrap CLI
        run: npm i -g @bubblewrap/cli

      - name: Restore keystore from secret
        run: |
          mkdir -p keys
          echo "${{ secrets.APK_KEYSTORE_B64 }}" | base64 -d > keys/android.keystore
          ls -la keys/

      - name: Generate and build share APK
        if: inputs.app == 'both' || inputs.app == 'share'
        run: |
          node scripts/make-twa.cjs share
          cd android-share
          ./gradlew --no-daemon assembleRelease
          cd ..
          cp android-share/app/build/outputs/apk/release/app-release.apk waiyuan-share.apk
          ls -la waiyuan-share.apk
        env:
          TWA_KEYSTORE: ${{ github.workspace }}/keys/android.keystore
          TWA_KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
          TWA_KEY_PASS: ${{ secrets.APK_KEY_PASS }}
          TWA_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}

      - name: Generate and build paotui APK
        if: inputs.app == 'both' || inputs.app == 'paotui'
        run: |
          node scripts/make-twa.cjs paotui
          cd android-paotui
          ./gradlew --no-daemon assembleRelease
          cd ..
          cp android-paotui/app/build/outputs/apk/release/app-release.apk waiyuan-paotui.apk
          ls -la waiyuan-paotui.apk
        env:
          TWA_KEYSTORE: ${{ github.workspace }}/keys/android.keystore
          TWA_KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
          TWA_KEY_PASS: ${{ secrets.APK_KEY_PASS }}
          TWA_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}

      - name: Upload APKs to GitHub Release
        run: |
          TAG=apk-v1
          gh release view $TAG --repo ${{ github.repository }} >/dev/null 2>&1 || gh release create $TAG --repo ${{ github.repository }} --title '外院知识分享站 / 外院跑腿 APK' --notes 'TWA 壳 APK：加载线上网页，站点更新即自动同步。'
          if [ -f waiyuan-share.apk ]; then gh release upload $TAG waiyuan-share.apk --repo ${{ github.repository }} --clobber; fi
          if [ -f waiyuan-paotui.apk ]; then gh release upload $TAG waiyuan-paotui.apk --repo ${{ github.repository }} --clobber; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
