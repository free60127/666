name: 构建 APK Capacitor

on:
  workflow_dispatch:
    inputs:
      app:
        description: '构建应用: both / share / paotui'
        required: true
        default: both
        type: choice
        options:
          - both
          - share
          - paotui
      version:
        description: '版本号 versionName 如 1.1.0 留空自动 1.YYMM.提交数'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TWA_KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
      TWA_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
      TWA_KEY_PASS: ${{ secrets.APK_KEY_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖 share
        working-directory: cap-share
        run: npm ci --no-audit --no-fund

      - name: 安装依赖 paotui
        working-directory: cap-paotui
        run: npm ci --no-audit --no-fund

      - name: Resolve APK version
        id: ver
        run: |
          VER="${{ inputs.version }}"
          CODE=$(git rev-list --count HEAD)
          if [ -z "$VER" ]; then VER="1.$(date +%y%m).$CODE"; fi
          case "$VER" in
            *[!0-9.]*|''|.*|*..*|*. ) echo "invalid version: $VER"; exit 1;;
          esac
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "APK_VERSION=$VER code=$CODE"

      - name: Restore keystore from secret
        run: |
          mkdir -p keys
          echo "${{ secrets.APK_KEYSTORE_B64 }}" | base64 -d > keys/android.keystore
          ls -la keys/

      - name: 注入签名与版本 share
        if: inputs.app == 'both' || inputs.app == 'share'
        run: node scripts/cap-sign.cjs cap-share
        env:
          TWA_VERSION: ${{ env.VERSION }}
          TWA_VERSION_CODE: ${{ env.VERSION_CODE }}

      - name: 注入签名与版本 paotui
        if: inputs.app == 'both' || inputs.app == 'paotui'
        run: node scripts/cap-sign.cjs cap-paotui
        env:
          TWA_VERSION: ${{ env.VERSION }}
          TWA_VERSION_CODE: ${{ env.VERSION_CODE }}

      - name: 构建 share APK
        if: inputs.app == 'both' || inputs.app == 'share'
        working-directory: cap-share/android
        run: ./gradlew --no-daemon assembleRelease

      - name: 构建 paotui APK
        if: inputs.app == 'both' || inputs.app == 'paotui'
        working-directory: cap-paotui/android
        run: ./gradlew --no-daemon assembleRelease

      - name: 收集 APK
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ inputs.app }}" = "both" ] || [ "${{ inputs.app }}" = "share" ]; then
            cp cap-share/android/app/build/outputs/apk/release/app-release.apk dist/waiyuan-share.apk
          fi
          if [ "${{ inputs.app }}" = "both" ] || [ "${{ inputs.app }}" = "paotui" ]; then
            cp cap-paotui/android/app/build/outputs/apk/release/app-release.apk dist/waiyuan-paotui.apk
          fi
          ls -la dist/

      - name: Upload APKs to Cloudflare KV
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_NS }}/values"
          AUTH="Authorization: Bearer ${{ secrets.CF_API_TOKEN }}"
          upload() {
            local file="$1" key="$2" meta="$3" resp code body size
            size=$(stat -c%s "$file")
            echo "upload $file -> $key (${size} bytes)"
            resp=$(curl -sS --fail-with-body -X PUT "$API/$(printf '%s' "$key" | jq -sRr @uri)?metadata=$(printf '%s' "$meta" | jq -sRr @uri)" -H "$AUTH" --data-binary @"$file" -w $'\n%{http_code}')
            code=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            if [ "$code" != "200" ] || ! printf '%s' "$body" | grep -q '"success":true'; then
              echo "KV PUT FAILED key=$key http=$code body=$body"; exit 1
            fi
            echo "KV PUT ok key=$key (${size} bytes)"
          }
          put_latest() {
            local name="$1" ver="$2"
            local enc
            enc=$(printf '%s' "apk:latest:$name" | jq -sRr @uri)
            curl -sS --fail-with-body -X PUT "$API/$enc" -H "$AUTH" --data-binary "$ver" -o /dev/null -w "latest $name -> http=%{http_code}\n"
          }
          for name in waiyuan-share waiyuan-paotui; do
            if [ -f "dist/$name.apk" ]; then
              sha=$(sha256sum "dist/$name.apk" | cut -d' ' -f1)
              echo "sha256 $name.apk = $sha"
              upload "dist/$name.apk" "apk:${name}-v${VERSION}.apk" "{\"sha\":\"${sha}\"}"
              upload "dist/$name.apk" "apk:${name}.apk" "{\"sha\":\"${sha}\"}"
              put_latest "$name.apk" "$VERSION"
            fi
          done
          for name in waiyuan-share waiyuan-paotui; do
            if [ -f "dist/$name.apk" ]; then
              loc=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "https://free60127.top/apk/$name.apk")
              echo "verify stable $name: $loc"
              http=${loc%% *}; url=${loc#* }
              if [ "$http" != "302" ]; then echo "STABLE REDIRECT FAIL: $loc"; exit 1; fi
              info=$(curl -sS -o /dev/null -w '%{http_code} %{size_download}' "$url")
              echo "verify versioned $name: $info"
              vhttp=${info%% *}; vsize=${info#* }
              local_size=$(stat -c%s "dist/$name.apk")
              if [ "$vhttp" != "200" ] || [ "$vsize" != "$local_size" ]; then
                echo "VERSIONED DOWNLOAD FAIL: $info vs local $local_size"; exit 1
              fi
            fi
          done

      - name: Upload APKs to GitHub Release
        run: |
          TAG=apk-v$VERSION
          gh release view $TAG --repo ${{ github.repository }} >/dev/null 2>&1 || gh release create $TAG --repo ${{ github.repository }} --title '外院知识分享站 外院跑腿 APK v'$VERSION --notes 'Capacitor 壳 APK 加载线上网页 站点内容更新即自动同步'
          if [ -f dist/waiyuan-share.apk ]; then gh release upload $TAG dist/waiyuan-share.apk --repo ${{ github.repository }} --clobber; fi
          if [ -f dist/waiyuan-paotui.apk ]; then gh release upload $TAG dist/waiyuan-paotui.apk --repo ${{ github.repository }} --clobber; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}