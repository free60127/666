name: 部署 Worker（远程迁移 + 部署 + 冒烟）

on:
  workflow_dispatch:
    inputs:
      smoke_only:
        description: '仅跑线上冒烟测试（不迁移不部署）: true / false'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: D1 远程迁移（幂等，保证线上 schema 与迁移目录一致）
        if: inputs.smoke_only != 'true'
        working-directory: workers
        run: npx -y wrangler@4.124.0 d1 migrations apply waiyuan-study-db --remote
      - name: 部署 Worker
        if: inputs.smoke_only != 'true'
        working-directory: workers
        run: npx -y wrangler@4.124.0 deploy
      - name: 线上冒烟测试（health + 云同步上传/下载/删除闭环）
        run: node scripts/verify-deploy-smoke.mjs
