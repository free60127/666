name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 语法检查
        run: node scripts/ci-syntax-check.js
      - name: 重建数据产物
        run: node scripts/build/build.js
      - name: 数据校验
        run: node scripts/build/validate.js
      - name: 资源引用完整性
        run: node scripts/check-links.js
      - name: 单文件离线版重建与验证
        run: |
          node scripts/build-standalone.js 思政系列
          node scripts/build-standalone.js 计算机系列
          node scripts/verify-standalone.js 思政系列/思政刷题-单文件离线版.html
          node scripts/verify-standalone.js 计算机系列/计算机刷题-单文件离线版.html
      - name: 工作区无脏改动（产物可复现，差异直接失败）
        run: |
          # 检查全部生成产物（data.js/data.json/单文件版 HTML 等）是否与提交一致：
          # build.js 与 build-standalone.js 已在上方重建，若产物陈旧这里会产生差异并使 CI 失败。
          # 版本号刷新由 release.js 负责，CI 不做，因此 ?v= 差异不会被误报。
          git diff --exit-code || { echo '::error::构建产物与提交不一致（data.js/data.json/单文件版等），请先本地跑 node scripts/release.js'; git diff --stat; exit 1; }

  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装测试依赖与 Chromium
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: 运行浏览器测试（Playwright，全量 31+ 用例）
        working-directory: tests
        env:
          PW_CHANNEL: chromium
        run: npx playwright test

  worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # wrangler 4.124+ 要求 Node >=22
      - name: Worker 单元测试（内存 D1）
        run: |
          node scripts/test-auth.mjs
          node scripts/test-errand.mjs
      - name: Worker + D1 本地集成测试（wrangler dev --local）
        run: |
          cd workers
          npx -y wrangler@4.124.0 d1 migrations apply waiyuan-study-db --local --persist-to ./.ci-state
          npx -y wrangler@4.124.0 dev --port 8787 --local --persist-to ./.ci-state > /tmp/wr-dev.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8787/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/api/health > /dev/null || { cat /tmp/wr-dev.log; exit 1; }
          cd ..
          node scripts/verify-sync-local.mjs
        shell: bash
