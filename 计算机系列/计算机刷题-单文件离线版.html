  <style>:root{--green:#28634f;--cream:#fffefa;--ink:#17211f;--muted:#73817b;--line:#dfe6df;--orange:#d97845}*{box-sizing:border-box}body{margin:0;background:#f7f8f3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}button{font:inherit;cursor:pointer}#app{max-width:760px;margin:0 auto;padding:28px 18px 96px}.brand{display:flex;gap:12px;align-items:center;margin:4px 0 36px}.mark,.entry>b{display:grid;place-items:center;background:var(--green);color:#fff;border-radius:12px;font-size:28px;width:54px;height:54px}.brand strong{font-size:25px;display:block}.brand small{display:block;letter-spacing:2px;color:#87918d;font-size:11px}.hero small{font-weight:800;color:var(--orange);letter-spacing:1.5px}.hero h1{font-size:34px;line-height:1.2;margin:10px 0}.hero h1 span{color:var(--green)}.hero p,.notice{color:var(--muted);margin:0 0 22px}.bank-list{display:grid;gap:14px}.bank-card,.entry,.paper-bank{width:100%;border:1px solid var(--line);background:var(--cream);border-radius:18px;text-align:left;padding:20px;box-shadow:0 8px 24px rgba(35,61,49,.05)}.bank-card>div,.entry{display:flex;align-items:center;justify-content:space-between}.bank-card b{font-size:14px;padding:5px 9px;background:var(--green);color:#fff;border-radius:6px}.bank-card em,.entry em{font-style:normal;color:var(--orange);font-size:14px}.bank-card h2{margin:14px 0 3px;font-size:21px}.bank-card p{margin:0;color:var(--muted);font-size:14px}.bank-card small{display:block;color:var(--green);margin-top:16px}.bank-card footer{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.bank-card i{font-style:normal;font-size:12px;color:#586b64;background:#edf4ef;border-radius:5px;padding:4px 7px}.entry{margin-top:18px;gap:14px}.entry span{flex:1}.entry strong,.entry small{display:block}.entry strong{font-size:20px}.entry small{color:var(--muted);font-size:13px}.mistake-entry{background:#fff6ef;border-color:#efc6b6}.mistake-entry>b{background:var(--orange)}.back{border:0;background:transparent;color:var(--green);padding:0;font-size:16px;margin-bottom:24px}.paper-bank{margin:15px 0}.paper-bank h2{margin:0;font-size:20px}.paper-bank p{color:var(--muted);margin:5px 0 13px;font-size:13px}.paper-bank div{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.paper-bank button,.actions button{border:1px solid #c9ddcf;border-radius:11px;background:#f1f7f2;color:var(--green);padding:12px;font-weight:700}.paper-bank button small{display:block;font-weight:400;color:var(--muted);font-size:11px}.compact{margin-bottom:12px}.stats{display:flex;gap:38px;margin:18px 0}.stats span{display:grid;color:var(--muted);font-size:14px}.stats b{font-size:35px;color:var(--green);line-height:1.1}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 15px;border-bottom:1px solid var(--line);margin-bottom:16px}.tabs button{border:0;background:transparent;color:#65736d;white-space:nowrap;font-size:16px;padding:10px 15px;font-weight:700;border-radius:24px}.tabs button.active{background:var(--green);color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.actions button{padding:9px 15px}.notice{font-size:14px}.card{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 24px rgba(35,61,49,.045)}.qrow{display:flex;gap:16px}.qindex{font-size:22px;color:var(--orange);min-width:26px}.qrow h2{font-size:22px;line-height:1.55;margin:0 0 8px;word-break:break-word}.tag,.hint{display:inline-block;background:#edf4ef;color:#4b7a66;border-radius:5px;font-size:13px;padding:3px 7px;margin-right:6px}.hint{background:#fff3e9;color:#a46945}.options{display:grid;gap:11px;margin-top:18px}.option{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid #e2e6e1;background:#fffefa;border-radius:12px;padding:15px;color:#52615b;font-size:18px}.option.selected{border-color:#78a08a}.option.correct{background:#def2e4;border-color:#78a08a;color:#276545}.option.wrong{background:#fbe2e0;border-color:#d98981;color:#a04b44}.radio,.check{width:25px;height:25px;border:2px solid #c8d1cc;display:inline-block;flex:none}.radio{border-radius:50%}.check{border-radius:5px}.radio.selected{box-shadow:inset 0 0 0 6px var(--green);border-color:var(--green)}.check.selected{background:var(--green);border-color:var(--green)}.confirm{border:0;border-radius:24px;background:var(--green);color:#fff;padding:12px;font-weight:800;margin-top:3px}.answer-toggle{border:0;border-top:1px dashed var(--line);width:100%;text-align:left;background:transparent;color:var(--green);font-size:17px;padding:17px 0 0;margin-top:18px}.answer{background:#eef6ef;color:#35634d;padding:16px;border-radius:10px;white-space:pre-wrap;word-break:break-word;margin-top:15px}.empty{text-align:center;color:var(--muted);padding:40px}.disabled{opacity:.55}@media(max-width:430px){#app{padding:22px 14px 90px}.hero h1{font-size:30px}.qrow h2{font-size:20px}.option{font-size:17px;padding:14px}.stats{gap:24px}.stats b{font-size:31px}}
.section-heading{margin:32px 4px 8px;color:var(--green);font-size:19px;line-height:1.4}.section-heading-empty{margin-bottom:4px}.section-empty-note{margin:0 4px 16px;color:var(--muted);font-size:14px}
.practice-qr{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--cream);text-align:center;box-shadow:0 8px 24px rgba(35,61,49,.05)}.practice-qr strong,.practice-qr small{display:block}.practice-qr strong{font-size:20px;color:var(--green)}.practice-qr small{margin-top:3px;color:var(--orange);font-weight:700}.practice-qr img{display:block;width:min(100%,300px);height:auto;margin:16px auto 0;border:1px solid var(--line);border-radius:12px}
/* access and sponsorship */
.support-entry{display:block;width:100%;margin-top:18px;padding:19px 20px;border:1px solid #d7b276;border-radius:18px;background:#fff9ed;text-align:left;color:#714a18;box-shadow:0 8px 24px rgba(81,58,21,.06)}.support-entry span{display:block;font-size:20px;font-weight:800}.support-entry b{float:right;margin-top:-30px;color:#bd7020;font-size:22px}.support-entry small{display:block;margin-top:4px;color:#957553}.modal-mask{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:20px;background:rgba(18,31,25,.55)}.access-modal{position:relative;width:min(100%,420px);max-height:min(90vh,720px);max-height:min(90dvh,720px);overflow:auto;border-radius:20px;background:#fffefa;padding:30px 24px;color:var(--ink);box-shadow:0 20px 56px rgba(0,0,0,.25)}.access-modal h2{margin:6px 34px 8px 0;font-size:25px;line-height:1.3}.access-modal p{color:var(--muted);margin:8px 0 18px}.access-kicker{font-size:12px!important;font-weight:800;color:var(--orange)!important;letter-spacing:1.6px}.modal-x{position:absolute;right:14px;top:12px;border:0;background:transparent;font-size:30px;line-height:1;color:var(--muted);padding:6px 10px}.modal-x.hidden{display:none}.access-main{width:100%;border:0;border-radius:12px;background:var(--green);color:#fff;padding:14px 16px;font-weight:800;font-size:17px}.access-modal small{display:block;color:#8a958f;margin-top:12px;font-size:12px}.pay-modal{text-align:center}.pay-modal h2{margin-right:0}.payment-qr{display:block;width:min(78vw,300px);height:auto;margin:14px auto;border-radius:12px;border:1px solid var(--line)}.payment-note{font-size:13px;line-height:1.5;margin-bottom:14px!important}.activation-label{display:block;text-align:left;font-size:13px;color:var(--muted);margin:0 0 5px}.activation-row{display:flex;gap:8px}.activation-row input{min-width:0;flex:1;border:1px solid #cbd5cf;border-radius:10px;padding:11px 10px;font:inherit}.activation-row button{border:0;border-radius:10px;background:var(--green);color:#fff;padding:0 14px;font-weight:800}@media(max-width:430px){.access-modal{padding:26px 18px}.access-modal h2{font-size:23px}}
/* Opening thank-you notice */
.welcome-modal{text-align:center}.welcome-modal h2{margin:6px 18px 18px;font-size:22px;line-height:1.5}.welcome-cat{display:block;width:min(72vw,270px);max-height:300px;object-fit:cover;margin:0 auto 18px;border-radius:16px;border:1px solid var(--line)}
/* Structured answers: real outline markers become separate study points;
   score notes stay attached to the sentence they grade. */
.answer{white-space:normal;line-height:1.78}.answer-lead{margin:0 0 12px}.answer-section{margin:18px 0 10px;color:#245a45;font-weight:800;font-size:1.05em}.answer-section:first-child{margin-top:0}.answer-item{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;margin:12px 0;padding:11px 12px;border-left:3px solid #80ad91;background:rgba(255,255,255,.38);border-radius:0 8px 8px 0}.answer-item.level-one{font-weight:700;color:#245a45}.answer-item.level-two{margin:8px 0 8px 18px;padding:8px 10px;border-left-color:#c6a26d;background:rgba(255,255,255,.2);font-weight:400;color:#35634d}.answer-marker{font-weight:800;white-space:nowrap}.answer-content{min-width:0}.score{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;background:#dcecdf;color:#43735c;font-size:.82em;white-space:nowrap}

:root{--reading-scale:1}
body.reading-tools-enabled>:not(.reading-tools):not(#a4-mobile-download-panel){zoom:var(--reading-scale)}
.reading-tools{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:99990;display:flex;flex-direction:column;align-items:flex-end;gap:10px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;zoom:1!important}
.reading-tools button{box-sizing:border-box;border:1px solid #c7d8cb;background:#fffefa;color:#28634f;box-shadow:0 8px 24px rgba(35,61,49,.18);cursor:pointer;font:750 13px/1.15 inherit}
.reading-tools__button{display:flex;flex-direction:column;align-items:center;justify-content:center;width:58px;height:58px;padding:0;border-radius:50%}
.reading-tools__button strong{font-size:20px;line-height:1}
.reading-tools__button span{margin-top:4px;font-size:11px}
.reading-tools__button--pdf{background:#28634f!important;color:#fff!important}
.reading-tools__button--top{opacity:0;pointer-events:none;transform:translateY(8px);transition:.18s ease}
.reading-tools__button--top.is-visible{opacity:1;pointer-events:auto;transform:none}
.reading-tools__font-menu{display:none;width:154px;padding:8px;border:1px solid #d6e1d8;border-radius:15px;background:#fffefa;box-shadow:0 12px 32px rgba(35,61,49,.2)}
.reading-tools__font-menu.is-open{display:grid;gap:4px}
.reading-tools__font-option{display:flex!important;flex-direction:row!important;justify-content:flex-start!important;width:100%!important;height:40px!important;padding:0 12px!important;border:0!important;border-radius:10px!important;box-shadow:none!important;background:transparent!important;font-size:14px!important}
.reading-tools__font-option.is-active{background:#e9f2eb!important;font-weight:900}
.reading-tools__font-option b{width:30px;font-size:var(--sample-size)}
.reading-tools__pdf-menu{display:none;width:min(310px,calc(100vw - 88px));max-height:min(66vh,520px);padding:10px;overflow:auto;border:1px solid #d6e1d8;border-radius:16px;background:#fffefa;box-shadow:0 14px 36px rgba(35,61,49,.24)}
.reading-tools__pdf-menu.is-open{display:grid;gap:7px}
.reading-tools__pdf-title{padding:6px 8px 4px;color:#6b7d74;font-size:12px;letter-spacing:.08em}
.reading-tools__pdf-option{display:flex!important;flex-direction:column!important;align-items:flex-start!important;width:100%!important;height:auto!important;padding:11px 12px!important;border:0!important;border-radius:11px!important;box-shadow:none!important;background:#f3f7f2!important;text-align:left!important}
.reading-tools__pdf-option:hover{background:#e5f0e7!important}
.reading-tools__pdf-option--opened{background:#fff3e9!important;color:#9b532f!important}
.reading-tools__pdf-option b{font-size:14px;line-height:1.35}
.reading-tools__pdf-option span{margin-top:4px;color:#718079;font-size:11px;font-weight:600;line-height:1.4}
.options>div[role="button"]{cursor:pointer;transition:background-color .15s ease,color .15s ease,box-shadow .15s ease}
.options>div[role="button"]:hover,.options>div[role="button"]:focus-visible{background:#edf5ef;outline:0;box-shadow:inset 3px 0 #6b9b7f}
.options>div[role="button"].is-selected{background:#e8f1ea;box-shadow:inset 3px 0 #28634f}
.options>div[role="button"].is-correct{background:#e3f3e7;color:#174e31;box-shadow:inset 3px 0 #2b8a52}
.options>div[role="button"].is-selected.is-wrong{background:#fff0ea;color:#8f3e27;box-shadow:inset 3px 0 #c96845}
/* 一体收缩（2026-08-22）：折叠态只显示切换钮；展开态全部按钮可见 */
.reading-tools--collapsed .reading-tools__button:not(.reading-tools__toggle){display:none}
.reading-tools button.reading-tools__toggle{background:#28634f;color:#fff}
.reading-tools--collapsed button.reading-tools__toggle{background:#fffefa;color:#28634f}
html[data-theme='dark'] .reading-tools button.reading-tools__toggle{background:#28634f!important;color:#fff!important}
html[data-theme='dark'] .reading-tools--collapsed button.reading-tools__toggle{background:#2c3a33!important;color:#dfe6e2!important}
@media(max-width:560px){.reading-tools{right:12px;bottom:14px;gap:8px}.reading-tools__button{width:54px;height:54px}.reading-tools__font-menu{width:146px}}
/* 番茄钟入口统一（2026-08-22 v2）：静止时只保留工具条 🍅（任何屏宽）；运行中 🍅 隐藏、右下角浮标显示倒计时 */
.reading-tools__button--tomato{display:flex}
html.tomato-running .reading-tools__button--tomato{display:none}
html.word-lookup-open{overflow:hidden}
.word-lookup{position:fixed;inset:0;z-index:100010;display:none;zoom:1!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.word-lookup.is-open{display:block}
.word-lookup__backdrop{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:rgba(18,31,25,.36);backdrop-filter:blur(2px)}
.word-lookup__sheet{position:absolute;left:50%;top:50%;width:min(440px,calc(100vw - 28px));max-height:min(680px,calc(100vh - 42px));box-sizing:border-box;overflow:auto;transform:translate(-50%,-50%);border:1px solid #d2ddd5;border-radius:8px;background:#fffefa;box-shadow:0 24px 70px rgba(18,41,29,.3);color:#1f2d26}
.word-lookup__sheet>header{position:sticky;top:0;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;padding:20px 22px 14px;border-bottom:1px solid #e2e9e3;background:#fffefa}
.word-lookup__sheet>header small{display:block;margin-bottom:4px;color:#739080;font-size:11px;font-weight:850;letter-spacing:.12em}
.word-lookup__sheet h2{margin:0;font-size:29px;line-height:1.15;overflow-wrap:anywhere;letter-spacing:0}
.word-lookup__sheet>header>button{width:34px;height:34px;padding:0;border:0;border-radius:50%;background:#edf3ee;color:#315f49;font-size:25px;line-height:1;cursor:pointer}
.word-lookup__content{padding:19px 22px 22px}
.word-lookup__loading,.word-lookup__missing{margin:4px 0 16px;color:#687b71;line-height:1.65}
.word-lookup__phonetic{margin:0 0 10px;color:#af5b33;font:700 16px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}
.word-lookup__meaning{margin:0;color:#1d2d25;font-size:17px;font-weight:720;line-height:1.75;white-space:pre-wrap}
.word-lookup__content details{margin-top:15px;border-top:1px solid #e4eae5;padding-top:12px}
.word-lookup__content details summary{color:#35634d;font-size:13px;font-weight:800;cursor:pointer}
.word-lookup__content details p{margin:9px 0 0;color:#687970;font-size:13px;line-height:1.6}
.word-lookup__context{margin-top:16px;padding:13px 14px;border-left:3px solid #d98251;background:#f8f5ee}
.word-lookup__context small{color:#8c6a56;font-size:11px;font-weight:850}
.word-lookup__context p{margin:5px 0 0;color:#4a5750;font-size:13px;line-height:1.6}
.word-lookup__actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.word-lookup__actions button{min-height:42px;padding:8px 12px;border:1px solid #bed0c3;border-radius:6px;background:#eff5f0;color:#28634f;font:800 14px/1.2 inherit;cursor:pointer}
.word-lookup__actions button.is-saved{border-color:#28634f;background:#28634f;color:#fff}
.word-lookup__source{margin:14px 0 0;color:#8b9991;font-size:11px;text-align:center}
@media(max-width:560px){.word-lookup__sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:78vh;transform:none;border-width:1px 0 0;border-radius:8px 8px 0 0}.word-lookup__sheet>header{padding:17px 18px 12px}.word-lookup__content{padding:17px 18px max(22px,env(safe-area-inset-bottom))}.word-lookup__sheet h2{font-size:26px}}
@media print{.reading-tools{display:none!important}:root{--reading-scale:1!important}body.reading-tools-enabled>:not(.reading-tools):not(#a4-mobile-download-panel){zoom:1!important}details>*{display:block!important}details>summary{display:list-item!important}}

/* ============================================================
   外院知识分享站 · 番茄钟（tomato-timer.js 配套样式）
   悬浮小番茄图标（收缩态）→ 点击展开面板 → 计时 + 白噪音
   定位：右下角，reading-tools 工具条正上方（垂直同排，不重叠）
   ============================================================ */
.tomato-timer{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.tomato-timer__toggle{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 226px);z-index:99989;box-sizing:border-box;width:58px;height:58px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid #e0b9a6;border-radius:50%;background:#fffefa;color:#a34b2e;box-shadow:0 8px 24px rgba(35,61,49,.18);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
.tomato-timer__toggle:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 12px 28px rgba(35,61,49,.24)}
.tomato-timer__toggle:active{transform:scale(.96)}
.tomato-timer__toggle.is-running{border-color:#e0503a;background:#fff6f1;animation:tomato-pulse 2s ease-in-out infinite}
.tomato-timer__icon{width:30px;height:30px;display:block}
.tomato-timer__toggle.is-running .tomato-timer__icon{width:22px;height:22px}
.tomato-timer__remain{font-size:11px;font-weight:800;line-height:1;color:#a34b2e}
@keyframes tomato-pulse{0%,100%{box-shadow:0 8px 24px rgba(35,61,49,.18)}50%{box-shadow:0 8px 28px rgba(224,80,58,.55)}}

.tomato-timer__panel{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 292px);z-index:99991;display:none;box-sizing:border-box;width:288px;max-height:min(460px,calc(100vh - 400px));overflow:auto;padding:16px 16px 14px;border:1px solid #e2d2c8;border-radius:18px;background:var(--cream,#fffefa);box-shadow:0 16px 44px rgba(35,61,49,.26);color:var(--ink,#17211f)}
.tomato-timer__panel.is-open{display:block}
.tomato-timer__panel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tomato-timer__panel header b{font-size:16px}
.tomato-timer__close{width:28px;height:28px;padding:0;border:0;border-radius:50%;background:#f3e6de;color:#a34b2e;font-size:16px;line-height:1;cursor:pointer}
.tomato-timer__time{text-align:center;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;color:var(--green,#28634f);line-height:1.15;margin:4px 0 12px}
.tomato-timer__time.is-finished{color:var(--orange,#d97845)}
.tomato-timer__presets{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.tomato-timer__chip{flex:1;min-width:52px;padding:7px 4px;border:1px solid #dfe6df;border-radius:999px;background:#f5f8f4;color:var(--muted,#73817b);font-size:13px;font-weight:700;cursor:pointer}
.tomato-timer__chip.is-active{border-color:var(--green,#28634f);background:var(--green,#28634f);color:#fff}
.tomato-timer__custom{flex:1;min-width:58px;box-sizing:border-box;padding:6px 8px;border:1px solid #dfe6df;border-radius:999px;background:#fff;color:var(--ink,#17211f);font-size:13px;text-align:center}
.tomato-timer__custom:focus{outline:2px solid rgba(40,99,79,.4);border-color:var(--green,#28634f)}
.tomato-timer__controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}
.tomato-timer__start,.tomato-timer__reset{padding:9px 0;border:0;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer}
.tomato-timer__start{background:var(--green,#28634f);color:#fff}
.tomato-timer__start.is-running{background:var(--orange,#d97845)}
.tomato-timer__reset{background:#f1e9df;color:#855735}
.tomato-timer__noise{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid #e2e9e3;border-radius:12px;background:#f7faf6;flex-wrap:wrap}

  <script>(() => {
  const escapeHtml = value => String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const withLineBreaks = value => escapeHtml(value).replace(/\n/g, '<br>');
  const mobileBrowser = () => navigator.userAgentData?.mobile || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
  const fileName = title => `${String(title || '题库').replace(/[\\/:*?"<>|]/g, '-').slice(0, 80)}-A4打印版.pdf`;
  const isAppleMobile = () => /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
  const isWeChat = () => /MicroMessenger/i.test(navigator.userAgent || '');
  let activeMobilePdfUrl = '';

  function wrapText(value, maxWidth = null) {
    const output = [];
    String(value || '').replace(/\r/g, '').split('\n').forEach(paragraph => {
      if (!paragraph) { output.push(''); return; }
      const asciiRatio = [...paragraph].filter(character => /[\u0000-\u00ff]/.test(character)).length / Math.max(1, [...paragraph].length);
      const limit = maxWidth == null ? (asciiRatio > .6 ? 56 : 47) : maxWidth;
      const tokens = paragraph.match(/\s+|[A-Za-z0-9]+(?:['’\-][A-Za-z0-9]+)*|[\u4e00-\u9fff]|[^\s]/g) || [];
      let line = '';
      let width = 0;
      let previousWord = false;
      let pendingSpace = false;
      tokens.forEach(token => {
        if (/^\s+$/.test(token)) { pendingSpace = true; return; }
        const word = /^[A-Za-z0-9]+(?:['’\-][A-Za-z0-9]+)*$/.test(token);
        const punctuation = /^[,.!?;:，。！？；：、…%‰）》】』」』\]\)}]/.test(token);
        let separator = !punctuation && (pendingSpace || (word && previousWord)) ? ' ' : '';
        const tokenWidth = textWidth(token) + textWidth(separator);
        if (line && !punctuation && width + tokenWidth > limit) {
          output.push(line.trimEnd());
          line = '';
          width = 0;
          previousWord = false;
          pendingSpace = false;
          separator = '';
        }
        line += separator + token;
        width += tokenWidth;
        previousWord = word;
        pendingSpace = false;
      });
      if (line) output.push(line.trimEnd());
    });
    return output;
  }

  function textWidth(value) { return [...String(value || '')].reduce((width, character) => width + (/[^\u0000-\u00ff]/.test(character) ? 1 : .55), 0); }
  function optionRows(options) { const entries = (options || []).map((option, index) => `${String.fromCharCode(65 + index)}. ${option}`); if (!entries.length) return []; if (entries.length <= 4 && entries.reduce((width, entry) => width + textWidth(entry), 0) + (entries.length - 1) * 2 <= 47) return [{entries, columns: entries.length}]; const rows = []; for (let index = 0; index < entries.length; index += 2) { const left = wrapText(entries[index], 21); const right = entries[index + 1] ? wrapText(entries[index + 1], 21) : []; const count = Math.max(left.length, right.length); for (let line = 0; line < count; line++) rows.push({entries: [left[line] || '', right[line] || ''], columns: 2}); } return rows; }

  function prepareQuestions(source) {
    const prepared = [];
    (source || []).forEach(item => {
      const question = String(item.question || '').trim();
      const match = question.match(/^(.*?)[（(]\s*空格\s*([ivxlcdm\d]+)\s*[）)]\s*$/i);
      const base = match ? match[1].trim() : question;
      const label = match ? `空格 ${match[2]}` : '';
      const previous = prepared[prepared.length - 1];
      if (label && previous && previous.type === item.type && previous.question === base && previous.optionGroups) {
        previous.optionGroups.push({label, options: item.options || []});
        previous.answer = `${previous.answer}；${label.replace('空格 ', '')}：${cleanAnswer(item.answer)}`;
        return;
      }
      prepared.push({
        ...item,
        question: base,
        answer: label ? `${label.replace('空格 ', '')}：${cleanAnswer(item.answer)}` : cleanAnswer(item.answer),
        optionGroups: label ? [{label, options: item.options || []}] : null,
      });
    });
    return prepared;
  }

  function buildPages({title, subtitle, questions, mode = 'standard'}) {
    questions = prepareQuestions(questions);
    const pages = [];
    let page;
    let section = '';
    let continuation = false;

    function startPage() {
      page = {title, subtitle, section: continuation ? `${section}（续）` : section, lines: [], y: 730};
      pages.push(page);
      continuation = true;
    }

    function addLine(text, size = 10.5, gap = 15) {
      if (!page) startPage();
      if (page.y - gap < 54) startPage();
      if (text) page.lines.push({text, size, y: page.y});
      page.y -= gap;
    }

    function addText(text, size = 10.5, gap = 15, maxWidth = null) {
      wrapText(text, maxWidth).forEach(line => addLine(line, size, gap));
    }

    function addOptions(options) {
      optionRows(options).forEach(row => {
        const size = row.columns === 4 ? 9.5 : 10.5;
        const gap = row.columns === 4 ? 15 : 16;
        if (!page) startPage();
        if (page.y - gap < 54) startPage();
        page.lines.push({kind: 'options', entries: row.entries, columns: row.columns, size, y: page.y});
        page.y -= gap;
      });
    }

    function addOptionGroupLabel(label) {
      if (!page) startPage();
      if (page.y - 20 < 54) startPage();
      page.lines.push({kind: 'option-label', text: label, size: 9, y: page.y});
      page.y -= 14;
    }

    function addModuleHeading(type) {
      const heading = String(type || '').trim();
      if (!heading) return;
      if (!page) startPage();
      if (page.y - 30 < 54) startPage();
      page.lines.push({kind: 'module', text: heading, size: 10, y: page.y});
      page.y -= 18;
    }

    function addBank(text) {
      const bankLines = wrapText(text, 47);
      if (!page) startPage();
      // 保留 bank 与其后首题同页：预留提示行 + 约一题的空间，避免提示孤悬页尾（Codex review P2）
      if (page.y - (bankLines.length * 13 + 44) < 54) startPage();
      bankLines.forEach(line => {
        page.lines.push({kind: 'bank', text: line, size: 9.5, y: page.y});
        page.y -= 13;
      });
      addLine('', 10.5, 8);
    }

    section = mode === 'memorize' ? '题目与答案' : '题目';
    continuation = false;
    startPage();
    let previousType = '';
    let lastBank = '';
    questions.forEach((item, index) => {
      const currentType = String(item.type || '').trim();
      if (currentType && currentType !== previousType) addModuleHeading(currentType);
      previousType = currentType;
      const bank = String(item.bank || '').trim();
      if (bank && bank !== lastBank) { addBank(bank); lastBank = bank; }
      addText(`${index + 1}. ${item.question || ''}`, 10.5, 16);
      if (item.optionGroups) item.optionGroups.forEach(group => { addOptionGroupLabel(group.label); addOptions(group.options); });
      else addOptions(item.options);
      if (mode === 'memorize') {
        addLine('', 10.5, 5);
        addText(`答案：${cleanAnswer(item.answer)}`, 10.5, 16);
      }
      addLine('', 10.5, 10);
    });

    if (mode !== 'memorize') {
      section = '参考答案';
      continuation = false;
      startPage();
      previousType = '';
      questions.forEach((item, index) => {
        const currentType = String(item.type || '').trim();
        if (currentType && currentType !== previousType) addModuleHeading(currentType);
        previousType = currentType;
        addText(`${index + 1}. ${cleanAnswer(item.answer)}`, 10.5, 16);
        addLine('', 10.5, 10);
      });
    }
    return pages;
  }

  function cleanAnswer(value) {
    const answer = String(value || '').trim().replace(/^(?:(?:查看)?参考答案\s*[:：]?\s*)+/i, '');
    if (/教师用书对应页未提供本题答案|暂不作推测/.test(answer)) return '原书未提供答案';
    return answer || '原书未提供答案';
  }

  function unicodeHex(value) {
    let hex = '';
    for (const character of String(value || '')) {
      const code = character.codePointAt(0);
      hex += (code > 0xffff ? 0x3f : code).toString(16).padStart(4, '0');
    }
    return hex || '0020';
  }

  function textCommand(text, x, y, size) {
    return `BT\n/F1 ${size} Tf\n1 0 0 1 ${x} ${y} Tm\n<${unicodeHex(text)}> Tj\nET\n`;
  }

  function pdfBytes(options) {
    const pages = buildPages(options);
    const objects = [];
    const pageIds = pages.map((_, index) => 5 + index * 2);
    objects[1] = '<< /Type /Catalog /Pages 2 0 R >>';
    objects[2] = `<< /Type /Pages /Kids [${pageIds.map(id => `${id} 0 R`).join(' ')}] /Count ${pages.length} >>`;
    objects[3] = '<< /Type /Font /Subtype /Type0 /BaseFont /STSong-Light /Encoding /UniGB-UCS2-H /DescendantFonts [4 0 R] >>';
    objects[4] = '<< /Type /Font /Subtype /CIDFontType0 /BaseFont /STSong-Light /CIDSystemInfo << /Registry (Adobe) /Ordering (GB1) /Supplement 4 >> /DW 1000 >>';

    pages.forEach((page, index) => {
      const pageId = pageIds[index];
      const contentId = pageId + 1;
      const header = [
        textCommand('外院 · 知识分享站', 42, 807, 8.5),
        textCommand(page.title, 42, 786, 16),
        page.subtitle ? textCommand(page.subtitle, 42, 770, 8.5) : '',
        textCommand(page.section, 42, 748, 14),
      ].join('');
      const body = page.lines.map(line => textCommand(line.text, 42, line.y, line.size)).join('');
      const footer = textCommand(`A4 打印版 · 第 ${index + 1} / ${pages.length} 页`, 42, 34, 8);
      const stream = `${header}${body}${footer}`;
      objects[pageId] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${contentId} 0 R >>`;
      objects[contentId] = `<< /Length ${stream.length} >>\nstream\n${stream}endstream`;
    });

    let pdf = '%PDF-1.4\n% A4 question bank\n';
    const offsets = [0];
    const maxId = objects.length - 1;
    for (let id = 1; id <= maxId; id++) {
      offsets[id] = pdf.length;
      pdf += `${id} 0 obj\n${objects[id]}\nendobj\n`;
    }
    const xrefOffset = pdf.length;
    pdf += `xref\n0 ${maxId + 1}\n0000000000 65535 f \n`;
    for (let id = 1; id <= maxId; id++) pdf += `${String(offsets[id]).padStart(10, '0')} 00000 n \n`;

  function copyCurrentAddress(button) {
    const address = location.href.split('#')[0];
    const done = () => {
      button.textContent = '网址已复制，请到浏览器粘贴打开';
      button.style.background = '#28634f';
    };
    if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(address).then(done).catch(() => fallbackCopy(address, done));
    fallbackCopy(address, done);
  }

  function fallbackCopy(value, done) {
    const input = document.createElement('textarea');
    input.value = value;
    input.setAttribute('readonly', '');
    input.style.cssText = 'position:fixed;left:-9999px;top:0;';
    document.body.appendChild(input);
    input.select();
    try { document.execCommand('copy'); done(); }
    catch (_) { alert(`请复制网址后到手机浏览器打开：\n${value}`); }
    input.remove();
  }

  async function downloadMobilePdf(options) {
    try {
      const blob = new Blob([portablePdfBytes(options)], {type: 'application/pdf'});
      const name = fileName(options.title);
      const nd = window.WaiyuanNativeDownload;
      if (nd && nd.isNative && nd.isNative()) {
        // Capacitor App：WebView 无法下载 blob，走原生保存桥（保存到手机「下载」目录）
        const ok = await nd.saveBlob(name, blob).catch(() => false);
        if (ok) {
          showNativeSavedTip('PDF 已保存到手机「下载」目录', name);
          return;
        }
        // 原生保存失败时回退旧逻辑（桌面浏览器等）
      }
      const url = URL.createObjectURL(blob);
      removeMobileDownloadPanel();
      activeMobilePdfUrl = url;
      showMobileDownloadPanel(url, name);
      if (!isAppleMobile()) triggerDownload(url, name);
      setTimeout(() => { if (activeMobilePdfUrl === url) removeMobileDownloadPanel(); }, 10 * 60 * 1000);
    } catch (error) {
      alert('PDF 生成失败，请稍后重试。');
      console.error(error);
    }
  }

  function open(options = {}) {
    const normalized = {...options, subtitle: options.subtitle || '', questions: options.questions || []};
    if (!normalized.questions.length) {

  const persist = () => { try { localStorage.setItem(storeKey, JSON.stringify(saved)); } catch (error) { console.warn('计算机刷题: 保存失败', error); showPersistWarning(); } };
  const getBank = key => banks.find(bank => bank.key === key);
  const bankQuestions = () => paper ? paper.questions : (getBank(bankKey)?.questions || []);
  const questionKey = question => paper ? `paper-${paper.key}-${question.id}` : `${bankKey}-${question.type}-${question.id}`;
  const questionToken = question => paper ? `${paper.key}--${question.id}` : `${question.type}--${question.id}`;
  const stateFor = question => saved.progress?.[questionKey(question)] || {};
  const ensure = () => { if (!saved.progress) saved.progress = {}; if (!saved.papers) saved.papers = {}; };
  // First-time visitors have no localStorage state yet.  Initialize it before
  // any option/answer interaction so the very first tap can be persisted.
  ensure();
  persist();
  const escape = text => String(text || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const displayText = text => escape(text).replace(/\n/g, '<br>');
  // Remove source-document answer blanks such as "（ ）" only when they
  // appear at the very end of an option; normal brackets in the text remain.
  const optionText = text => String(text || '').replace(/\s*[（(]\s*[）)]\s*$/, '');
  const answerMarker = /([（(]\s*[一二三四五六七八九十\d]+\s*[）)]|[一二三四五六七八九十]+、|[①②③④⑤⑥⑦⑧⑨⑩])/g;
  const answerLine = text => escape(text).replace(/([（(]\s*\d+\s*分\s*[）)])/g, '<span class="score">$1</span>');
  // Only numbered outline markers with explicit punctuation are candidates.
  // This deliberately excludes prose such as “第一次”“第一位”.
  // Deliberately accept only formal enumerators, never words such as
  // “第一次”“第一粒扣子”“第一阶段”.
  const wordAnswerMarker = /(第[一二三四五六七八九十]+(?:、|，|,|：|:)|[一二三四五六七八九十]+是(?:、|，|,|：|:))/g;
  const repeatedLead = '(?:意味着|表明|说明|体现|要求|有利于|必须|需要|坚持|促进|推动|反映|标志着|关键是|核心是|根本是)';
  const allAnswerMarkers = new RegExp(`${answerMarker.source}|${wordAnswerMarker.source}`, 'g');

  // Short labels such as “内容：”“意义：”“教训：” are answer section
  // headings, even where the source document omitted a number before them.
  const sectionHeadingNames = '根本原因|主要原因|直接原因|原因|内容|意义|教训|启示|结论|特点|表现|作用|要求|原则|措施|途径|本质|实质|内涵|关系|影响|任务|目标|重点|关键|基础|保证';

  function findParallelSemicolonLead(source) {
    const leads = source.split(/[；;]/).map(part => part.trim().replace(scorePrefix, '')).map(part => part.match(parallelLead)?.[1]).filter(Boolean);
    return [...new Set(leads)].find(lead => leads.filter(item => item === lead).length >= 2) || '';
  }
  // Detect repeated sentence-openers such as “马克思主义是…” or
  // “法治思维以…”.  A prefix must occur at least twice after a sentence
  // boundary, preventing ordinary long prose from being split.
  function findRepeatedPhraseLead(source) {
    const clauses = source.split(/[。；;]/).map(part => part.trim().replace(scorePrefix, '')).filter(Boolean);
    const candidates = clauses.map(part => {
      const matched = part.match(/^([\u4e00-\u9fff]{2,10}(?:是|以|要|应当|必须|需要|具有|坚持|通过|反映|体现|表明|意味着))/);

  }

  const hasParallelWordOutline = source => {
    const first = /第[一二三四五六七八九十]+(?:、|，|,|：|:)/.test(source) && /第[二三四五六七八九十]+(?:、|，|,|：|:)/.test(source);
    const second = /[一二三四五六七八九十]是(?:、|，|,|：|:)/.test(source) && /[二三四五六七八九十]是(?:、|，|,|：|:)/.test(source);
    return first || second;
  };
  function formatAnswer(answer) {
    const source = String(answer || '').replace(/\r/g, '').trim();
    if (!source) return '<p class="answer-lead">原文未提供标准答案，请结合教材复习。</p>';
    const hasRepeatedLead = (source.match(new RegExp(repeatedLead, 'g')) || []).length > 1;
    const markerPattern = hasParallelWordOutline(source) ? allAnswerMarkers : answerMarker;
    const startPattern = hasParallelWordOutline(source) ? answerStartMarker : new RegExp(`^(?:${answerMarker.source})`);
    const semicolonLead = findParallelSemicolonLead(source);

    const semicolonSeparator = semicolonLead ? new RegExp(`([；;])\\s*(([（(]\\s*\\d+\\s*分\\s*[）)])\\s*)?(?=${semicolonLead})`, 'g') : /$^/;

    const prepared = source.replace(markerPattern, match => `\n${match}`).replace(hasRepeatedLead ? repeatedAfterSemicolon : /$^/, '$1\n').replace(sectionHeadingAfterScore, '$1\n@@SECTION@@$2：\n').replace(semicolonSeparator, '$2\n').replace(phraseSeparator, '$2\n').replace(phraseStart, match => `\n${match}`);

      const parallel = !matched && !repeated && semicolonLead && part.replace(scorePrefix, '').startsWith(semicolonLead);

      if (parallel) {
        const prefix = part.match(scorePrefix)?.[0] || '';
        const text = part.slice(prefix.length);

      }
      if (phrase) {
        const prefix = part.match(scorePrefix)?.[0] || '';

        return `<div class="answer-item level-one parallel-item"><span class="answer-marker">${escape(phraseLead)}</span><span class="answer-content">${answerLine(content)}</span></div>`;

      return `<div class="answer-item ${level}"><span class="answer-marker">${escape(marker)}</span><span class="answer-content">${answerLine(body)}</span></div>`;

  }
  const shuffle = list => { const copy = [...list]; for (let i = copy.length - 1; i; i--) { const j = Math.floor(Math.random() * (i + 1)); [copy[i], copy[j]] = [copy[j], copy[i]]; } return copy; };

  function summary(bank) {

  function renderHome() {

  function findQuestion(id) { return bankQuestions().find(question => questionToken(question) === String(id)); }
  function printableQuestion(question) {

  }
  function printableAnswer(question) {
    const answer = String(question.answer || '').trim();

    const letters = (answer.match(/^[A-Z]+/i)?.[0].toUpperCase().split('') || []).filter(l => l.charCodeAt(0) - 65 < (question.options || []).length);

  }

    const pending = language === 'en' ? '当前专四精简词库暂未收录该词。' : '该语种词典适配已启用，精简词典数据将在下一阶段导入。';

  function lookupFavoriteKey(token) {

        return !!progress.words?.[lookupFavoriteKey(token)]?.favorite;
      }
      const saved = JSON.parse(localStorage.getItem(LOOKUP_STORAGE_KEY)) || {};
      return !!saved[lookupFavoriteKey(token)];
    } catch (_) {
      return false;

  function toggleLookupFavorite() {
    if (!activeLookup) return;
    const key = lookupFavoriteKey(activeLookup);
    try {
      if (activeLookup.entry?.id && activeLookup.entry?.bookKey) {
        const progress = JSON.parse(localStorage.getItem(VOCABULARY_STORAGE_KEY)) || {};
        if (!progress.words) progress.words = {};
        const current = progress.words[key] || {reps: 0, interval: 0, lapses: 0, due: new Date().toISOString().slice(0, 10)};
        progress.words[key] = {...current, favorite: !current.favorite};
        localStorage.setItem(VOCABULARY_STORAGE_KEY, JSON.stringify(progress));
      } else {
        const saved = JSON.parse(localStorage.getItem(LOOKUP_STORAGE_KEY)) || {};
        if (saved[key]) delete saved[key];
        else saved[key] = {word: activeLookup.word, language: activeLookup.language, context: activeLookup.context, savedAt: new Date().toISOString()};
        localStorage.setItem(LOOKUP_STORAGE_KEY, JSON.stringify(saved));

    if (utterance.lang === 'en-US') {
      try {
        const voices = speechSynthesis.getVoices() || [];
        utterance.voice = voices.find(v => /en[-_]us/i.test(v.lang) && /samantha|google us english|microsoft/i.test(v.name || ''))
          || voices.find(v => /^en/i.test(v.lang)) || null;
      } catch (_) {}
    }
    speechSynthesis.speak(utterance);

  function buildPdfMenu(books) {
    const menu = document.createElement('div');
    menu.className = 'reading-tools__pdf-menu';
    const heading = document.createElement('strong');
    heading.className = 'reading-tools__pdf-title';
    heading.textContent = '选择 PDF 范围';
    menu.appendChild(heading);

    const openedButton = document.createElement('button');
    openedButton.type = 'button';
    openedButton.className = 'reading-tools__pdf-option reading-tools__pdf-option--opened';
    openedButton.innerHTML = '<b>已展开单元</b><span>导出当前展开的一个或多个 Unit</span>';
    openedButton.addEventListener('click', () => {
      menu.classList.remove('is-open');
      exportPdf();

    books.forEach(book => {
      const bookTitle = book.querySelector(':scope > h2')?.textContent?.trim() || book.id;
      const count = book.querySelectorAll('article .q').length;
      const option = document.createElement('button');
      option.type = 'button';
      option.className = 'reading-tools__pdf-option';
      option.innerHTML = `<b>${escapeHtml(bookTitle)} · 整本书</b><span>${count} 个作答项，包含本书全部单元</span>`;
      option.addEventListener('click', () => {

  function exportPdf(book = null, bookTitle = '') {
    if (book) {
      const questions = extractQuestions(book);
      openPdf({
        title: `${document.title.replace(/\s*[·|｜].*$/, '')} · ${bookTitle}`,
        subtitle: `整本书 · 共 ${questions.length} 个作答项`,
        questions,
      });
      return;
    }
    const openedUnits = [...document.querySelectorAll('details[open]')]
      .filter(item => item.querySelector('article .q'));
    const scopes = openedUnits.length ? openedUnits : [document];
    const questions = scopes.flatMap(scope => extractQuestions(scope));
    if (!questions.length) {
      alert('当前页面没有识别到可导出的题目。');
      return;
    }
    if (!openedUnits.length && questions.length > 250) {
      alert(`当前题库共有 ${questions.length} 题。为避免手机生成超大文件，请先展开需要的一个或多个 Unit，再点击“PDF 下载”。`);
      return;
    }
    const firstUnit = openedUnits[0]?.querySelector(':scope > summary')?.textContent?.trim();
    const title = firstUnit ? `${document.title.replace(/\s*[·|｜].*$/, '')} · ${firstUnit}` : document.title;
    openPdf({title, subtitle: openedUnits.length ? `已展开 ${openedUnits.length} 个单元` : '当前题库', questions});
  }

  function openPdf(options) {
    if (window.A4QuestionPrint?.open) return window.A4QuestionPrint.open(options);
    const nd = window.WaiyuanNativeDownload;
    if (nd && nd.isNative && nd.isNative()) {
      alert('App 内不支持系统打印，请使用题库页的「PDF 下载 / 导出」功能保存文件。');
      return;
    }
    window.print();
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char]));
  }

  function extractQuestions(scope) {
    return [...scope.querySelectorAll('article')].map(article => {
      const questionNode = article.querySelector('.q pre, .q .question, .question');
      if (!questionNode) return null;
      const options = [...article.querySelectorAll('.options > div, .options .option')]
        .map(item => item.textContent.replace(/^\s*[A-Z][.．、]\s*/, '').trim())
        .filter(Boolean);
      const answerNode = article.querySelector('.answer p, .answer');
      const moduleTitle = article.closest('.exercise-module')?.querySelector('h3, .exercise-module-title')?.textContent?.trim() || '';
      return {
        type: moduleTitle,
        question: questionNode.textContent.trim(),
        options,
        answer: answerNode?.textContent?.trim() || '原文未提供参考答案。',
      };
    }).filter(Boolean);
  }
})();

  <script>/* ============================================================
   外院知识分享站 · 番茄钟（全站悬浮工具）
   - 右下角小番茄图标（可收缩：点击开合面板）
   - 预设/自定义时长倒计时（真实时间，interval 漂移免疫）
   - 计时期间可选择白噪音（Web Audio 实时生成：白噪音/雨声/粉红噪音）
   - 结束提示音 + 页面隐藏时系统通知（不主动申请权限）
   依赖：无（离线可用，单文件版同样生效）
   ============================================================ */
(() => {
  if (window.__WAIYUAN_TOMATO__) return;
  window.__WAIYUAN_TOMATO__ = true;

  const LS_KEY = 'waiyuan-tomato-v1';
  const loadPrefs = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (_) { return {}; } };
  const savePrefs = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(prefs)); } catch (_) {} };
  const prefs = loadPrefs();

  let currentMinutes = prefs.minutes && prefs.minutes > 0 ? Math.min(prefs.minutes, 120) : 25;
  let noiseOn = !!prefs.noise;
  let noiseKind = prefs.noiseKind === 'rain' || prefs.noiseKind === 'pink' ? prefs.noiseKind : 'white';
  let noiseVolume = typeof prefs.noiseVolume === 'number' ? Math.min(Math.max(prefs.noiseVolume, 0), 1) : 0.4;

  let timer = null;
  let endAt = 0;
  let remainMs = currentMinutes * 60000;
  let running = false;
  let audioCtx = null;
  let noiseNodes = null;

  const wrap = document.createElement('div');

        <ellipse cx="32" cy="39" rx="19" ry="17" fill="#e0503a"/>
        <ellipse cx="25" cy="33" rx="6" ry="3.5" fill="#ff8a6b" opacity=".5" transform="rotate(-25 25 33)"/>
        <rect x="30.8" y="9.5" width="2.4" height="9.5" rx="1.2" fill="#3f8f4e"/>
        <g fill="#4c9e55">
          <ellipse cx="32" cy="21.5" rx="2.8" ry="5"/>
          <ellipse cx="26.5" cy="22.5" rx="2.6" ry="4.6" transform="rotate(-50 26.5 22.5)"/>
          <ellipse cx="37.5" cy="22.5" rx="2.6" ry="4.6" transform="rotate(50 37.5 22.5)"/>
          <ellipse cx="23.5" cy="26.5" rx="2.4" ry="4.2" transform="rotate(-28 23.5 26.5)"/>
          <ellipse cx="40.5" cy="26.5" rx="2.4" ry="4.2" transform="rotate(28 40.5 26.5)"/>
        </g>
      </svg>
      <span class="tomato-timer__remain"></span>
    </button>
    <section class="tomato-timer__panel" role="dialog" aria-label="番茄钟">
      <header><b>🍅 番茄钟</b><button type="button" class="tomato-timer__close" aria-label="关闭">×</button></header>
      <div class="tomato-timer__time" role="timer">25:00</div>
      <div class="tomato-timer__presets">
        <button type="button" class="tomato-timer__chip" data-min="15">15 分</button>
        <button type="button" class="tomato-timer__chip" data-min="25">25 分</button>
        <button type="button" class="tomato-timer__chip" data-min="45">45 分</button>
        <input class="tomato-timer__custom" type="number" min="1" max="120" placeholder="自定义(分)" inputmode="numeric">
      </div>
      <div class="tomato-timer__controls">
        <button type="button" class="tomato-timer__start">开始</button>
        <button type="button" class="tomato-timer__reset">重置</button>
      </div>
      <div class="tomato-timer__noise">
        <label class="tomato-timer__noise-label"><input type="checkbox" class="tomato-timer__noise-check">白噪音</label>
        <select class="tomato-timer__kind" aria-label="白噪音音色">
          <option value="white">白噪音</option>
          <option value="rain">雨声</option>
          <option value="pink">粉红噪音</option>
        </select>
        <input class="tomato-timer__volume" type="range" min="0" max="100" value="40" aria-label="音量">
      </div>
      <p class="tomato-timer__hint">计时结束有提示音；白噪音由浏览器实时生成，无需联网，可边刷题边听。</p>
    </section>`;
  document.body.appendChild(wrap);

  const toggle = wrap.querySelector('.tomato-timer__toggle');
  const panel = wrap.querySelector('.tomato-timer__panel');
  const timeEl = wrap.querySelector('.tomato-timer__time');
  const remainEl = wrap.querySelector('.tomato-timer__remain');
  const chips = [...wrap.querySelectorAll('.tomato-timer__chip')];
  const customEl = wrap.querySelector('.tomato-timer__custom');
  const startBtn = wrap.querySelector('.tomato-timer__start');
  const resetBtn = wrap.querySelector('.tomato-timer__reset');
  const noiseCheck = wrap.querySelector('.tomato-timer__noise-check');
  const kindSel = wrap.querySelector('.tomato-timer__kind');
  const volumeEl = wrap.querySelector('.tomato-timer__volume');

  /* ---------- 显示 ---------- */
  const fmt = ms => {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  };

    customEl.value = chips.some(chip => Number(chip.dataset.min) === currentMinutes) ? '' : currentMinutes;
    noiseCheck.checked = noiseOn;

  }

  /* ---------- 计时 ---------- */
  function tick() {
    const left = endAt - Date.now();
    if (left <= 0) { finish(); return; }
    render();
    renderToggle();
    document.title = `🍅 ${fmt(left)} · ${originalTitle}`;
  }
  function start() {
    if (running) { pause(); return; }
    if (remainMs <= 0) remainMs = currentMinutes * 60000;
    endAt = Date.now() + remainMs;
    running = true;
    timer = setInterval(tick, 500);
    tick();
    if (noiseOn) ensureNoise();
    updateUI();
  }
  function pause() {
    if (!running) return;
    remainMs = endAt - Date.now();
    running = false;
    clearInterval(timer); timer = null;
    restoreTitle();
    stopNoise();
    updateUI();
  }
  function reset() {
    running = false;
    clearInterval(timer); timer = null;
    remainMs = currentMinutes * 60000;
    restoreTitle();
    stopNoise();
    updateUI();
  }
  function finish() {
    running = false;
    clearInterval(timer); timer = null;
    remainMs = 0;
    restoreTitle();

    }
    updateUI();
  }
  function setMinutes(m) {
    if (!Number.isFinite(m)) return;
    const clamped = Math.min(Math.max(Math.round(m), 1), 120);
    if (running || remainMs === currentMinutes * 60000) remainMs = clamped * 60000;
    currentMinutes = clamped;
    prefs.minutes = clamped;
    savePrefs();
    updateUI();
  }

  /* ---------- 白噪音（Web Audio 实时生成） ---------- */
  function ensureNoise() {
    if (noiseNodes || !noiseOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const rate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, rate * 2, rate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.loop = true;
      let tail = src;
      if (noiseKind === 'rain') {
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 900; filter.Q.value = 0.5;
        src.connect(filter); tail = filter;
      } else if (noiseKind === 'pink') {
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 1500;
        src.connect(filter); tail = filter;
      }
      const gain = audioCtx.createGain();
      gain.gain.value = noiseVolume;
      tail.connect(gain);
      gain.connect(audioCtx.destination);
      src.start();
      noiseNodes = { src, gain };
    } catch (_) { /* 音频不可用则静默忽略 */ }
  }
  function stopNoise() {
    if (!noiseNodes) return;
    try { noiseNodes.src.stop(); } catch (_) {}
    noiseNodes = null;
  }
  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [880, 880, 1174];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const t0 = audioCtx.currentTime + i * 0.28;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.35, t0 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.26);
      });
    } catch (_) {}
  }

  /* ---------- 事件 ---------- */
  toggle.addEventListener('click', () => {
    const open = panel.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  wrap.querySelector('.tomato-timer__close').addEventListener('click', () => {
    panel.classList.remove('is-open');
    toggle.setAttribute('aria-expanded', 'false');
  });
  chips.forEach(chip => chip.addEventListener('click', () => setMinutes(Number(chip.dataset.min))));
  customEl.addEventListener('change', () => { const v = parseInt(customEl.value, 10); if (Number.isFinite(v)) setMinutes(v); });
  startBtn.addEventListener('click', start);
  resetBtn.addEventListener('click', reset);
  noiseCheck.addEventListener('change', () => {
    noiseOn = noiseCheck.checked;
    prefs.noise = noiseOn;
    savePrefs();
    if (noiseOn && running) ensureNoise();
    if (!noiseOn) stopNoise();
  });
  kindSel.addEventListener('change', () => {
    noiseKind = kindSel.value;
    prefs.noiseKind = noiseKind;
    savePrefs();
    if (noiseOn && running) { stopNoise(); ensureNoise(); }
  });

    prefs.noiseVolume = noiseVolume;
    savePrefs();

  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) renderToggle(); });

  updateUI();
})();

  <script>(() => {
  const KEY = 'waiyuan-unified-web-study-v1';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {version:1,progress:{},favorites:{}}; } catch (_) { return {version:1,progress:{},favorites:{}}; } };
  // 本地存储失败提示：隐私模式/空间不足时进度会丢，至少让用户知道（每页一次，不刷屏）
  let saveWarned = false;
  const warnSaveFailed = () => {
    if (saveWarned) return;
    saveWarned = true;
    const notice = document.createElement('div');
    notice.className = 'unified-focus-notice';
    notice.setAttribute('role', 'alert');
    notice.textContent = '⚠ 本地保存失败（浏览器存储不可用或空间不足），答题进度可能无法保存。可到学习中心「导出学习数据」备份。';
    const close = document.createElement('button');
    close.type = 'button';
    close.textContent = '知道了';
    close.addEventListener('click', () => notice.remove());
    notice.appendChild(close);
    document.body.appendChild(notice);
    setTimeout(() => notice.remove(), 10000);
  };
  const save = state => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (error) { console.warn('统一引擎: 保存失败', error); warnSaveFailed(); }
  };
  const state = load(); if (!state.progress) state.progress = {}; if (!state.favorites) state.favorites = {};
  const clean = text => String(text || '').replace(/\s+/g, ' ').trim();
  const hash = text => { let value = 2166136261; for (const char of text) value = Math.imul(value ^ char.charCodeAt(0), 16777619); return (value >>> 0).toString(36); };
  const pageKey = location.pathname.replace(/\/index\.html$/i, '').replace(/[^a-z0-9\u4e00-\u9fff]+/gi, '-');

    else legacyCopy(text);
  }
  function legacyCopy(text) {
    try {
      const area = document.createElement('textarea');

  }
  function showFeedbackNotice(message, mailtoHref) {

    notice.className = 'unified-feedback-notice';
    notice.setAttribute('role', 'status');
    const close = document.createElement('button');

    close.textContent = '知道了';

    const title = questionText(card);
    if (!title) return;
    // 答案提取：<details class="answer"> 的 summary（如「查看参考答案」）不算答案内容，先剥掉
    const answerNode = card.querySelector('.answer');
    let answer = '';
    if (answerNode) {
      const clone = answerNode.cloneNode(true);
      clone.querySelector('summary')?.remove();
      answer = clean(clone.textContent);
    }
    const scope = card.dataset.unifiedScope || 'bank';  // 'bank'（普通题库）| 'paper'（模拟卷）
    // 稳定身份：优先卡片 id（题库题号如 q-single--87）；渲染顺序 index 会随
    // 筛选/加载更多变化，导致同一道题在不同视图下拿到不同 key（进度/收藏碎片化）。
    const stableId = card.id && card.id !== 'main' ? card.id : title;
    const key = `${pageKey}-${hash(`${stableId}-${title}`)}`;
    card.dataset.unifiedReady = key;
    card.dataset.unifiedTitle = title;
    // 纠错反馈：先选问题类型，再复制/提交给站长（有云端 API 时优先提交）
    const submitFeedback = async (type, note = '') => {
      const apiBase = window.WAIYUAN_API_BASE;
      if (apiBase) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 5000);
          const res = await fetch(`${apiBase}/api/feedback`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ page: document.title, question: title, answer, type, note: note.slice(0, 100) }),
            signal: controller.signal
          });
          clearTimeout(timer);
          if (res.ok) { showFeedbackNotice('纠错信息已提交，感谢反馈！'); return; }
        } catch (_) { /* 云端不可达，走复制兜底 */ }
      }
      const body = `【题目纠错】\n页面：${document.title}\n链接：${location.href}\n问题类型：${type}\n题干：${title}\n当前答案：${answer}${note ? `\n具体说明：${note}` : ''}\n\n问题描述：`;
      const email = window.WAIYUAN_FEEDBACK_EMAIL || '';
      copyText(body);
      showFeedbackNotice(
        `已复制纠错信息，粘贴发送给站长即可${email ? '，或点「发邮件」直接提交' : ''}。`,
        email ? `mailto:${email}?subject=${encodeURIComponent('题目纠错 · ' + document.title)}&body=${encodeURIComponent(body)}` : null
      );
    };
    if (!card.querySelector('.unified-feedback')) {
      const feedback = document.createElement('button');
      feedback.type = 'button';
      feedback.className = 'unified-feedback';
      feedback.textContent = '⚠ 纠错';
      feedback.addEventListener('click', event => {
        event.stopPropagation();
        const existing = document.querySelector('.unified-feedback-menu');
        if (existing) { existing.remove(); return; }
        const menu = document.createElement('div');
        menu.className = 'unified-feedback-menu';
        menu.setAttribute('role', 'menu');
        const label = document.createElement('span');
        label.className = 'ufm-label';
        label.textContent = '问题类型：';
        menu.appendChild(label);
        let selectedType = '';
        ['答案错误', '题目重复', '题干不完整', '排版问题'].forEach(type => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'ufm-type';
          item.textContent = type;
          item.addEventListener('click', () => {
            selectedType = type;
            menu.querySelectorAll('.ufm-type').forEach(b => b.classList.remove('selected'));
            item.classList.add('selected');
          });
          menu.appendChild(item);
        });
        const noteInput = document.createElement('textarea');
        noteInput.className = 'ufm-note';
        noteInput.maxLength = 100;
        noteInput.rows = 3;
        noteInput.placeholder = '具体说明（100 字以内，可选）';
        menu.appendChild(noteInput);
        const submit = document.createElement('button');
        submit.type = 'button';
        submit.className = 'ufm-submit';
        submit.textContent = '提交纠错';
        submit.addEventListener('click', () => {
          if (!selectedType) { noteInput.classList.add('missing'); noteInput.focus(); return; }
          menu.remove();
          submitFeedback(selectedType, noteInput.value.trim());
        });
        menu.appendChild(submit);
        document.body.appendChild(menu);
        positionFeedbackMenu(menu, feedback);
      });
      card.appendChild(feedback);
    }
    if (card.querySelector('.favorite-button,[data-action="favorite"]')) return;
    const button = document.createElement('button');
    button.className = `unified-favorite ${state.favorites[key] ? 'active' : ''}`;
    button.textContent = state.favorites[key] ? '★ 已收藏' : '☆ 收藏题目';
    button.addEventListener('click', event => {
      event.stopPropagation();
      if (state.favorites[key]) delete state.favorites[key];
      else state.favorites[key] = {key,title,answer,page:document.title,path:location.pathname,scope,updatedAt:Date.now()};
      save(state); button.classList.toggle('active', !!state.favorites[key]); button.textContent = state.favorites[key] ? '★ 已收藏' : '☆ 收藏题目';
    });
    card.appendChild(button);
  }

  // —— 浏览记录：题目进入视口停留约 1 秒记为「已浏览」（viewed），
  //    快速划过不算；5 分钟内重复浏览不重复计数 ——
  function markViewed(card) {
    const key = card.dataset.unifiedReady;
    if (!key) return;
    const old = state.progress[key] || {};
    const now = Date.now();
    state.progress[key] = {
      ...old,
      key,
      title: card.dataset.unifiedTitle || questionText(card) || old.title || '',
      page: document.title,
      path: location.pathname,
      scope: card.dataset.unifiedScope || old.scope || 'bank',
      viewed: true,
      viewCount: (old.viewCount || 0) + (old.lastViewedAt && now - old.lastViewedAt < 5 * 60 * 1000 ? 0 : 1),
      lastViewedAt: now,
      updatedAt: now
    };
    save(state);
  }
  const viewTimers = new WeakMap();
  const viewObserver = new IntersectionObserver(entries => {
    for (const entry of entries) {
      const card = entry.target;
      if (!entry.isIntersecting) {
        const timer = viewTimers.get(card);
        if (timer) { clearTimeout(timer); viewTimers.delete(card); }
        continue;
      }
      if (card.dataset.viewRecorded || viewTimers.has(card)) continue;
      viewTimers.set(card, setTimeout(() => {
        card.dataset.viewRecorded = '1';
        markViewed(card);
      }, 1000));
    }
  }, {threshold: 0.6});

  // —— 自评系统：简答/论述/材料/翻译等非选择题，展开答案后可自评 ——
  const SELF_LABELS = {correct: '自评：答对 ✓', partial: '自评：部分掌握', wrong: '自评：需复习'};
  function injectSelfAssess(card) {
    if (card.querySelector('.unified-self-assess')) return;
    if (card.querySelector('.option,.fill-input-wrap')) return;  // 选择题/填空题走自动判题
    const key = card.dataset.unifiedReady;
    const current = key ? state.progress[key] : null;
    const picked = current && current.result ? current.result : '';
    const wrap = document.createElement('div');
    wrap.className = 'unified-self-assess' + (picked ? ' done' : '');
    const label = document.createElement('span');
    label.className = 'usa-label';
    label.textContent = picked ? SELF_LABELS[picked] : '自评：';
    wrap.appendChild(label);
    if (!picked) {
      [['correct', '我答对了'], ['partial', '部分掌握'], ['wrong', '需要复习']].forEach(([value, text]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.self = value;
        button.textContent = text;
        button.addEventListener('click', event => {
          event.stopPropagation();
          record(card, {self: value});
          label.textContent = SELF_LABELS[value];
          wrap.classList.add('done');
          [...wrap.querySelectorAll('button')].forEach(btn => btn.remove());
        });
        wrap.appendChild(button);
      });
    }
    card.appendChild(wrap);
  }
  function prepareCard(card) {
    if (!card || !card.dataset.unifiedReady) return;
    const answerNode = card.querySelector('.answer');
    // 答案是否已展开：改写题 details 看 open；翻译题看 .show（translation-item 标记）；思政/计算机渲染即展开
    const answerShown = answerNode && (
      typeof answerNode.open === 'boolean' ? answerNode.open
      : card.classList.contains('translation-item') ? answerNode.classList.contains('show')
      : true
    );
    if (answerShown || state.progress[card.dataset.unifiedReady]?.result) injectSelfAssess(card);
    if (!card.dataset.viewRecorded) viewObserver.observe(card);
  }
  // 改写题用原生 <details> 展开答案（无按钮可委托），监听 toggle 事件挂自评
  document.addEventListener('toggle', event => {
    const details = event.target;
    if (!details || details.tagName !== 'DETAILS') return;
    const card = details.closest(cardSelector);
    if (!card || !card.dataset.unifiedReady || !details.open) return;
    setTimeout(() => { record(card, undefined); prepareCard(card); }, 0);
  }, true);

  /* ---------- 学习活跃遥测（2026-08-22，排行榜数据源） ----------
   * 答题成功后本地累计计数，每 60s 心跳上报 /api/activity：
   *   登录（WaiyuanAuth 会话）→ Bearer（user:{id}）；匿名 → deviceId（64 hex，本地生成一次）
   * 服务端据此聚合「日/周最长使用用户」与「最多学习内容」排行。 */
  const TELEMETRY_KEY = 'waiyuan-telemetry-v1';
  function deviceId() {
    try {
      let id = localStorage.getItem('waiyuan-device-id');
      if (!id) {
        id = Array.from(crypto.getRandomValues(new Uint8Array(32)), b => b.toString(16).padStart(2, '0')).join('');
        localStorage.setItem('waiyuan-device-id', id);
      }
      return id;
    } catch (_) { return '0'.repeat(64); }
  }
  function bumpLearned(n) {
    try {
      const raw = JSON.parse(localStorage.getItem(TELEMETRY_KEY) || '{}');
      raw.learned = (raw.learned | 0) + (n || 1);
      raw.updatedAt = Date.now();
      localStorage.setItem(TELEMETRY_KEY, JSON.stringify(raw));
    } catch (_) {}
  }
  let hbFailStreak = 0;  // 连续失败次数（指数退避）
  const hbBaseMs = () => Number(self.WAIYUAN_HEARTBEAT_MS || 60000);
  const hbDelayMs = () => Math.min(hbBaseMs() * Math.pow(2, Math.min(hbFailStreak, 4)), 300000);  // 退避上限 5 分钟
  async function heartbeat() {
    try {
      const raw = JSON.parse(localStorage.getItem(TELEMETRY_KEY) || '{}');
      const learned = raw.learned | 0;
      const headers = { 'Content-Type': 'application/json' };
      let body;
      try {
        const session = self.WaiyuanAuth && self.WaiyuanAuth.getSession ? self.WaiyuanAuth.getSession() : null;
        if (session && session.token) { headers.Authorization = 'Bearer ' + session.token; body = { learned }; }
        else body = { deviceId: deviceId(), learned };
      } catch (_) { body = { deviceId: deviceId(), learned }; }
      const base = (self.WAIYUAN_API_BASE || 'https://api.free60127.top').replace(/\/$/, '');
      const res = await fetch(base + '/api/activity', { method: 'POST', headers, body: JSON.stringify(body), keepalive: true });
      if (res.ok && learned > 0) {
        // 发送成功后才清零；失败保留计数，下次心跳补报（防丢失学习条数）
        raw.learned = 0;
        localStorage.setItem(TELEMETRY_KEY, JSON.stringify(raw));
      }
      hbFailStreak = 0;
    } catch (_) {
      hbFailStreak++;  // 网络失败：保留 learned，按退避间隔重试
    }
    setTimeout(heartbeat, hbDelayMs());
  }
  setTimeout(heartbeat, hbBaseMs());

  function record(card, result) {
    if (!card?.dataset.unifiedReady) return;
    const key = card.dataset.unifiedReady;
    const old = state.progress[key] || {};
    const now = Date.now();
    const self = result && typeof result === 'object' ? result.self : null;
    const auto = result === true || result === false;
    const answeredNow = auto || !!self;
    state.progress[key] = {
      ...old,
      key,
      title: card.dataset.unifiedTitle || questionText(card) || old.title || '',
      page: document.title,
      path: location.pathname,
      scope: card.dataset.unifiedScope || old.scope || 'bank',
      reviewed: true,
      viewed: old.viewed || answeredNow,  // 看过（视口停留 1s）或本次作答才算已浏览；未看过的题保持未浏览
      answered: answeredNow || old.answered || false,
      ok: auto ? (result === true) : self ? (self === 'correct') : old.ok,
      wrong: auto ? (result === false) : self ? (self === 'wrong') : old.wrong,
      result: self ? self : auto ? undefined : old.result,
      attempts: (old.attempts || 0) + (answeredNow ? 1 : 0),
      updatedAt: now
    };
    save(state);
    if (answeredNow) bumpLearned(1);  // 答题计数（排行榜「最多学习内容」数据源）
  }

  function resultFromCard(card) {
    const wrong = card.querySelector('.option.wrong,.wrong.option,[data-state="wrong"]');
    const correct = card.querySelector('.option.correct,.correct.option,[data-state="correct"]');
    if (wrong) return false;
    if (correct) return true;
    return null;
  }

  // —— 填空判题：规范化比较（大小写/全角半角/首尾与连续空白/中英文标点）。
  //    分号语义由题干空位数决定（题干里每段连续下划线算一个空）：
  //      · 多空题（≥2 个空）：分号分隔各空答案，必须逐空完整填写；
  //        每空内部可用 "/" 列出多个可接受值（如 "by/from"），
  //        带序号前缀的答案 "(1) individualism" 与 "individualism" 视为等价。
  //      · 单空题（1 个空）：分号 = 该空的多个同义答案，填任一即判对。
  //    逗号/顿号是答案文本的组成部分（如 "a, the, with" 必须完整填写），不能拆开。
  //    页面可通过 data-fill-mode="all-blanks" | "any" 显式覆盖自动判定。
  const normalizeAnswer = text => String(text || '')
    .replace(/[\uFF01-\uFF5E]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))  // 全角→半角
    .replace(/\u3000/g, ' ')
    .replace(/[，。；：！？、]/g, ch => ({'，': ',', '。': '.', '；': ';', '：': ':', '！': '!', '？': '?', '、': ','}[ch]))
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
  // 去掉 "(1) xxx" 这类序号前缀（题干带编号的空位，序号只是位置标记，不参与内容比对）
  const stripBlankNo = text => text.replace(/^\(\d+\)\s*/, '');
  function judgeFill(card, inputValue) {
    const raw = card.dataset.fillAnswers || '';
    if (!raw) return null;
    const input = normalizeAnswer(inputValue);
    const whole = normalizeAnswer(raw);
    if (!input || !whole) return null;
    // 完整填写直接判对（容忍分号两侧空格差异："on;from" ≡ "on; from"）
    if (whole === input || whole.replace(/\s*;\s*/g, ';') === input.replace(/\s*;\s*/g, ';')) return true;
    const parts = whole.split(/\s*;\s*/).filter(Boolean);
    if (parts.length <= 1) return false;  // 无分号答案：必须是完整文本（逗号等不可拆分）
    // 空位数：题干中每段连续下划线算一个空（"_____" / "______" 都算 1 个）
    const stem = normalizeAnswer(card.dataset.unifiedTitle || questionText(card) || '');
    const blankCount = (stem.match(/_+/g) || []).length;
    const mode = card.dataset.fillMode || (blankCount >= 2 ? 'all-blanks' : 'any');
    if (mode === 'all-blanks') {
      // 多空题：分号分隔逐空作答，空数必须一致，每空匹配该空的任一可接受值
      const inputParts = input.split(/\s*;\s*/).filter(Boolean);
      if (inputParts.length !== parts.length) return false;
      return parts.every((part, i) => {
        const variants = part.split('/').map(v => stripBlankNo(v.trim()));
        return variants.includes(stripBlankNo(inputParts[i]));
      });
    }
    // 单空题：分号 = 多个同义答案，填任一即判对
    return parts.some(part => part === input);
  }
  function handleFillSubmit(target) {
    const card = target.closest(cardSelector);
    if (!card) return;
    const input = card.querySelector('.fill-input');
    const value = input ? input.value : '';
    const result = judgeFill(card, value);
    if (result === null) { if (input) input.focus(); return; }
    let feedback = card.querySelector('.fill-feedback');
    if (!feedback) { feedback = document.createElement('div'); feedback.className = 'fill-feedback'; card.appendChild(feedback); }
    if (result) { feedback.textContent = '✓ 回答正确'; feedback.className = 'fill-feedback correct'; }
    else { feedback.textContent = '✗ 未完全正确，可展开答案对照后重试'; feedback.className = 'fill-feedback wrong'; }
    record(card, result);
  }

  document.addEventListener('click', event => {
    const target = event.target.closest('button,[data-action]');
    if (!target) return;
    if (target.dataset.action === 'fill-submit') { handleFillSubmit(target); return; }
    const card = target?.closest(cardSelector);
    if (!card || target?.classList.contains('unified-favorite')) return;
    const action = target.dataset.action || '';
    const isAnswer = target.matches('.answer-toggle,[data-action="answer"],[data-action="toggle-answer"]');
    const isAttempt = target.matches('.option,.confirm,[data-action="choose"],[data-action="confirm"]');
    if (!isAnswer && !isAttempt && !/answer|choose|confirm/i.test(action)) return;
    setTimeout(() => {
      // 思政/计算机判题后整卡重渲染（页面 render() 可能异步），事件目标已脱离 DOM。
      // 统一策略：等「增强就绪 + 判题完成」后再记录一次——
      //   定位：优先点击坐标反查新卡（判题不改变卡片位置），失败按 key（确定性哈希）或标题匹配；
      //   就绪但未判题（页面重绘尚未完成）→ 继续轮询，最多 12 次 × 150ms，避免把空结果写进进度。
      const waitKey = card.dataset.unifiedReady || '';
      const waitTitle = card.dataset.unifiedTitle || questionText(card);  // 旧引用仍在内存，标题可读
      let tries = 0;
      const attempt = () => {
        tries++;
        let node = null;
        try {
          const hit = document.elementFromPoint(event.clientX, event.clientY);
          if (hit) { const hitCard = hit.closest(cardSelector); if (hitCard) node = hitCard; }
        } catch (_) {}
        if (!node || !node.dataset.unifiedReady) {
          if (tries === 1) { try { enhance(); } catch (_) {} }  // 快速作答（早于 80ms 增强防抖）时立即补一次（幂等）
          const all = [...document.querySelectorAll(cardSelector)];
          node = waitKey
            ? all.find(item => item.dataset.unifiedReady === waitKey)
            : all.find(item => item.dataset.unifiedTitle === waitTitle);
        }
        if (!node || !node.dataset.unifiedReady) {
          if (tries < 12) setTimeout(attempt, 150);
          return;
        }
        const result = resultFromCard(node);
        if (result === null) {
          if (tries < 12) setTimeout(attempt, 150);  // 页面判题尚未完成，等重绘后重试
          return;
        }
        record(node, result === undefined ? undefined : result);
        prepareCard(node);  // 展开答案后挂自评按钮
      };
      setTimeout(attempt, 0);
    }, 0);
  });

  function showFocusNotice() {
    const notice = document.createElement('div');
    notice.className = 'unified-focus-notice';
    notice.setAttribute('role', 'alert');
    const close = document.createElement('button');
    close.type = 'button';
    close.textContent = '知道了';
    close.addEventListener('click', () => notice.remove());
    notice.append('未能定位到要复习的题目：题库可能已更新，旧的学习记录定位已失效。你可以忽略此提示，继续正常刷题。', close);
    document.body.appendChild(notice);
  }

  // —— focus 定位：卡片未渲染时（题库首页/折叠单元）先广播给页面应用，
  //    由页面打开目标题库/单元；随后轮询等待卡片出现（约 12 秒），仍无则提示 ——
  function focusQuestion() {
    if (focusHandled || !focusKey) return;
    const card = findCardByKey(focusKey);
    if (card) {
      focusHandled = true;
      card.classList.add('unified-review-target');
      card.scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
    if (!focusEmitted) {
      focusEmitted = true;
      window.dispatchEvent(new CustomEvent('waiyuan:focus', {detail: {key: focusKey}}));
    }
    if (!focusRetryTimer) {
      let attempts = 0;
      focusRetryTimer = setInterval(() => {
        attempts++;
        const retry = findCardByKey(focusKey);
        if (retry) {
          clearInterval(focusRetryTimer); focusRetryTimer = null;
          focusHandled = true;
          retry.classList.add('unified-review-target');
          retry.scrollIntoView({behavior:'smooth',block:'center'});
        } else if (attempts >= 6) {
          clearInterval(focusRetryTimer); focusRetryTimer = null;
          focusHandled = true;
          showFocusNotice();
        }
      }, 2000);
    }
  }
  function enhance() {
    const cards = [...observeRoot().querySelectorAll(cardSelector)];
    cards.forEach(card => { enhanceCard(card); prepareCard(card); });
    // Only show the floating random-question button on pages that actually
    // contain question cards (the homepage has none and must not show it).
    randomButton.style.display = cards.length ? '' : 'none';
    focusQuestion();
  }
  function randomQuestion() { const cards = [...observeRoot().querySelectorAll(cardSelector)].filter(card => card.offsetParent !== null); if (!cards.length) return; cards[Math.floor(Math.random()*cards.length)].scrollIntoView({behavior:'smooth',block:'center'}); }

  // 纠错菜单定位：fixed 相对纠错按钮，右对齐；按钮上方放不下（如文档展开后第一题在页面顶部）时自动翻转到下方，避免被视口/其他 UI 遮挡
  const positionFeedbackMenu = (menu, anchor) => {
    const vw = document.documentElement.clientWidth;
    const vh = document.documentElement.clientHeight;
    const rect = anchor.getBoundingClientRect();
    const w = Math.min(menu.offsetWidth || 280, vw - 16);
    const h = menu.offsetHeight || 200;
    menu.style.left = `${Math.max(8, Math.min(rect.right - w, vw - w - 8))}px`;
    menu.style.top = 'auto';
    menu.style.bottom = 'auto';
    if (rect.top - h - 6 >= 8) {
      menu.style.bottom = `${vh - rect.top + 6}px`;   // 按钮上方弹出
    } else {
      menu.style.top = `${Math.min(rect.bottom + 6, vh - 8)}px`;  // 上方放不下 → 按钮下方弹出
    }
  };

  // 在线页面加载独立样式；离线单文件构建会预先内联同名 style，避免再请求外部文件。
  const loadQuizStyles = () => {
    if (document.querySelector('link[data-unified-quiz-style], style[data-unified-quiz-style]')) return;
    const currentScript = document.currentScript;
    // 继承本脚本的 ?v= 版本号：SW cache-first 下无版本参数的 css 会永久缓存旧版。
    let versionQuery = '';
    try {
      const match = currentScript && currentScript.src && currentScript.src.match(/[?&]v=([^&#]*)/);
      if (match) versionQuery = '?v=' + match[1];
    } catch (error) { /* 解析失败不阻塞样式加载 */ }
    const href = currentScript && currentScript.src
      ? new URL('unified-quiz-engine.css' + versionQuery, currentScript.src).href
      : 'unified-quiz-engine.css';
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = href;
    link.dataset.unifiedQuizStyle = 'true';
    document.head.appendChild(link);
  };
  loadQuizStyles();
  const randomButton = document.createElement('button'); randomButton.className='unified-random-web'; randomButton.textContent='↻ 随机一题'; randomButton.addEventListener('click',randomQuestion); randomButton.style.display='none'; document.body.appendChild(randomButton);
  // 观察范围限定题库容器（#app），避免全站 body 子树监听；
  // 回调做 80ms 防抖，展开大单元（数百卡片）时不会反复全量扫描。
  const observeRoot = () => document.getElementById('app') || document.body;
  let observeTimer = null;
  const scheduleEnhance = () => {
    if (observeTimer) return;
    observeTimer = setTimeout(() => { observeTimer = null; enhance(); }, 80);
  };
  const observer = new MutationObserver(scheduleEnhance);
  observer.observe(observeRoot(), {childList:true, subtree:true});
  enhance(); save(state);
  window.WaiyuanQuizEngine = {state, save, enhance, randomQuestion, record, computeKey, focusKey};
})();
</script>
</body>
</html>
