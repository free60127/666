<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#28634f">
  <title>统一学习中心 · 外院知识分享站</title>
  <link rel="stylesheet" href="style.css?v=20260824-0741">
  <link rel="stylesheet" href="../reading-tools.css?v=20260824-0741" data-reading-tools-asset>
<script data-theme-boot>(function(){var t;try{t=localStorage.getItem('waiyuan-web-theme-v1')}catch(e){}if(t!=='dark'&&t!=='light'){try{t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){t='light'}}document.documentElement.dataset.theme=t})();</script>
  <meta name="description" content="外院知识分享站 · 统一学习中心：课程题库、学习工具与专业资料，免费分享持续更新。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="外院知识分享站">
  <meta property="og:title" content="统一学习中心 · 外院知识分享站">
  <meta property="og:description" content="外院知识分享站 · 统一学习中心：课程题库、学习工具与专业资料，免费分享持续更新。">
  <meta property="og:url" content="https://free60127.top/%E5%AD%A6%E4%B9%A0%E4%B8%AD%E5%BF%83/index.html">
  <meta property="og:image" content="https://free60127.top/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body data-reading-tools="true">
  <main class="shell">
    <a class="back" href="../index.html">‹ 返回知识分享站</a>
    <header>
      <p>PERSONAL STUDY</p>
      <h1>统一学习中心</h1>
      <div>学习记录保存在当前浏览器中。</div>
      <div class="auth-bar" id="auth-bar">
        <button type="button" data-action="auth-open" id="auth-open-btn">👤 登录 / 注册</button>
        <button type="button" id="auth-email" hidden data-action="auth-open" class="auth-email-btn"></button>
        <button type="button" data-action="auth-logout" id="auth-logout-btn" hidden>退出登录</button>
      </div>
      <section id="auth-panel" class="cloud-panel" hidden aria-label="账号登录">
        <div class="auth-tabs">
          <button type="button" data-auth-tab="login" class="active">登录</button>
          <button type="button" data-auth-tab="register">注册</button>
        </div>
        <div class="auth-fields" id="auth-login-view">
          <input id="auth-email-input" type="email" autocomplete="email" placeholder="邮箱（同学之间不重复）">
          <input id="auth-password-input" type="password" autocomplete="current-password" placeholder="密码（至少 8 位）">
          <input id="auth-nickname-input" type="text" autocomplete="nickname" placeholder="昵称（可选）" hidden>
          <button type="button" data-action="auth-submit" id="auth-submit-btn">登录</button>
          <button type="button" class="auth-link" data-action="auth-forgot" id="auth-forgot-link">忘记密码？</button>
        </div>
        <div class="auth-fields" id="auth-forgot-view" hidden>
          <input id="auth-forgot-email" type="email" autocomplete="email" placeholder="注册邮箱">
          <button type="button" data-action="auth-forgot-send" id="auth-forgot-send-btn">发送验证码</button>
          <button type="button" class="auth-link" data-action="auth-forgot-back" id="auth-forgot-back">‹ 返回登录</button>
        </div>
        <div class="auth-fields" id="auth-reset-view" hidden>
          <input id="auth-reset-email" type="email" autocomplete="email" placeholder="注册邮箱">
          <input id="auth-reset-code" type="text" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="8 位验证码">
          <input id="auth-reset-password" type="password" autocomplete="new-password" placeholder="新密码（至少 8 位）">
          <input id="auth-reset-recovery" type="text" autocomplete="off" spellcheck="false" placeholder="原恢复码（选填，保留云端数据）">
          <button type="button" data-action="auth-reset-submit" id="auth-reset-submit-btn">重置密码</button>
          <button type="button" class="auth-link" data-action="auth-forgot-back" id="auth-reset-back">‹ 返回登录</button>
        </div>
        <div class="auth-fields" id="auth-manage-view" hidden>
          <input id="auth-old-password" type="password" autocomplete="current-password" placeholder="当前密码">
          <input id="auth-new-password" type="password" autocomplete="new-password" placeholder="新密码（至少 8 位）">
          <button type="button" data-action="auth-change-submit" id="auth-change-submit-btn">修改密码</button>
          <input id="auth-delete-password" type="password" autocomplete="current-password" placeholder="输入密码确认注销">
          <button type="button" class="danger" data-action="auth-delete-open" id="auth-delete-open-btn">注销账号</button>
          <button type="button" class="danger" data-action="auth-delete-submit" id="auth-delete-submit-btn" hidden>确认注销（云端数据将删除，不可恢复）</button>
        </div>
        <p class="cloud-tip" id="auth-hint">登录后，本机恢复码会用你的密码加密存入账号：换设备登录同一账号，云端学习数据自动解锁，无需再手抄恢复码。密码即钥匙，忘记密码 = 云端数据需原恢复码才能解锁，请自行记牢。修改密码会自动重新加密恢复码；注销账号会删除账号与云端备份。</p>
      </section>
      <div class="data-tools" aria-label="学习数据管理">
        <button type="button" data-action="cloud-backup">☁ 云端备份</button>
        <button type="button" data-action="cloud-restore">☁ 云端恢复</button>
        <button type="button" class="danger" data-action="cloud-clear">清除云端</button>
        <button type="button" data-action="export">导出学习数据</button>
        <button type="button" data-action="import">导入学习数据</button>
        <button type="button" data-action="remind" id="remind-toggle">开启错题提醒</button>
        <button type="button" class="danger" data-action="clear">清空本地数据</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
      <p id="data-status" class="data-status" aria-live="polite"></p>
      <section id="cloud-panel" class="cloud-panel" hidden aria-label="云端同步">
        <div class="cloud-row">
          <b>☁ 云端恢复码</b>
          <code id="cloud-code">（备份后自动生成）</code>
          <button type="button" data-action="copy-code" id="copy-code-btn" disabled>复制恢复码</button>
        </div>
        <p class="cloud-tip">恢复码是云端数据的唯一钥匙（随机生成、加密传输存储，站点也无法读取内容）。请复制保存到记事本或密码管理器——换设备、清浏览器后输入恢复码即可取回学习数据。</p>
        <div class="cloud-restore-row">
          <input id="cloud-code-input" type="text" autocomplete="off" spellcheck="false" placeholder="粘贴恢复码，把云端数据恢复到这台设备">
          <button type="button" data-action="cloud-restore-go">从云端恢复</button>
        </div>
      </section>
    </header>
    <nav class="tabs" aria-label="学习中心视图">
      <button data-view="overview">学习概览</button>
      <button data-view="favorites">我的收藏 <span id="favorite-count">0</span></button>
      <button data-view="mistakes">统一错题 <span id="mistake-count">0</span></button>
    </nav>
    <div id="app"></div>
  </main>
  <script src="cloud-sync.js?v=20260824-0741"></script>
  <script src="auth.js?v=20260824-0741"></script>
  <script src="../auth-ui.js?v=20260824-0741"></script>
  <script src="app.js?v=20260824-0741"></script>
  <script defer src="../reading-tools.js?v=20260824-0741" data-reading-tools-asset></script>
  <link rel="stylesheet" href="../theme.css">
  <script defer src="../common.js" data-common-injected></script>
  <link rel="stylesheet" href="../tomato-timer.css?v=20260824-0741">
  <script defer src="../tomato-timer.js?v=20260824-0741" data-tomato-injected></script>
</body>
</html>
